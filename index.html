'w11-0':'With **4 yes, 2 undecided, and 3 no**, you\'re one short of 5. The move: **meet with the undecided members** and win at least one.',
'w11-1':'A veto override takes **6 of 9**. With **6 solid yes votes**, you can **likely override the veto**, if all 6 hold.',
'w11-2':'**Council Central Staff** are **nonpartisan experts** who analyze bills and budgets for every member.',
'w11-3':'Council members can\'t fire department heads. Their strongest tools are **oversight hearings** and the **budget**, which can **direct or restrict funding**.',
'w11-4':'Police and other **union contracts are negotiated by the mayor\'s office**, then **approved by the council**. The council doesn\'t sit at the bargaining table.',
'w11-5':'Three parts of the job. **Lawmaking**: writing and amending bills. **Budget**: moving or cutting money. **Constituent services**: fixing permits and streetlights.',
'w11-6':'An inside-outside strategy: **public pressure gives an elected official leverage** to win votes they couldn\'t win alone.',
'w11-7':'Trading support, like adding an amendment for a colleague\'s district to win their vote, is called **logrolling**.',
'w11-8':'A **whip count** is a **list of where every member stands on a bill before the vote**: yes, no, or undecided.',
'w11-9':'When you accept a partial win, good practice is to **explain the tradeoff to the people who elected you** and **say what you\'ll push for next**.',
'w11-10':'In Seattle, **city department heads report to the mayor**. Council members act through laws, the budget, and oversight.',
'w11-11':'Short one vote? **Find out what the undecided members need** through one-on-ones, look for **amendments that win one without gutting the bill**, and build **outside pressure from groups in their districts**.',
/* h1 */
'h1-0':'The **Three-Fifths Compromise** counted three-fifths of enslaved people when handing out House seats. Since electoral votes follow House seats, **counting them raised slave states\' seats and electoral votes**, even though enslaved people had no rights at all.',
'h1-1':'In **Dred Scott v. Sandford** (1857), the Supreme Court ruled that **Black Americans could not be citizens** and that **Congress couldn\'t ban slavery in the territories**. It helped push the country toward war.',
'h1-2':'The order: the **Three-Fifths Compromise** (1787), the **Dred Scott decision** (1857), the **Emancipation Proclamation** (1863), the **14th Amendment** ratified (1868), and the **Compromise of 1877**.',
'h1-3':'The **Emancipation Proclamation** (1863) freed enslaved people only in **areas in rebellion** against the Union. Slavery ended everywhere with the **13th Amendment** in 1865.',
'h1-4':'The Reconstruction Amendments. **13th**: ended slavery, except as punishment for a crime. **14th**: birthright citizenship and equal protection. **15th**: no denying the vote based on race.',
'h1-5':'The 14th Amendment says **no State** may deny due process or equal protection. That phrase lets courts **apply rights against state governments**, which is why it\'s cited so often.',
'h1-6':'**Hiram Revels** of **Mississippi** became the **first Black U.S. senator** in **1870**, during Reconstruction.',
'h1-7':'In the **Compromise of 1877**, Democrats accepted **Rutherford Hayes** as president, and **federal troops left the South**, ending Reconstruction.',
'h1-8':'After Reconstruction, Southern states used **poll taxes, literacy tests, and violence**. The rules didn\'t mention race on paper, so they dodged the 15th Amendment while blocking Black voters.',
'h1-9':'The **14th Amendment\'s Citizenship Clause** (1868) says everyone **born on U.S. soil** is a citizen. It overturned **Dred Scott**, and today\'s birthright citizenship fights are arguments about what that clause means.',
/* h2 */
'h2-0':'The **Sherman Antitrust Act** (1890) targeted **monopolies and trusts** that crushed competition, like Standard Oil.',
'h2-1':'In **Lochner v. New York** (1905), the Court struck down a **limit on bakers\' working hours**, saying it violated "**freedom of contract**." The "Lochner era" blocked many labor laws until 1937.',
'h2-2':'In **1920**, **Eugene Debs** won nearly a million votes **from a federal prison cell**. He was jailed for a speech **opposing World War I**.',
'h2-3':'Milwaukee\'s **"sewer socialists"** won elections by delivering **practical city services**: clean water, sewers, parks, and honest government.',
'h2-4':'**Washington** adopted the citizen **initiative and referendum** in **1912**, during the Progressive Era. That\'s why state voters still pass laws directly.',
'h2-5':'Progressive-Era amendments. **16th** (1913): federal income tax. **17th** (1913): voters elect senators directly, instead of state legislatures. **19th** (1920): no denying the vote based on sex.',
'h2-6':'**Direct primaries** let **voters, not party bosses**, choose each party\'s nominees.',
'h2-7':'**Eugene Debs** won about **6%** in **1912**, roughly **one vote in 17**. The Socialists were a real minor party with officials across the country, but never close to winning the White House.',
'h2-8':'The **Haymarket affair** (Chicago, 1886) grew out of the fight for the 8-hour day. It\'s why much of the world marks **May Day**, **International Workers\' Day**.',
'h2-9':'The Progressives **changed the rules of the game**: primaries, initiatives, and new amendments. **Movements and muckraking** made problems visible enough to force the changes.',
/* h3 */
'h3-0':'The **National Labor Relations Act**, or **Wagner Act** (1935), protects workers\' **right to form unions** and created the **NLRB**.',
'h3-1':'The big three New Deal laws. **Social Security Act**: old-age pensions and unemployment insurance. **Wagner Act**: right to organize, the NLRB. **Fair Labor Standards Act**: minimum wage and the 40-hour week.',
'h3-2':'FDR\'s 1937 **court-packing plan** stalled and **Congress rejected it**. But that same year **the Court began upholding New Deal laws**, sometimes called "the switch in time."',
'h3-3':'To win **Southern Democrats\'** votes, the laws **left out farm and domestic workers**. In the South, most of those workers were **Black**.',
'h3-4':'The **Fair Labor Standards Act** of **1938** set the **first federal minimum wage** (25 cents an hour), the 40-hour week, and limits on child labor.',
'h3-5':'The **FDIC** (1933) **insures bank deposits**, so a bank failure doesn\'t wipe out savers. It ended the wave of bank runs.',
'h3-6':'The **New Deal coalition**: **unions, city immigrants, Southern whites, and Black voters**. It kept Democrats on top for decades.',
'h3-7':'After the Wagner Act, union membership went from about **11%** of workers in 1934 to about **33%** by 1945. It **roughly tripled**.',
'h3-8':'A **critical election**, like **1932**, **builds a new majority coalition** that lasts for decades. Political scientists call it a realignment.',
'h3-9':'The New Deal\'s gains were **real but unequal**: Social Security and labor rights lifted millions, but **farm and domestic workers were left out** and programs were often segregated, so **Black Americans got far less**.',
/* h4 */
'h4-0':'The **Montgomery Bus Boycott** (1955–56) came after Brown v. Board. It showed that **organized mass action** could force change when a court win alone stalled.',
'h4-1':'The **March on Washington for Jobs and Freedom** (1963) was organized by **A. Philip Randolph** and **Bayard Rustin**.',
'h4-2':'The **Civil Rights Act of 1964** passed only after supporters **broke a Senate filibuster of about 60 days**.',
'h4-3':'Three laws. **Civil Rights Act (1964)**: no discrimination in jobs or public places like restaurants and hotels. **Voting Rights Act (1965)**: banned literacy tests, required federal approval of voting changes in some places. **Fair Housing Act (1968)**: housing.',
'h4-4':'Both **Medicare and Medicaid** were created in **1965**, part of Lyndon Johnson\'s **Great Society**.',
'h4-5':'The order: **Brown v. Board** (1954), the **Montgomery Bus Boycott** (1955), the **March on Washington** (1963), the **Civil Rights Act** (1964), and the **Voting Rights Act** (1965).',
'h4-6':'At **Selma** in **1965**, state troopers **attacked peaceful voting-rights marchers on the Edmund Pettus Bridge**. National outrage helped pass the Voting Rights Act.',
'h4-7':'After the civil rights laws, many **white Southerners shifted from Democrats to Republicans**, a change that took decades.',
'h4-8':'At Howard University in 1965, Johnson argued that **legal equality isn\'t enough**: people held back for generations need **real opportunity to catch up**.',
'h4-9':'The March on Washington demanded **jobs and a higher minimum wage** alongside voting rights. Its organizers saw **racial and economic justice as tied together**, a point often left out of how it\'s remembered.',
/* h5 */
'h5-0':'The **Gulf of Tonkin Resolution** (1964) let President Johnson **escalate the Vietnam War without a declaration of war**.',
'h5-1':'Young people could be **drafted at 18** but **couldn\'t vote until 21**. The **26th Amendment** (1971) lowered the voting age to 18.',
'h5-2':'The Watergate order: the **break-in** (1972), **Senate hearings** expose the cover-up (1973), the **Supreme Court orders the tapes** released (1974), **Nixon resigns** (August 1974), and **Ford pardons** him.',
'h5-3':'Post-Watergate reforms. **War Powers Resolution**: limits on troops without Congress. **Impoundment Control Act**: no refusing to spend. **FECA amendments**: created the FEC. **FISA**: a secret court for spy warrants.',
'h5-4':'Congress passed the **War Powers Resolution** in 1973 **over Nixon\'s veto**.',
'h5-5':'Under the **Impoundment Control Act**, if a President wants to cancel approved money, **Congress must approve within 45 days**, or **the money must be spent**.',
'h5-6':'The **Church Committee** (1975) found **intelligence agencies spying on Americans**, including Martin Luther King Jr. and other civil rights leaders.',
'h5-7':'These 1970s laws are back in the news because **presidents keep testing them**, especially on **war powers** and **refusing to spend** money Congress approved.',
'h5-8':'Ford\'s **pardon** of Nixon **ended any federal prosecution** of him for Watergate.',
'h5-9':'After Vietnam and Watergate, Congress decided **presidents had too much unchecked power**, so it passed **War Powers**, **Impoundment Control**, and **FISA** to add limits and oversight.',
/* h6 */
'h6-0':'Nixon\'s "**Southern strategy**" meant **appealing to white Southern voters unhappy with civil rights changes**.',
'h6-1':'In **1981**, Reagan fired more than 11,000 striking **air traffic controllers** in the **PATCO** union.',
'h6-2':'Union membership fell from **20.1%** of workers in 1983 to **9.9%** in 2024. It\'s been **cut roughly in half**.',
'h6-3':'Reagan **cut the top income tax rate from 70% to 28%** by 1988.',
'h6-4':'The **Federalist Society** (1982) built a **pipeline of conservative lawyers who became judges**, including several Supreme Court justices.',
'h6-5':'In **1987** the **Senate rejected Robert Bork** for the Supreme Court, 58 to 42. It became a turning point in confirmation fights.',
'h6-6':'Clinton-era policy. **NAFTA** (1994): removed most tariffs with Canada and Mexico; many unions opposed it over factory jobs. **Welfare reform** (1996): replaced AFDC with time-limited **TANF**, with work requirements.',
'h6-7':'The **New Democrats** of the 1990s, like Bill Clinton, moved the party **toward the center on trade, crime, and welfare**.',
'h6-8':'As the South went Republican, conservative Democrats faded, so the **parties became more ideologically uniform**. That\'s a key cause of polarization.',
'h6-9':'When Reagan **fired and permanently replaced** the PATCO strikers, many private employers copied him, making **strikes far riskier**. It helped start decades of **union decline**.',
/* h7 */
'h7-0':'In **1994**, Republicans won a **majority in the House** for the first time in **40 years**, led by Newt Gingrich.',
'h7-1':'The **Affordable Care Act** (2010) passed with **only Democratic votes**. No Republican voted for it.',
'h7-2':'The order: the **Contract with America** (1994), the **Patriot Act** (2001), the **Affordable Care Act** (2010), **Merrick Garland** blocked (2016), and the **January 6 attack** (2021).',
'h7-3':'In 2016 the Senate majority blocked **Merrick Garland** simply by **not acting**: no hearing, no vote. It showed a majority could stop a nominee without a rejection vote.',
'h7-4':'The **Tea Party** began in **2009** against taxes and spending and helped Republicans win in **2010**. **Occupy Wall Street** began in **2011** in a New York park and popularized "**the 99%**."',
'h7-5':'**DSA** went from about **6,000** members in 2016 to about **90,000** in 2021: **more than tenfold**.',
'h7-6':'"**Nationalized**" elections means **voters judge even local races by their views of the national parties**.',
'h7-7':'**Zohran Mamdani**, elected mayor of **New York City** in **2025**, is a **DSA member**.',
'h7-8':'**Affective polarization** means partisans increasingly **dislike and distrust the other party**, not just disagree with it.',
'h7-9':'DSA draws on a long tradition: **Debs**, the **Milwaukee sewer socialists**, and the socialists who organized the **March on Washington**. **Sanders\'s campaigns** and anger after 2008 revived it.',
/* p1 */
'p1-0':'**Mandatory spending**, like **Social Security and Medicare**, happens automatically under existing law. **Discretionary spending**, like defense and schools, needs yearly appropriations.',
'p1-1':'The **individual income tax** brings in about **half** of federal revenue. Payroll taxes are about a third, and the corporate tax about a tenth.',
'p1-2':'A **progressive** tax takes a bigger share from higher incomes, like the **federal income tax**. A **regressive** one takes more from lower incomes, like a **flat sales tax**. **Washington\'s system as a whole is regressive**.',
'p1-3':'The **deficit** is **one year\'s gap** between spending and revenue. The **debt** is **all past borrowing added up**.',
'p1-4':'**Washington has no personal income tax.** It relies on sales, B&O, and property taxes.',
'p1-5':'A **tax expenditure** is **spending done through the tax code**. The biggest is the tax break for **employer health insurance**.',
'p1-6':'In **2023** the Washington Supreme Court upheld the **7% capital gains tax**, treating it as an **excise tax on selling assets**, not an income tax.',
'p1-7':'Washington\'s **B&O tax** is a **gross receipts** tax: it\'s charged on a business\'s **total sales, before expenses**, even if it lost money.',
'p1-8':'Seattle can\'t tax income, but voters can approve a **property tax levy lid lift** for a set purpose and number of years, like the housing levy.',
'p1-9':'With **no income tax** and heavy **sales, B&O, and property taxes**, Washington takes a **bigger share of income from low earners** than from the richest. That\'s why it\'s called "upside down."',
/* p2 */
'p2-0':'**Medicare**: people **65 and older**, run by the **federal government**. **Medicaid**: people with **low incomes**, run by **states with federal money**, called **Apple Health** in Washington.',
'p2-1':'Most Americans under 65 get coverage **through an employer**: about half of all Americans.',
'p2-2':'In **NFIB v. Sebelius** (2012), the Court let **states choose** whether to expand Medicaid. Washington expanded in 2014.',
'p2-3':'**Single payer** means **one public insurer pays for everyone\'s care**, like Medicare for All.',
'p2-4':'Washington\'s **Cascade Care** (2021) made it the **first state** to offer a **public option** plan.',
'p2-5':'The **U.S. spends about 17% of GDP** on health care. Germany spends about 13%, Canada about 12%, the U.K. about 11%.',
'p2-6':'The **ACA** (2010) **banned denying coverage over pre-existing conditions**, created marketplaces, and expanded Medicaid.',
'p2-7':'A **public option competes with private plans**. **Single payer replaces them** with one public insurer.',
'p2-8':'The **2025** federal budget law added **Medicaid work requirements** for many **expansion adults**, set to start by 2027.',
'p2-9':'Single payer: **for**, it covers everyone, cuts paperwork, and bargains prices down. **Against**, it needs big tax increases and moves millions off current plans.',
/* p3 */
'p3-0':'A household is **rent burdened** when rent takes **more than 30%** of its income. About half of U.S. renters are.',
'p3-1':'$1,800 rent on $4,000 income is **45%**. That\'s over 30%, so **yes, the family is rent burdened**.',
'p3-2':'The **Low-Income Housing Tax Credit** (LIHTC) is the **biggest federal program for building** affordable housing.',
'p3-3':'Section 8 vouchers **aren\'t guaranteed**. Only about **1 in 4** eligible households gets one.',
'p3-4':'**Adds supply**: more homes per lot, a public developer. **Protects tenants**: just cause eviction, a right to a lawyer, caps on rent increases.',
'p3-5':'In **2021** Washington became the **first state** to guarantee **a lawyer for low-income tenants facing eviction**.',
'p3-6':'**Social housing** is publicly owned and **mixed-income**, not only for the poorest. That\'s the Vienna model.',
'p3-7':'The **mortgage interest deduction** mostly helps **higher-income homeowners**, who have bigger mortgages and itemize.',
'p3-8':'A 2019 study of San Francisco found **rent control kept tenants housed** but landlords **cut rental supply by 15%**. That\'s the tradeoff.',
'p3-9':'New supply **eases the shortage over time**. Tenant protections **keep people housed now**. Many advocates want both.',
/* p4 */
'p4-0':'The NLRA **covers private-sector workers**, like warehouse workers and private hospital nurses. It **leaves out** public employees, farmworkers, and independent contractors.',
'p4-1':'**Taft-Hartley** (1947) let states pass **right-to-work laws**.',
'p4-2':'In **Janus v. AFSCME** (2018), the Court ruled **public workers can\'t be required to pay union fees**.',
'p4-3':'Washington is **not** a right-to-work state.',
'p4-4':'In 2024, **32.2%** of public-sector workers were union members, versus **5.9%** in the private sector: **about five times** as likely.',
'p4-5':'**Independent contractors aren\'t covered** by the NLRA or most wage laws. That\'s why gig drivers\' status is such a fight.',
'p4-6':'**Card check** means a union is recognized when **most workers sign cards**, if the employer agrees or the law requires it.',
'p4-7':'A **secondary boycott** is a union **pressuring a company it has no dispute with**, like a supplier. Taft-Hartley banned it.',
'p4-8':'After winning an election, a union **bargains a first contract**, which often takes **more than a year**.',
'p4-9':'Federal labor law **leaves out** gig and domestic workers, so **Seattle set its own standards**, like minimum pay for app-based drivers.',
/* p5 */
'p5-0':'**Congress** writes immigration law. States and cities can\'t set their own rules.',
'p5-1':'The **1965** Immigration and Nationality Act **ended national-origins quotas**.',
'p5-2':'**Family-based**: a citizen sponsors a spouse, a resident sponsors a child. **Employment-based**: a company sponsors a worker. **Humanitarian**: refugees and asylum seekers.',
'p5-3':'A refugee fears **persecution** for race, religion, nationality, social group, or **political opinion**. A **journalist jailed for criticizing the government** fits.',
'p5-4':'**DACA** (2012) is an **executive program**, not an act of Congress.',
'p5-5':'The **anti-commandeering** rule bars the federal government from **forcing** state or local officers, like county jailers, to enforce federal law.',
'p5-6':'The **Keep Washington Working Act** (2019) **limits state and local help with federal immigration enforcement**.',
'p5-7':'The **1986** law gave legal status to about **2.7 million** people and created **penalties for employers** who hire unauthorized workers.',
'p5-8':'Supporters say immigrants are **more likely to report crimes** if local police **aren\'t immigration agents**.',
'p5-9':'Immigration law is **federal**, so a city can\'t change who may stay. But it can **limit cooperation**, **fund legal help**, and protect access to services.',
/* p6 */
'p6-0':'In **Massachusetts v. EPA** (2007), the Court ruled **greenhouse gases are pollutants the EPA can regulate** under the Clean Air Act.',
'p6-1':'The **major questions doctrine**: **big policy shifts by agencies need clear permission from Congress**. It was used in West Virginia v. EPA (2022).',
'p6-2':'**Carbon tax**: a **fixed price** per ton; the amount of pollution isn\'t certain. **Cap-and-trade**: a **limit** on total emissions; companies **buy and sell allowances**.',
'p6-3':'In **2024** Washington voters **rejected Initiative 2117**, so the **Climate Commitment Act stayed**.',
'p6-4':'The **Inflation Reduction Act** (2022) worked mainly through **tax credits for clean energy and electric vehicles**.',
'p6-5':'About **two-thirds** of Washington\'s electricity comes from **hydropower**.',
'p6-6':'The **Clean Energy Transformation Act** (2019) requires **100% clean electricity by 2045**.',
'p6-7':'**Seattle City Light** is **publicly owned**, so **voters, through the city**, control its rates and goals.',
'p6-8':'Money from Washington\'s cap-and-invest auctions goes to **climate and clean-transportation programs**.',
'p6-9':'Federal climate policy **swings with each election** and courts have **narrowed agency power**. **States** like Washington can pass laws, like cap-and-invest, that last.',

'p7-0':'Most incarcerated people are in **state prisons** (about 1 million) and **local jails** (about 660,000). **Federal** facilities hold about 210,000.',
'p7-1':'More than 9 in 10 convictions come from **plea bargains**, not trials.',
'p7-2':'**Gideon v. Wainwright** (1963) guarantees **a free lawyer for people who can\'t afford one** in serious criminal cases.',
'p7-3':'In **State v. Blake** (2021), Washington\'s Supreme Court struck down the **felony drug possession law**.',
'p7-4':'Washington\'s court struck down the death penalty in 2018, and the legislature **abolished it in law in 2023**.',
'p7-5':'Seattle\'s oversight. **Office of Police Accountability**: investigates complaints. **Inspector General**: audits policies and practices. **Community Police Commission**: the community\'s voice on reforms.',
'p7-6':'The **prosecutor** decides what charges a person faces.',
'p7-7':'Seattle police came under a **federal consent decree** in **2012** after a **Justice Department finding of excessive force**.',
'p7-8':'**Qualified immunity** is a **court-made rule** that shields officers from many lawsuits unless they broke clearly established law.',
'p7-9':'The council controls the **police budget**, city laws, and **oversight**. But **prosecutors, judges, state law, and the police contract** shape outcomes too.',

'u28-0':'In **Kingdon\'s multiple streams** model, a **policy window** opens when **a problem, a solution, and the politics line up**.',

'u28-2':'A **policy entrepreneur** **keeps a solution ready and pushes it when the moment comes**.',
'u28-3':'**Incrementalism** (Lindblom, 1959): most policy **changes in small steps from what already exists**.',
'u28-4':'**Policy feedback**: **policies create supporters who fight to keep them**, like retirees defending Social Security.',
'u28-5':'Pressman and Wildavsky showed that with many sign-offs, **even if each step is likely, the chance of finishing falls fast**.',
'u28-6':'**Loper Bright** (2024) ended **Chevron deference**: courts no longer defer to agencies\' reading of unclear laws.',
'u28-7':'Under the APA, an agency **proposes a rule, takes public comments, then issues a final rule**. That\'s notice and comment.',
'u28-8':'**Punctuated equilibrium**: policy **stays stable for long periods, then changes suddenly**.',
'u28-9':'Kingdon for organizers: **have a solution ready**, build support before a crisis or election, and **push hard when the window opens**, because it can close fast.',

function tone(f,t0,dur,type,vol){const a=ac();if(!a)return;const t=a.currentTime+t0;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.15,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05)}

const pr=u=>st.prog[u.id]||{d:0,t:false};
function nodeDone(n){if(n.type==='lesson')return pr(n.u).d>n.k;if(n.type==='test')return !!pr(n.u).t;return !!st.cp[n.s]}
const isLive=n=>!!SECTIONS[n.s].live;
const openSec=id=>!!(SECTIONS[id].live||SECTIONS[id].open);
const trackOf=n=>openSec(n.s)&&n.u?'s'+n.s+':'+n.u.id:'s'+n.s;
let CUR={main:-1};
function computeCur(){CUR={};for(let j=0;j<NODES.length;j++){const n=NODES[j];const tr=trackOf(n);if(CUR[tr]===undefined)CUR[tr]=-1;if(CUR[tr]===-1&&!nodeDone(n))CUR[tr]=j}}
function nodeState(i){const n=NODES[i];if(nodeDone(n))return 'done';const c=CUR[trackOf(n)];return c===i?'cur':'lock'}
function unitDone(u){return !!pr(u).t}
function curSection(){let m=0;UNITS.forEach(u=>{if(!SECTIONS[u.s].open&&!SECTIONS[u.s].live&&(pr(u).d>0||pr(u).t))m=Math.max(m,u.s)});return m}
function reachedUnits(){const r=UNITS.filter(u=>pr(u).d>0||pr(u).t);return r.length?r:[UNITS[0]]}

/* ---------- tappable glossary for highlighted terms ---------- */
// t: title, d: what it means, src: where it comes from, ex: an example, l: source link key (SRC)
const GLOSSARY={
 'commerce clause':{t:'Commerce Clause',d:'Gives Congress power to regulate trade with other countries, among the states, and with Native American tribes. It\'s the basis for much of modern federal law.',src:'Article I, Section 8, Clause 3: Congress may "regulate Commerce with foreign Nations, and among the several States, and with the Indian Tribes."',ex:'The Civil Rights Act of 1964 banned segregation in hotels and restaurants under this clause, because they serve interstate travelers.',l:'con',a:['interstate commerce']},
 'habeas corpus':{t:'Habeas corpus',d:'Latin for "you have the body." A court order making the government bring a jailed person before a judge and justify holding them.',src:'Article I, Section 9: it "shall not be suspended, unless when in Cases of Rebellion or Invasion the public Safety may require it."',ex:'Lincoln suspended it during the Civil War. In Boumediene v. Bush (2008), the Court said Guantánamo detainees could use it.',l:'con',a:['writ of habeas corpus']},
 'bills of attainder':{t:'Bill of attainder',d:'A law that declares a specific person or group guilty and punishes them without a trial. The Constitution bans them for Congress and the states.',src:'Article I, Sections 9 and 10: "No Bill of Attainder or ex post facto Law shall be passed."',ex:'In United States v. Lovett (1946), the Court struck down a law cutting off the pay of three named federal employees accused of disloyalty.',l:'con',a:['bill of attainder']},
 'ex post facto':{t:'Ex post facto law',d:'A law that punishes something that was legal when it was done, or increases the punishment after the fact. Banned for both Congress and the states.',src:'Article I, Sections 9 and 10.',ex:'A state can\'t raise the sentence for a crime and apply it to someone who committed it before the change.',l:'con',a:['ex post facto law','ex post facto laws']},
 'necessary and proper clause':{t:'Necessary and Proper Clause',d:'Lets Congress make laws needed to carry out its listed powers. Also called the Elastic Clause, because it stretches federal power.',src:'Article I, Section 8, Clause 18.',ex:'McCulloch v. Maryland (1819) used it to uphold a national bank, even though "bank" isn\'t in the Constitution.',l:'con',a:['elastic clause']},
 'supremacy clause':{t:'Supremacy Clause',d:'Makes the Constitution, federal laws, and treaties the highest law. When a valid federal law truly conflicts with a state law, the federal law wins.',src:'Article VI, Clause 2: "the supreme Law of the Land."',ex:'Federal immigration law overrode parts of Arizona\'s immigration law in Arizona v. United States (2012).',l:'con',a:['supreme law of the land','supreme law','article vi']},
 'full faith and credit':{t:'Full Faith and Credit Clause',d:'States must respect each other\'s public records and court judgments.',src:'Article IV, Section 1.',ex:'A court judgment for money won in Ohio can be enforced against the debtor in Texas.',l:'con',a:['full faith and credit clause']},
 'judicial review':{t:'Judicial review',d:'The power of courts to strike down laws or government actions that violate the Constitution. It isn\'t written in the text.',src:'Established by Marbury v. Madison (1803). Hamilton defended the idea in Federalist No. 78.',ex:'In Brown v. Board (1954), the Court used it to strike down school segregation laws.',l:'marbury'},
 'power of the purse':{t:'Power of the purse',d:'Congress controls taxing and spending. No money leaves the Treasury unless Congress approves it.',src:'Article I, Section 8 (taxing and spending) and Section 9: "No Money shall be drawn from the Treasury, but in Consequence of Appropriations made by Law."',ex:'Government shutdowns happen when Congress doesn\'t pass funding bills on time.',l:'con'},
 'veto':{t:'Veto',d:'The President\'s power to reject a bill. Congress can override with two-thirds of both chambers.',src:'Article I, Section 7.',ex:'Presidents have vetoed about 2,600 bills. Congress has overridden only about 4% of them.',l:'con'},
 'pocket veto':{t:'Pocket veto',d:'If Congress adjourns within 10 days (Sundays excepted) of sending a bill and the President doesn\'t sign it, the bill dies. Congress can\'t override it.',src:'Article I, Section 7.',ex:'Presidents have used it hundreds of times, often on bills sent right before a session ends.',l:'con'},
 'filibuster':{t:'Filibuster',d:'Using the Senate\'s unlimited debate to delay or block a vote. Ending it takes cloture.',src:'Not in the Constitution. It comes from Senate rules, and Article I, Section 5 lets each chamber set its own.',ex:'Strom Thurmond spoke for over 24 hours against the Civil Rights Act of 1957.',l:'senrules'},
 'cloture':{t:'Cloture',d:'The vote that ends debate in the Senate. For most bills it takes 60 votes. For nominations, a simple majority since 2013 and 2017.',src:'Senate Rule XXII, adopted in 1917.',ex:'A bill with 55 supporters can still stall if it can\'t reach 60 for cloture.',l:'senrules',a:['60 votes']},
 'budget reconciliation':{t:'Budget reconciliation',d:'A fast-track process for bills about taxes, spending, and the debt limit. Senate debate is capped, so it can\'t be filibustered.',src:'Congressional Budget Act of 1974. The Byrd rule keeps out provisions that aren\'t mainly budgetary.',ex:'The 2017 tax cuts, the 2022 Inflation Reduction Act, and the 2025 One Big Beautiful Bill Act all used it.',l:'senrules',a:['reconciliation']},
 'byrd rule':{t:'Byrd rule',d:'Bars "extraneous" provisions from reconciliation bills, meaning ones that don\'t mainly change spending or revenue.',src:'Named for Sen. Robert Byrd. Now part of the Congressional Budget Act.',ex:'In 2021, the Senate parliamentarian ruled a $15 minimum wage couldn\'t ride in a reconciliation bill.',l:'senrules'},
 'great compromise':{t:'Great Compromise',d:'The 1787 deal that created a House based on population and a Senate with two seats per state. Also called the Connecticut Compromise.',src:'Proposed by Roger Sherman and Oliver Ellsworth at the Constitutional Convention. Written into Article I.',ex:'Wyoming and California each have 2 senators, but California has 52 House seats to Wyoming\'s 1.',l:'con',a:['connecticut compromise']},
 'popular sovereignty':{t:'Popular sovereignty',d:'The idea that government\'s power comes from the people.',src:'The Preamble opens "We the People." The Declaration says governments derive "their just powers from the consent of the governed."',ex:'Ratifying the Constitution through state conventions, instead of state legislatures, was meant to reflect this.',l:'dec'},
 'separation of powers':{t:'Separation of powers',d:'Splitting government into legislative, executive, and judicial branches so no one holds all power.',src:'Montesquieu\'s The Spirit of the Laws (1748). Built into Articles I, II, and III.',ex:'Congress writes laws, the President enforces them, and courts interpret them.',l:'fed'},
 'checks and balances':{t:'Checks and balances',d:'Each branch can limit the others, so power is not just divided but contested.',src:'Federalist No. 51: "Ambition must be made to counteract ambition."',ex:'The President nominates judges, but the Senate must confirm them.',l:'fed'},
 'federalism':{t:'Federalism',d:'Power is divided between the national government and the states.',src:'The structure of the whole Constitution, plus the 10th Amendment.',ex:'States set most criminal law and run elections. The federal government coins money and handles foreign policy.',l:'con'},
 'electoral college':{t:'Electoral College',d:'The 538 electors who formally choose the President. A candidate needs 270.',src:'Article II, Section 1 and the 12th Amendment. The 23rd Amendment gave D.C. 3 electors.',ex:'In 2000 and 2016, the winner lost the national popular vote.',l:'am'},
 'bill of rights':{t:'Bill of Rights',d:'The first 10 amendments, ratified in 1791. They protect individual rights from the federal government, and most now apply to states too.',src:'Drafted by James Madison and passed by the First Congress in 1789.',ex:'The 1st Amendment protects speech. The 4th limits searches. The 6th guarantees a lawyer.',l:'bor'},
 'due process':{t:'Due process',d:'The government must follow fair procedures before taking your life, liberty, or property. Courts also read it to protect some basic rights.',src:'5th Amendment (federal) and 14th Amendment (states).',ex:'You get notice and a hearing before the government can take your property.',l:'am',a:['due process clause']},
 'equal protection':{t:'Equal Protection Clause',d:'States can\'t deny any person "the equal protection of the laws."',src:'14th Amendment, Section 1 (1868).',ex:'Brown v. Board (1954) used it to end legal school segregation.',l:'am',a:['equal protection clause']},
 'double jeopardy':{t:'Double jeopardy',d:'You can\'t be tried twice for the same crime by the same government after an acquittal or conviction.',src:'5th Amendment.',ex:'Because states and the federal government are separate, both can charge the same act. That\'s the "dual sovereignty" exception.',l:'bor'},
 'exclusionary rule':{t:'Exclusionary rule',d:'Evidence gathered illegally can\'t be used against you in a criminal trial.',src:'Mapp v. Ohio (1961) applied it to the states, based on the 4th Amendment.',ex:'If police search a home without a warrant or a valid exception, what they find may be thrown out.',l:'bor'},
 'prior restraint':{t:'Prior restraint',d:'Government stopping speech or publication before it happens. Courts treat it as the most serious kind of censorship.',src:'Near v. Minnesota (1931) and the Pentagon Papers case (1971), under the 1st Amendment.',ex:'The Nixon administration couldn\'t stop newspapers from printing the Pentagon Papers.',l:'bor'},
 'stare decisis':{t:'Stare decisis',d:'Latin for "to stand by things decided." Courts generally follow precedent.',src:'A common-law tradition, not a constitutional rule. The Court decides when to overrule its own cases.',ex:'Dobbs (2022) overruled Roe v. Wade, and the justices argued over how much stare decisis should count.',l:'dobbs'},
 'strict scrutiny':{t:'Strict scrutiny',d:'The toughest test courts use. A law must serve a compelling interest and be narrowly tailored.',src:'Grew out of footnote 4 of United States v. Carolene Products (1938).',ex:'Laws that classify people by race get strict scrutiny, and most fail it.',l:'am'},
 'selective incorporation':{t:'Selective incorporation',d:'Applying Bill of Rights protections to the states, one right at a time, through the 14th Amendment\'s Due Process Clause.',src:'Built case by case since Gitlow v. New York (1925).',ex:'McDonald v. Chicago (2010) applied the 2nd Amendment to states and cities.',l:'am',a:['incorporation']},
 'originalism':{t:'Originalism',d:'Reading the Constitution by its public meaning when it was ratified.',src:'A judicial philosophy linked to Justices Scalia, Thomas, and others.',ex:'Heller (2008) leaned on 18th-century meanings of "keep and bear arms."',l:'heller'},
 'gerrymandering':{t:'Gerrymandering',d:'Drawing district lines to favor a party or group.',src:'Named for Gov. Elbridge Gerry, who signed a salamander-shaped Massachusetts map in 1812.',ex:'Rucho v. Common Cause (2019) said federal courts can\'t hear partisan gerrymandering claims. State courts and commissions still can.',l:'con'},
 'one person, one vote':{t:'One person, one vote',d:'Districts must have roughly equal populations, so each vote weighs about the same.',src:'Baker v. Carr (1962), Reynolds v. Sims (1964), and Wesberry v. Sanders (1964).',ex:'Every state redraws districts after each census to keep them balanced.',l:'am'},
 'reapportionment':{t:'Reapportionment',d:'Dividing the 435 House seats among the states after each census.',src:'Article I, Section 2 and the 14th Amendment, Section 2.',ex:'After 2020, Texas gained 2 seats and New York lost 1.',l:'con'},
 'census':{t:'Census',d:'The count of everyone living in the U.S., every 10 years. It decides House seats and much federal funding.',src:'Article I, Section 2: an "actual Enumeration" every ten years.',ex:'The next census is in 2030.',l:'con'},
 'executive privilege':{t:'Executive privilege',d:'A President\'s claim to keep some internal communications confidential.',src:'Not in the text. United States v. Nixon (1974) recognized it but said it isn\'t absolute.',ex:'Nixon had to turn over the Watergate tapes.',l:'nixon'},
 'executive orders':{t:'Executive order',d:'A President\'s directive on how the executive branch should carry out the law. It can\'t override a statute or the Constitution.',src:'Drawn from Article II\'s executive power and from laws Congress passes.',ex:'Youngstown v. Sawyer (1952) struck down Truman\'s order seizing steel mills.',l:'con',a:['executive order']},
 'advice and consent':{t:'Advice and consent',d:'The Senate\'s power to approve treaties (by two-thirds) and confirm top appointments (by majority).',src:'Article II, Section 2.',ex:'The Senate rejected the Treaty of Versailles in 1919.',l:'con'},

function unseenFirst(pool){const r=new Set(st.recent||[]);return shuffle(pool.filter(q=>!r.has(q.id))).concat(shuffle(pool.filter(q=>r.has(q.id))))}

function lessonQs(u,k,teach){const size=chunkSize(u);const all=u.q.slice(k*size,(k+1)*size);const votes=all.filter(q=>q.t==='vote');const chunk=graded(all);const earlier=graded(u.q.slice(0,k*size));const rev=unseenFirst(earlier).slice(0,k?3:0);
 if(!teach)return shuffle(chunk).concat(votes,shuffle(rev));
 let out=[];for(let i=0;i<chunk.length;i+=2){const g=chunk.slice(i,i+2);g.forEach((q,j)=>out.push({t:'teach',q,n:i+j+1,of:chunk.length}));out=out.concat(shuffle(g))}
 return out.concat(votes,shuffle(rev))}

function matchTap(side,i){if(S.checked)return;const v=S.v,q=S.queue[S.idx];v.bad=null;
 if(side==='L'){if(v.okL.includes(i))return;v.sl=v.sl===i?null:i}else{if(v.okR.includes(i))return;v.sr=v.sr===i?null:i}
 sfx('tap');
 if(v.sl!=null&&v.sr!=null){if(q.pairs[v.sl][1]===q.pairs[v.sr][1]){v.okL.push(v.sl);v.okR.push(v.sr);v.sl=v.sr=null;tone(880,0,.08,'triangle',.1);
   if(v.okL.length===q.pairs.length){renderSession();setTimeout(()=>{if(S&&S.v===v)grade(!v.miss)},250);return}}
  else{v.miss=true;v.bad='R'+v.sr;const L=v.sl,Rr=v.sr;sfx('bad');renderSession();setTimeout(()=>{if(S&&S.v===v&&v.sl===L&&v.sr===Rr){v.sl=v.sr=null;v.bad=null;renderSession()}},450);return}}
 renderSession()}
