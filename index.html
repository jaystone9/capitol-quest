 M('Which case allowed "separate but equal" segregation?','Plessy v. Ferguson (1896)',['Brown v. Board (1954)','Marbury v. Madison (1803)','Tinker v. Des Moines (1969)']),
 M('Which case overturned Plessy v. Ferguson?','Brown v. Board of Education',['Miranda v. Arizona','Engel v. Vitale','Mapp v. Ohio']),
 M('In Tinker v. Des Moines, students wore black armbands to protest the Vietnam War. The Court ruled...','Students don\'t lose free speech rights at school',['Schools can ban any protest','Armbands aren\'t speech','Only adults have free speech']),
 M('Gibbons v. Ogden (1824) expanded Congress\'s power to...','Regulate interstate commerce',['Declare war','Collect income taxes','Impeach judges']),
 M('The exclusionary rule from Mapp v. Ohio says...','Illegally obtained evidence can\'t be used in court',['Juries must be unanimous','Defendants must testify','Judges can exclude the public']),
 M('"You have the right to remain silent" comes from...','Miranda v. Arizona (1966)',['Gideon v. Wainwright (1963)','Mapp v. Ohio (1961)','Schenck v. U.S. (1919)']),
 M('Engel v. Vitale (1962) ruled that...','Public schools can\'t lead official prayers',['Students can\'t pray at all','Religious schools are illegal','Teachers can require prayer']),
 M('New York Times v. United States (the Pentagon Papers case) blocked the government from...','Prior restraint (stopping publication in advance)',['Taxing newspapers','Suing for libel','Requiring press passes']),
 M('Which case created the "clear and present danger" test for speech?','Schenck v. United States (1919)',['Tinker v. Des Moines (1969)','Citizens United v. FEC (2010)','Engel v. Vitale (1962)']),
 M('Citizens United v. FEC (2010) held that...','Independent political spending by corporations and unions is protected speech',['Campaign donations are banned','Corporations can vote','Only individuals can run ads']),
 TF('In Obergefell v. Hodges (2015), the Court ruled that same-sex couples have a constitutional right to marry.',true),
 M('Dobbs v. Jackson Women\'s Health Organization (2022) overturned...','Roe v. Wade (1973)',['Brown v. Board (1954)','Miranda v. Arizona (1966)','Marbury v. Madison (1803)']),
 O('Put these cases in order, oldest first.',['Marbury v. Madison','Plessy v. Ferguson','Brown v. Board of Education','Miranda v. Arizona'])
]},

/* ---------------- SECTION 3: COLLEGE ---------------- */
{id:'u16',s:2,title:'Political Theory',desc:'Hobbes, Locke, Montesquieu, and the Federalist Papers',
tips:[
 ['Social contract thinkers',['**Hobbes** (*Leviathan*, 1651): without government, life is "solitary, poor, nasty, brutish, and short," so people need a strong sovereign.','**Locke** (*Two Treatises*, 1689): natural rights to **life, liberty, and property**; government rests on **consent**.','**Rousseau** (*The Social Contract*, 1762): the **general will**.']],
 ['Montesquieu and the ratification fight',['**Montesquieu** (*The Spirit of the Laws*, 1748) argued for **separation of powers**.','The **Federalist Papers**: 85 essays by **Hamilton, Madison, and Jay** writing as "Publius."','**Anti-Federalists** feared central power and demanded a bill of rights.']],
 ['Federalist essays to know',['**No. 10** (Madison): **factions** are best controlled by a **large republic**.','**No. 51** (Madison): "**Ambition must be made to counteract ambition**." "If men were angels, no government would be necessary."','**No. 70** (Hamilton): an **energetic** single executive. **No. 78** (Hamilton): the judiciary is the "**least dangerous**" branch.']]
],
q:[
 M('Who wrote that life without government would be "solitary, poor, nasty, brutish, and short"?','Thomas Hobbes',['John Locke','Jean-Jacques Rousseau','Montesquieu']),
 M('John Locke\'s natural rights were...','Life, liberty, and property',['Liberty, equality, fraternity','Peace, land, and bread','Speech, press, and religion']),
 M('Rousseau\'s name for what the community as a whole wills is the...','General will',['Invisible hand','Social gospel','Tyranny of the majority']),
 M('Whose book "The Spirit of the Laws" shaped the idea of separation of powers?','Montesquieu',['Hobbes','Machiavelli','Plato']),
 P('Match the Federalist Paper to its big idea.',[['No. 10','Control factions with a large republic'],['No. 51','Ambition counteracts ambition'],['No. 70','An energetic single executive'],['No. 78','The least dangerous branch']]),
 M('Who wrote the Federalist Papers?','Alexander Hamilton, James Madison, and John Jay',['Jefferson, Adams, and Franklin','Washington, Hamilton, and Madison','Madison, Monroe, and Jay']),
 F('"If men were ___, no government would be necessary." (Federalist No. 51)','angels',['equal','free','wise']),
 M('In Federalist No. 10, Madison defines a faction as...','A group united by an interest against others\' rights or the common good',['A political party in Congress','A branch of government','A state militia']),
 M('What was the Anti-Federalists\' biggest demand?','A bill of rights',['A king','Abolishing the states','A stronger President']),
 TF('Hamilton called the judiciary the "least dangerous" branch because it has neither the sword nor the purse.',true)
]},

{id:'u17',s:2,title:'Congressional Procedure',desc:'The insider rules that decide what passes',
tips:[
 ['Fast tracks in the House',['**Suspension of the rules**: 40 minutes of debate, no amendments, and a **2/3** vote. Used for less controversial bills.','**Special rules** from the Rules Committee structure debate on major bills.','The **Committee of the Whole** lets the House work with a quorum of just **100**.']],
 ['Budget and money',['**Authorization** creates a program; **appropriation** funds it. Congress aims to pass **12** appropriations bills a year.','Miss the deadline and you need a **continuing resolution**, or the government **shuts down**.','**Reconciliation** can\'t be filibustered, but the **Byrd rule** blocks provisions that aren\'t about the budget. The **CBO** estimates costs.']],
 ['Senate floor tactics',['**Unanimous consent agreements** set the terms of debate.','**Filling the amendment tree** lets the Majority Leader block other amendments.','Senators can add unrelated amendments (**riders**). The **Parliamentarian** advises on the rules.']]
],
q:[
 M('Under suspension of the rules in the House, a bill needs...','A two-thirds vote, with limited debate and no amendments',['A simple majority and unlimited debate','60 votes','Unanimous consent']),
 M('What\'s the difference between authorization and appropriation?','Authorization creates a program; appropriation funds it',['They\'re the same thing','Appropriation creates a program; authorization funds it','Authorization is only for the Senate']),
 M('If appropriations aren\'t passed on time, Congress can avoid a shutdown with a...','Continuing resolution',['Discharge petition','Cloture motion','Pocket veto']),
 M('Why is budget reconciliation powerful in the Senate?','It can\'t be filibustered, so it can pass with a simple majority',['It skips the House','It doesn\'t need the President','It can change the Constitution']),
 M('The Byrd rule blocks reconciliation provisions that are...','"Extraneous," meaning not mainly about spending or revenue',['Written by the minority party','Longer than 100 pages','About defense']),
 M('Which nonpartisan agency estimates what bills will cost?','The Congressional Budget Office (CBO)',['The Office of Management and Budget (OMB)','The Federal Reserve','The Government Accountability Office (GAO)'],'OMB is the President\'s budget office. GAO audits how money is spent.'),
 M('An unrelated amendment attached to a bill is called a...','Rider',['Hold','Markup','Quorum call']),
 M('The Senate Majority Leader "fills the amendment tree" to...','Block other senators from offering amendments',['Speed up confirmations','Force a vote on every amendment','Skip the final vote']),
 TF('The House\'s Committee of the Whole can do business with a quorum of 100 members.',true),
 F('Congress normally aims to pass ___ regular appropriations bills each year.','12',['1','3','50'])
]},

{id:'u18',s:2,title:'Presidency & Bureaucracy',desc:'Presidential power and the agencies that run the government',
tips:[
 ['Presidential power',['**Richard Neustadt** (*Presidential Power*, 1960): presidential power is "the **power to persuade**."','Theodore Roosevelt called the office a **bully pulpit**.','Unilateral tools: **executive orders**, **signing statements**, memoranda. The **unitary executive** theory says the President controls the whole executive branch.']],
 ['The bureaucracy',['Millions of civilian federal workers in **departments**, **independent agencies** (like the SEC), and **government corporations** (like the Postal Service).','**Iron triangles** link agencies, congressional committees, and interest groups. **Issue networks** are looser.','The **Pendleton Act (1883)** began replacing the spoils system with a merit civil service.']],
 ['Rulemaking and control',['Agencies write regulations under the **Administrative Procedure Act (1946)** using **notice and comment**.','Rules are published in the **Federal Register**.','In **Loper Bright v. Raimondo (2024)**, the Court overruled **Chevron** deference, so judges now decide what statutes mean on their own.']]
],
q:[
 M('Neustadt argued that presidential power is the power to...','Persuade',['Command','Veto','Spend']),
 M('Theodore Roosevelt called the presidency\'s platform for shaping opinion the...','Bully pulpit',['Imperial presidency','Rose Garden strategy','Fireside chat']),
 M('A statement a President issues when signing a bill, sometimes explaining how they\'ll interpret it, is a...','Signing statement',['Pocket veto','Executive agreement','Line-item veto']),
 M('The unitary executive theory holds that...','The President controls the entire executive branch',['Congress controls the agencies','The Vice President shares power equally','States run federal agencies']),
 M('Which is an independent regulatory agency?','The Securities and Exchange Commission (SEC)',['The Department of State','The Department of Defense','The Department of Justice']),
 M('An iron triangle links which three groups?','Agencies, congressional committees, and interest groups',['The three branches of government','Voters, parties, and media','States, cities, and counties']),
 M('Agencies write rules through notice and comment under the...','Administrative Procedure Act (1946)',['Voting Rights Act (1965)','War Powers Resolution (1973)','Pendleton Act (1883)']),
 M('Proposed and final federal regulations are published in the...','Federal Register',['Congressional Record','U.S. Reports','Constitution Annotated']),
 M('In Loper Bright Enterprises v. Raimondo (2024), the Supreme Court...','Overruled Chevron deference to agencies\' readings of statutes',['Created the EPA','Banned executive orders','Ended the civil service']),
 TF('The Pendleton Act (1883) began replacing the spoils system with a merit-based civil service.',true)
]},

{id:'u19',s:2,title:'Opinion, Voting & Parties',desc:'Why people vote the way they do',
tips:[
 ['Where opinions come from',['**Political socialization**: family, school, peers, media, religion.','**Party identification** is the strongest predictor of how people vote.','*The American Voter* (1960) described party ID as a stable, psychological attachment.']],
 ['Theories of voting',['**Anthony Downs** (*An Economic Theory of Democracy*, 1957): the **median voter theorem**. In two-party races on one dimension, candidates move to the center.','The **paradox of voting**: why vote if one vote almost never decides?','**Retrospective voting**: judging incumbents by past results.']],
 ['Parties and polarization',['**Duverger\'s Law**: plurality, single-member districts produce two parties. **Proportional representation** supports more.','**Critical elections** realign coalitions, as in **1932** (the New Deal).','**Affective polarization**: partisans increasingly dislike and distrust the other side.']]
],
q:[
 M('The process by which people develop their political views is called...','Political socialization',['Gerrymandering','Realignment','Apportionment']),
 M('What is the strongest single predictor of how Americans vote?','Party identification',['Income alone','Region alone','The candidate\'s age']),
 M('The median voter theorem predicts that in two-party races on one issue dimension, candidates...','Move toward the center',['Move to the extremes','Refuse to take positions','Always split the vote evenly']),
 M('Who wrote "An Economic Theory of Democracy" (1957)?','Anthony Downs',['Robert Dahl','V.O. Key','Richard Neustadt']),
 M('The paradox of voting asks...','Why people vote when one vote almost never decides an election',['Why the popular vote and Electoral College can differ','Why turnout is higher in midterms','Why primaries come first']),
 M('Voting based on how well an incumbent has done is called...','Retrospective voting',['Prospective voting','Straight-ticket voting','Strategic voting']),
 M('Duverger\'s Law says plurality, single-member district elections tend to produce...','A two-party system',['Many parties','One-party rule','No parties']),
 M('The 1932 election that built the New Deal coalition is a classic example of a...','Critical (realigning) election',['Dealignment','Contingent election','Recall election']),
 M('Disliking and distrusting the other party, beyond disagreeing on issues, is called...','Affective polarization',['Ideological drift','Split-ticket voting','Political efficacy']),
 TF('Proportional representation systems tend to support more than two parties.',true)
]},

{id:'u20',s:2,title:'Comparative Politics',desc:'How other democracies are built',
tips:[
 ['Presidential vs. parliamentary',['**Presidential** (U.S.): the executive is elected separately and serves a fixed term.','**Parliamentary** (UK): the **prime minister** comes from the legislature and needs its **confidence**. A **vote of no confidence** can bring the government down.','**Semi-presidential** (France): an elected president plus a prime minister.']],
 ['Electoral systems',['**First-past-the-post** (single-member plurality): U.S., UK.','**Proportional representation**: seats match vote share (Netherlands, Israel).','**Mixed-member proportional**: Germany, New Zealand. **Ranked-choice voting**: voters rank candidates.']],
 ['Models of democracy',['**Arend Lijphart**: **majoritarian** (Westminster) vs. **consensus** democracies.','**Juan Linz**: the "**perils of presidentialism**": fixed terms and dual legitimacy can cause deadlock.','**Federal** vs. **unitary** states; **bicameral** vs. **unicameral** legislatures.']]
],
q:[
 M('In a parliamentary system, the head of government is usually...','A prime minister drawn from the legislature',['A directly elected president','A monarch','A Supreme Court justice']),
 M('A vote of no confidence can...','Bring down a government in a parliamentary system',['Remove a U.S. President','Overturn a court ruling','Cancel an election']),
 M('France, with a powerful elected president and a prime minister, is a...','Semi-presidential system',['Pure parliamentary system','Absolute monarchy','Confederation']),
 M('In proportional representation, parties win seats...','Roughly in proportion to their share of the vote',['Only by winning district pluralities','Based on land area','By lottery']),
 M('Germany and New Zealand use which electoral system?','Mixed-member proportional',['Pure first-past-the-post','An electoral college','Ranked-choice only']),
 M('Ranked-choice voting lets voters...','Rank candidates in order of preference',['Vote more than once','Choose only a party, not a candidate','Skip the general election']),
 M('Arend Lijphart contrasted majoritarian democracies with...','Consensus democracies',['Authoritarian regimes','Direct democracies','Theocracies']),
 M('Juan Linz warned about the "perils of presidentialism" because...','Fixed terms and dual legitimacy can cause deadlock and crises',['Presidents are always dictators','Parliaments can\'t pass laws','Prime ministers serve for life']),
 M('A country where the central government holds most power and regions get delegated authority is...','Unitary',['Federal','Confederal','Presidential']),
 TF('The United Kingdom has a single written, codified constitution like the U.S.',false,'The UK\'s constitution is uncodified: statutes, conventions, and court rulings.')
]},

/* ---------------- SECTION 4: GRADUATE ---------------- */
{id:'u21',s:3,title:'Rational Choice & Game Theory',desc:'Collective action, social choice, and pivots',
tips:[
 ['Collective action',['**Mancur Olson** (*The Logic of Collective Action*, 1965): the **free-rider problem**. Small, concentrated groups organize more easily than large, diffuse ones.','**Selective incentives** reward only members who contribute.','The **prisoner\'s dilemma**: individually rational choices leave everyone worse off.']],
 ['Social choice',['The **Condorcet paradox**: majority preferences can cycle (A beats B, B beats C, C beats A).','**Arrow\'s impossibility theorem**: with 3+ options, no ranked voting rule meets every fairness condition.','When preferences cycle, **agenda control** decides outcomes.']],
 ['Spatial models of lawmaking',['**Krehbiel\'s pivotal politics**: the **filibuster pivot** (the 60th vote) and the **veto pivot** (2/3) create a **gridlock interval**.','**Tsebelis\'s veto players**: more veto players, farther apart, means more policy stability.','**Principal–agent** problems: principals can\'t fully monitor the agents they delegate to.']]
],
q:[
 M('In Olson\'s theory, why do large groups struggle to organize?','Members can free-ride on others\' efforts',['They have too much money','They lack opinions','The law forbids it']),
 M('Benefits given only to members who join (like insurance or a magazine) are...','Selective incentives',['Public goods','Externalities','Pork barrel spending']),
 M('In the prisoner\'s dilemma, rational individual choices lead to...','An outcome worse for both players than cooperating',['The best outcome for both','Random outcomes','One player always winning']),
 M('When majority preferences cycle (A beats B, B beats C, C beats A), it\'s called...','The Condorcet paradox',['Duverger\'s Law','The median voter theorem','Path dependence']),
 M('Arrow\'s impossibility theorem shows that...','No ranked voting rule can meet every fairness condition with 3+ options',['Democracy is impossible','Two parties always form','Majorities never cycle']),
 M('In Krehbiel\'s pivotal politics, the filibuster pivot is...','The senator who casts the 60th vote for cloture',['The Senate Majority Leader','The Vice President','The median House member']),
 M('The range of status quo policies that supermajority pivots keep from changing is the...','Gridlock interval',['Win set','Pareto frontier','Median line']),
 M('According to Tsebelis, policy stability increases when...','There are more veto players with more distant preferences',['There are fewer veto players','Parties agree completely','Elections happen more often']),
 M('Congress delegates to an agency but can\'t fully monitor it. That\'s a...','Principal–agent problem',['Collective action problem','Condorcet cycle','Median voter problem']),
 TF('Agenda control matters most when majority preferences cycle.',true)
]},

{id:'u22',s:3,title:'Congress Scholarship',desc:'Mayhew, Fenno, party cartels, and political time',
tips:[
 ['The electoral connection',['**David Mayhew** (*Congress: The Electoral Connection*, 1974): members are "**single-minded seekers of reelection**."','They pursue **advertising**, **credit claiming**, and **position taking**.','**Richard Fenno** (*Home Style*, 1978) studied how members present themselves back home.']],
 ['Parties in Congress',['**Cox & McCubbins**: the majority party is a **cartel** that uses **negative agenda control** to keep divisive bills off the floor.','The informal **Hastert rule**: bring bills up only with support from a "majority of the majority."','**Aldrich & Rohde**: **conditional party government**. Leaders get strong when parties are internally united and far apart.']],
 ['Institutions and time',['**Historical institutionalism**: **path dependence**, **critical junctures**, and **increasing returns** (Paul Pierson).','**Skowronek** (*The Politics Presidents Make*): presidents act in "**political time**": reconstruction, articulation, disjunction, preemption.','**DW-NOMINATE** (Poole & Rosenthal) measures ideology from roll-call votes.']]
],
q:[
 M('Mayhew described members of Congress as "single-minded seekers of..."','Reelection',['Power','Wealth','Good policy']),
 P('Match Mayhew\'s three activities.',[['Advertising','Building name recognition'],['Credit claiming','Taking credit for benefits'],['Position taking','Stating views on issues']]),
 M('Fenno\'s "Home Style" studied...','How members present themselves to voters in their districts',['Supreme Court clerks','Presidential cabinets','State legislatures']),
 M('Cox and McCubbins say the majority party acts like a cartel mainly by...','Controlling the agenda to block bills that would split the party',['Buying votes','Controlling the Supreme Court','Eliminating committees']),
 M('The informal Hastert rule says the Speaker brings up bills only if...','A majority of the majority party supports them',['The President approves','The Senate passes them first','Two-thirds of the House supports them']),
 M('Conditional party government predicts strong leaders when...','Members within each party agree and the parties are far apart',['The parties overlap ideologically','Government is divided','The economy is strong']),
 M('The idea that early choices lock in later outcomes is...','Path dependence',['The median voter theorem','Retrospective voting','Agenda setting']),
 M('In Skowronek\'s political time, presidents like FDR and Reagan are presidents of...','Reconstruction',['Disjunction','Preemption','Articulation']),
 M('DW-NOMINATE is a method for...','Measuring legislators\' ideology from roll-call votes',['Counting electoral votes','Drawing districts','Predicting nominations']),
 TF('Historical institutionalism emphasizes critical junctures and long-run sequences.',true)
]},

{id:'u23',s:3,title:'Constitutional Interpretation',desc:'Originalism, scrutiny, incorporation, and modern doctrine',
tips:[
 ['Ways to read the Constitution',['**Originalism**: the meaning when it was ratified. **Textualism**: the ordinary meaning of the words.','**Living constitutionalism**: meaning adapts as society changes.','**Stare decisis**: courts generally follow precedent.']],
 ['Levels of scrutiny',['**Strict scrutiny**: a **compelling** interest, **narrowly tailored** (race, fundamental rights).','**Intermediate scrutiny**: an **important** interest, **substantially related** (sex).','**Rational basis**: a **legitimate** interest, **rationally related** (most laws). The idea traces to **Carolene Products footnote four (1938)**.']],
 ['Incorporation and modern doctrine',['**Selective incorporation**: the 14th Amendment applies most of the Bill of Rights to states (e.g., **McDonald v. Chicago**, 2010, for the 2nd Amendment).','The **major questions doctrine** (**West Virginia v. EPA**, 2022): agencies need clear authorization for decisions of vast significance.','The **nondelegation doctrine** limits how much lawmaking power Congress can hand off.']]
],
q:[
 M('Reading the Constitution by its meaning when it was ratified is...','Originalism',['Living constitutionalism','Legal realism','Judicial restraint']),
 M('The doctrine of following precedent is called...','Stare decisis',['Certiorari','Habeas corpus','Amicus curiae']),
 P('Match the level of scrutiny to its test.',[['Strict scrutiny','Compelling interest, narrowly tailored'],['Intermediate scrutiny','Important interest, substantially related'],['Rational basis','Legitimate interest, rationally related']]),
 M('Which level of scrutiny applies to laws that classify people by race?','Strict scrutiny',['Rational basis','Intermediate scrutiny','No scrutiny']),
 M('Laws that classify by sex usually get...','Intermediate scrutiny',['Strict scrutiny','Rational basis','No review']),
 M('Footnote four of United States v. Carolene Products (1938) suggested...','Closer review for laws affecting "discrete and insular minorities" and the political process',['Ending judicial review','Strict scrutiny for economic regulation','Ending the Commerce Clause']),
 M('Applying Bill of Rights protections to states through the 14th Amendment is...','Selective incorporation',['Nullification','Preemption','Judicial restraint']),
 M('McDonald v. Chicago (2010) incorporated which amendment against the states?','The 2nd Amendment',['The 1st Amendment','The 4th Amendment','The 10th Amendment']),
 M('The major questions doctrine (West Virginia v. EPA, 2022) says agencies...','Need clear authorization from Congress for decisions of vast economic and political significance',['Can never write rules','Need Supreme Court approval for rules','Answer only to the states']),
 TF('Textualism focuses on the ordinary meaning of a law\'s words rather than lawmakers\' intentions.',true)
]},

{id:'u24',s:3,title:'Research Methods',desc:'How political scientists know what they know',
tips:[
 ['Correlation is not causation',['A **confounder** affects both the supposed cause and the effect.','**Reverse causality**: the effect actually drives the cause.','**Selection bias**: the cases studied aren\'t representative.']],
 ['Designs for causal inference',['**Randomized experiments** balance confounders on average (e.g., Gerber & Green\'s get-out-the-vote field experiments).','**Regression discontinuity**: compare cases just above and below a cutoff, like barely winning vs. barely losing.','**Difference-in-differences** compares changes over time and assumes **parallel trends**.']],
 ['Validity and measurement',['**Internal validity**: is the causal claim right in this study? **External validity**: does it generalize?','Surveys suffer from **social desirability bias** and wording effects.','Qualitative tools include case studies and **process tracing**.']]
],
q:[
 M('A variable that influences both the supposed cause and the effect is a...','Confounder',['Instrument','Dependent variable','Constant']),
 M('Why are randomized experiments the "gold standard" for causal claims?','Random assignment balances confounders between groups on average',['They\'re cheaper','They never need statistics','They always generalize']),
 M('Comparing candidates who barely won with those who barely lost uses a...','Regression discontinuity design',['Difference-in-differences design','Content analysis','Process tracing']),
 M('Difference-in-differences depends on which key assumption?','Parallel trends',['Random sampling','A normal distribution','Zero correlation']),
 M('Asking whether findings apply to other places and times is a question of...','External validity',['Internal validity','Reliability','Statistical significance']),
 M('Survey respondents overreport voting because it\'s seen as good. That\'s...','Social desirability bias',['Selection bias','Survivorship bias','Omitted variable bias']),
 M('Tracing the step-by-step causal mechanism within one case is called...','Process tracing',['Regression','Randomization','Bootstrapping']),
 M('If wealth causes democracy, a study claiming democracy causes wealth may suffer from...','Reverse causality',['Measurement reliability','External validity','Random assignment']),
 TF('A statistically significant correlation proves that one variable causes another.',false),
 M('Gerber and Green are known for field experiments on...','Get-out-the-vote mobilization',['Supreme Court voting','Presidential vetoes','Redistricting software'])
]},

/* ---------------- SEATTLE & ORGANIZING ---------------- */
{id:'w1',s:4,title:'Seattle City Government',desc:'The mayor, the council, King County, and how Seattle votes',
tips:[
 ['How Seattle is run',['Seattle has a **strong mayor–council** government. The **Mayor** runs city departments, proposes the budget, and can veto.','The **City Council** passes laws (**ordinances**) and the budget. It has **9 members**: **7 elected by district** and **2 citywide** (Positions 8 and 9).','Mayor and council serve **4-year terms**. City races are **nonpartisan** and held in **odd-numbered years**.']],
 ['The other local players',['The **City Attorney** is elected separately from the Mayor.','**King County** runs elections, public health, the courts, the jail, and **King County Metro**. It\'s led by an elected **County Executive** and a **9-member County Council**.','The **Port of Seattle** has **5 commissioners** elected countywide. The **Seattle School Board** has 7 directors.']],
 ['How Seattle voters decide',['Washington uses a **top-two primary** in **August**: the two highest vote-getters advance, whatever their party.','Everyone **votes by mail**. Seattle voters approved **ranked-choice voting** for city primaries in 2022, starting in **2027**.','**Democracy Vouchers**: each eligible resident gets **four $25 vouchers** to give to qualifying city candidates.']]
],
q:[
 M('What form of government does Seattle have?','Strong mayor–council',['Council–manager','Commission','Town meeting'],'The mayor runs the departments and the council makes laws. In council–manager cities, a hired city manager runs things.'),
 F('The Seattle City Council has ___ members.','9',['7','11','15']),
 M('How are Seattle City Council members elected?','7 by district and 2 citywide',['All 9 citywide','All 9 by district','Appointed by the mayor']),
 M('How long is a Seattle mayor\'s term?','4 years',['2 years','6 years','Until replaced by the council']),
 TF('Seattle city elections are partisan, with candidates listed as Democrats or Republicans.',false,'City races are nonpartisan.'),
 M('Which office runs elections for Seattle voters?','King County Elections',['The Seattle City Clerk','The Washington State Patrol','The Mayor\'s office']),
 M('King County Metro, the region\'s bus system, is run by...','King County',['The City of Seattle','The State of Washington','The Port of Seattle']),
 M('How is the Port of Seattle governed?','By 5 commissioners elected countywide',['By 9 commissioners appointed by the governor','By the Seattle City Council','By a single appointed director']),
 M('In Washington\'s top-two primary...','The two highest vote-getters advance, regardless of party',['Each party\'s winner advances','Only party members can vote','The top four advance']),
 M('Seattle\'s Democracy Voucher program gives each eligible resident...','Four $25 vouchers to give to qualifying city candidates',['A $100 tax refund for voting','One free campaign ad','A paid day off to vote']),
 M('Seattle voters approved ranked-choice voting for city primaries starting in...','2027',['2020','2023','2031']),
 TF('Washington votes almost entirely by mail.',true)
]},

{id:'w2',s:4,title:'Washington State Government',desc:'The Legislature in Olympia, the governor, and direct democracy',
tips:[
 ['The Legislature',['Washington has **49 legislative districts**. Each elects **1 senator** (4-year term) and **2 representatives** (2-year terms).','That makes **49 senators** and **98 representatives**, meeting in **Olympia**.','Regular sessions last **105 days** in odd years, when the two-year budget is written, and **60 days** in even years.']],
 ['The executive branch',['The **Governor** serves 4-year terms with no term limit.','**Eight other statewide officials** are elected separately, including the Lieutenant Governor, Secretary of State, Attorney General, and Treasurer. That\'s called a **plural executive**.','The governor can veto **whole sections** of bills, and individual items in budget bills.']],
 ['Direct democracy and taxes',['**Initiatives** let citizens propose laws by collecting signatures equal to **8%** of the votes cast for governor in the last election.','An **initiative to the people** goes straight to the ballot. An **initiative to the Legislature** goes to lawmakers first. A **referendum** lets voters approve or reject a law the Legislature passed.','Washington doesn\'t tax wages, so it leans on **sales** and **property** taxes.']]
],
q:[
 T('How many legislative districts does Washington have? (Type a number.)',['49','forty-nine','fortynine']),
 M('Each Washington legislative district elects...','1 senator and 2 representatives',['1 senator and 1 representative','2 senators and 2 representatives','3 representatives only']),
 M('Washington state senators serve terms of...','4 years',['2 years','6 years','8 years']),
 M('Where does the Washington Legislature meet?','Olympia',['Seattle','Tacoma','Spokane']),
 M('In odd-numbered years, when the two-year budget is written, the regular session lasts...','105 days',['60 days','30 days','All year']),
 M('Washington elects its Attorney General, Secretary of State, and others separately from the governor. This is a...','Plural executive',['Cabinet system','Unitary executive','Parliamentary system']),
 TF('Washington\'s governor can veto individual sections of bills, not just whole bills.',true),
 M('To qualify an initiative, sponsors need signatures equal to...','8% of the votes cast for governor in the last election',['50% of registered voters','1,000 signatures','Two-thirds of the Legislature']),
 M('An initiative to the Legislature...','Goes to lawmakers first, and to the ballot if they don\'t pass it',['Goes straight to the governor','Can only be proposed by legislators','Amends the U.S. Constitution']),
 M('Washington doesn\'t tax wages, so it relies heavily on...','Sales and property taxes',['A state income tax','Tariffs','Lottery revenue alone'])
]},

{id:'w3',s:4,title:'Running for Local Office',desc:'Filing, money rules, endorsements, and the math of winning',
tips:[
 ['Getting on the ballot',['Washington candidates file during **filing week in May**.','The filing fee is **1% of the office\'s annual salary**. If you can\'t afford it, you can submit **signatures** instead.','You must be a **registered voter** in the district. Then comes the **August top-two primary** and the **November general election**.']],
 ['Money, rules, and support',['State and local campaigns report contributions and spending to the **Public Disclosure Commission (PDC)**. Contribution limits apply.','Seattle candidates can qualify for **Democracy Vouchers** by collecting enough small contributions and signatures.','**Endorsements** from unions, organizations, and elected officials signal credibility and bring volunteers.']],
 ['Winning votes',['Know your **win number**: roughly half of expected turnout, plus one.','**Canvass** door to door and **phone bank**, using the **voter file** to find likely voters. Ballots are secret; the file shows whether someone voted, not how.','Many local leaders start on **boards and commissions**, **neighborhood groups**, or as a **Precinct Committee Officer (PCO)**.']]
],
q:[
 M('When do Washington candidates officially file to run?','Filing week in May',['January 1','The day of the primary','Any time before November']),
 M('Washington\'s filing fee for a paid office is generally...','1% of the office\'s annual salary',['$10,000','Nothing','10% of the salary']),
 TF('A candidate who can\'t afford the filing fee can submit signatures instead.',true),
 M('State and local candidates in Washington report contributions and spending to...','The Public Disclosure Commission (PDC)',['The IRS only','The Federal Election Commission','The City Council'],'The FEC covers federal races. The PDC covers Washington state and local races.'),
 M('A campaign\'s "win number" is...','The number of votes needed to win',['Its spot on the ballot','Its fundraising goal','Its number of volunteers']),
 M('About 40,000 voters are expected in a two-candidate race. A rough win number is...','20,001',['40,000','10,000','4,001']),
 M('Going door to door to talk with voters is called...','Canvassing',['Caucusing','Logrolling','Filibustering']),
 M('A campaign uses the voter file to...','See who\'s registered and how often they vote, so it can target outreach',['See how people voted','Change voter registrations','Count ballots'],'Ballots are secret. The voter file shows registration and whether someone voted, not their choices.'),
 M('Which is a common first step toward local office?','Serving on a city board, commission, or neighborhood group',['Running for U.S. Senate','Becoming a federal judge','Working as a lobbyist']),
 M('In Washington, Precinct Committee Officers (PCOs) are...','Elected neighborhood-level party representatives',['Police officers','Appointed judges','City staff who count ballots'])
]},

{id:'w4',s:4,title:'Organizing & Running Meetings',desc:'Robert\'s Rules, one-on-ones, power mapping, and member democracy',
tips:[
 ['Running a meeting',['Under **Robert\'s Rules of Order**, business moves by **motions**: a member makes one, another **seconds** it, the group debates, then votes.','A **quorum** is the minimum number of members needed to do business.','The **agenda** sets the order of business, **minutes** record decisions, and **bylaws** govern the organization itself.']],
 ['Organizing basics',['A **one-on-one** is a conversation to build a relationship and learn what someone cares about.','**Power mapping** shows who decides an issue and who influences them.','Strong campaigns have a clear **demand**, a **target** (a person who can say yes), and **escalating tactics**. **Coalitions** join groups around shared goals.']],
 ['Member democracy',['Democratic organizations elect officers and hold **conventions** where delegates set priorities.','**Endorsement** processes decide which candidates a group backs.','In DSA, local **chapters** elect their own leaders, and the **National Political Committee** is elected at a **national convention** held every two years.']]
],
q:[
 M('Under Robert\'s Rules, after a member makes a motion, what usually happens before debate?','Another member seconds it',['The chair votes','Everyone signs it','It goes to committee automatically']),
 M('A quorum is...','The minimum number of members needed to do official business',['A two-thirds vote','The meeting\'s agenda','The group\'s treasurer']),
 M('The official record of what a meeting decided is the...','Minutes',['Bylaws','Agenda','Charter']),
 M('The rules that govern how an organization runs itself are its...','Bylaws',['Minutes','Ordinances','Treaties']),
 M('In organizing, a one-on-one is...','A conversation to build a relationship and learn what someone cares about',['A debate between two candidates','A secret ballot','A vote of no confidence']),
 M('Power mapping helps a campaign figure out...','Who has the power to decide an issue and who influences them',['Where to hold the meeting','How to draw district lines','Which bills are on the calendar']),
 M('In a campaign, the target is...','A specific person with the power to grant the demand',['The campaign\'s logo','Any voter','The opposing organization']),
 M('To undo a decision adopted at an earlier meeting, Robert\'s Rules lets members move to...','Rescind or amend something previously adopted',['Filibuster','Override','Impeach the chair']),
 TF('Moving the "previous question" ends debate and usually needs a two-thirds vote.',true),
 M('DSA\'s National Political Committee is elected at...','The national convention, held every two years',['Each chapter\'s monthly meeting','A national primary election','A vote of Congress'])
]},

/* ===== Teaching cards: one per question, shown before that question is asked =====
   Keyed by question id (unit id + index). Order/match questions also show their list or pairs. */
const TEACH={
/* u1 Why Government? */
'u1-0':'The U.S. is a **representative democracy**, also called a **republic**. You don\'t vote on every law yourself. You elect representatives who make laws for you.',
'u1-1':'**Popular sovereignty** is a big phrase with a simple meaning: **government\'s power comes from the people**. No king owns it. We lend it out through elections.',
'u1-2':'Compare that with a **direct democracy**, where citizens **vote on laws themselves** instead of electing representatives. Ancient Athens worked this way, and Washington State ballot initiatives are a small taste of it.',
'u1-3':'What\'s government actually for? One main job: **making and enforcing rules that protect people\'s rights and safety**. Roads, courts, and police all trace back to that.',
'u1-4':'In 1776 the colonies needed a breakup letter to Britain. **Thomas Jefferson** wrote most of it: the **Declaration of Independence**.',
'u1-5':'The Declaration was adopted on **July 4, 1776**. That\'s why fireworks happen on the Fourth.',
'u1-6':'The Declaration\'s most famous line: everyone has **unalienable rights**, including **life, liberty, and the pursuit of happiness**. "Unalienable" means no one can take them away.',
'u1-7':'Myth alert: the Declaration did **not** create the three branches. It just announced independence and explained why. The branches came later, in the **Constitution (1787)**.',
'u1-8':'America\'s first government ran under the **Articles of Confederation** (1781). Its fatal flaw: **Congress could not collect taxes**. It had to beg the states for money. There was also no President and no national courts.',
'u1-9':'Under the Articles, every state got exactly **one vote** in Congress, big or small. Changing the Articles needed every single state to agree.',
'u1-10':'In 1786–87, broke Massachusetts farmers led by Daniel Shays rose up in **Shays\' Rebellion**. The national government had no army to respond, and leaders panicked: the Articles were too weak.',
'u1-11':'So in 1787 delegates met in **Philadelphia** for the **Constitutional Convention**. George Washington ran the meeting. (Washington, D.C. didn\'t exist yet.)',
'u1-12':'**James Madison** planned so much of the Constitution that he\'s called the **"Father of the Constitution."** Jefferson wasn\'t even there; he was in France.',
'u1-13':'Big states wanted power by population; small states wanted equal votes. The **Great Compromise** gave both: **a House based on population and a Senate with equal votes per state**.',
'u1-14':'Here\'s the founding timeline. Memorize the years: 1776, 1781, 1787, 1791.',
'u1-15':'Four founding documents, four jobs. Lock these in:',
/* u2 The Constitution, Article by Article */
'u2-0':'The original Constitution is short: just **7 articles**. Everything else was added later as amendments.',
'u2-1':'The **Preamble** opens with "We the People" and lists six goals, in this order:',
'u2-2':'Notice what the Preamble\'s six goals don\'t include: things like **guaranteeing everyone a job**. Its goals are union, justice, tranquility, defense, welfare, and liberty.',
'u2-3':'The first three articles set up the three branches. Article V is the "how to change this" article.',
'u2-4':'**Article I**, about **Congress**, is the **longest article**. The Framers saw Congress as the heart of the government, so they wrote the most about it.',
'u2-5':'Inside Article I, **Section 8** is the famous one: it **lists the powers of Congress**, like taxing, borrowing, and declaring war.',
'u2-6':'Article III names only **one court: the Supreme Court**. Every lower federal court was created later by Congress passing a law.',
'u2-7':'Fun fact: **treason** is the **only crime the Constitution defines**. Article III says it means waging war against the U.S. or giving its enemies aid and comfort.',
'u2-8':'Article IV\'s **Full Faith and Credit Clause** means states must **respect each other\'s public records and court rulings**. A marriage or court judgment in Washington counts in Texas too.',
'u2-9':'Article VI says **no religious test** can ever be required to **hold a federal office**. It also makes the Constitution the **supreme law of the land**.',
'u2-10':'Article VII set the launch rule: the Constitution took effect once **9** of the 13 states ratified it.',
'u2-11':'**Habeas corpus** can be suspended **only during rebellion or invasion, when public safety requires it**. Lincoln famously did it during the Civil War.',
'u2-12':'A **writ of habeas corpus** protects you from **being held in jail without going before a judge**. The government has to show a legal reason for locking you up.',
'u2-13':'The Constitution bans **ex post facto laws**: laws that **punish an act that was legal when it was done**. They can\'t change the rules after the game.',
'u2-14':'The **Commerce Clause** lets Congress regulate trade **with foreign nations, among the states, and with Native American tribes**. It\'s become one of Congress\'s biggest powers.',
'u2-15':'Surprise: the word **"democracy" never appears** in the Constitution or the Declaration. The Framers talked about a "republic" instead.',
/* u3 Three Branches */
'u3-0':'Three branches, three jobs. This is the core of the whole system:',
'u3-1':'**Congress** is the **legislative branch**. "Legislate" means to make laws.',
'u3-2':'The **executive branch** is led by **the President**. It carries out (executes) the laws.',
'u3-3':'Why three branches? **So no single person or group gets too much power.** The Framers had just escaped a king and didn\'t want another.',
'u3-4':'Only **Congress** can **declare war**. The President commands the military, but the formal declaration belongs to Congress.',
'u3-5':'Congress also controls money: taxing and spending. That\'s called the **"power of the purse,"** and it belongs to **Congress**.',
'u3-6':'When the President rejects a bill Congress passed, that\'s a **veto**. It\'s Latin for "I forbid."',
'u3-7':'But Congress can fight back: it can **override a veto** with a **two-thirds** vote in **both** the House and the Senate.',
'u3-8':'Courts check the others with **judicial review**: ruling that a law **violates the Constitution** and striking it down.',
'u3-9':'The President picks Supreme Court justices, but **the Senate must confirm them**. It\'s another check.',
'u3-10':'The Constitution changes **through amendments**. There\'s no national vote of the people to change it.',
'u3-11':'There are **27 amendments** so far. The first one passed in 1791 and the newest, the 27th, in 1992.',
'u3-12':'Amending is hard on purpose. **Three-fourths of the states (38 of 50)** must ratify an amendment after Congress proposes it.',
'u3-13':'The **first ten amendments** have a special name: the **Bill of Rights**.',
'u3-14':'Checks and balances means each branch can block the others. Who holds which check:',
'u3-15':'When a written constitution caps what government can do, that\'s a **limited government**. The opposite is unlimited rule, like an absolute monarchy.',
/* u4 Congress 101 */
'u4-0':'Congress is **bicameral**, which means **it has two chambers**: the House of Representatives and the Senate.',
'u4-1':'The four numbers every civics student knows:',
'u4-2':'Every state gets exactly **2 senators**, whether it\'s California or Wyoming.',
'u4-3':'House seats are divided **by population**. Bigger states get more representatives. Washington has 10.',
'u4-4':'House members serve short **2-year terms**, so they\'re always running for reelection.',
'u4-5':'Senators serve long **6-year terms**.',
'u4-6':'To serve in the House you must be at least **25** years old.',
'u4-7':'To be a senator you must be at least **30** years old.',
'u4-8':'The House is led by the **Speaker of the House**, elected by the members and usually from the majority party.',
'u4-9':'The official **President of the Senate** is **the Vice President of the United States**.',
'u4-10':'The Vice President rarely shows up, though: the **VP votes in the Senate only to break a tie**.',
'u4-11':'Because of 2-year terms, **the entire House is up for election every 2 years**.',
'u4-12':'Senate terms are staggered, so only about **one-third** of the Senate is up for election every 2 years.',
'u4-13':'Every 10 years the **census** counts everyone. Then House seats get redivided, so a state can gain or lose seats.',
'u4-14':'Bottom line: **every American living in a state has two senators and one House member**. You can look yours up and call them.',
'u4-15':'Why do senators get 6 years? **So they can focus on long-term issues with less election pressure.** Madison wanted the Senate steady and the House close to public opinion.',
/* u5 How a Bill Becomes a Law */
'u5-0':'Here\'s the journey of a bill, start to finish:',
'u5-1':'Anyone can suggest a law, even the President, but **only a member of Congress** can officially **introduce a bill**.',
'u5-2':'In the House, a new bill literally gets dropped into a wooden box called the **hopper**.',
'u5-3':'Bills get labels. **"H.R."** means it started in **the House of Representatives**. Senate bills start with **"S."**',
'u5-4':'The Constitution (Article I, Section 7) says **bills that raise taxes (revenue bills) must start in the House**, the chamber closest to the voters.',
'u5-5':'After it\'s introduced, a bill usually goes **to a committee** first: a small group of members who specialize in that topic.',
'u5-6':'When a committee edits a bill line by line, that\'s called a **markup**.',
'u5-7':'Reality check: **most bills never become law**. The large majority die, usually in committee. Only a few percent are enacted.',
'u5-8':'In the House, the powerful **Rules Committee** decides **how long a bill is debated and whether it can be amended**.',
'u5-9':'If the House and Senate pass different versions, they can form a **conference committee** to work out one compromise version.',
'u5-10':'Before it goes to the President, a bill must pass both chambers in **identical** form, word for word.',
'u5-11':'**When the President signs a bill, it becomes law.**',
'u5-12':'If the President vetoes it, Congress can still win with a two-thirds vote of **both the House and the Senate**.',
'u5-13':'Sneaky move: if **Congress adjourns** and the President doesn\'t sign within 10 days, the bill dies. That\'s a **pocket veto**.',
'u5-14':'But if **Congress is still in session** and the President ignores a bill for 10 days (not counting Sundays), **it becomes law without the President\'s signature**.',
'u5-15':'Four key terms from the lawmaking process:',
/* u6 The President */
'u6-0':'To be President you must be at least **35** years old.',
'u6-1':'The President must be a **"natural born Citizen."** So a **naturalized citizen** (born abroad, became a citizen later) **cannot** be President. You also need 14 years living in the U.S.',
'u6-2':'A presidential term is **4 years**.',
'u6-3':'After FDR won four elections, the country passed the **22nd Amendment** (1951), limiting Presidents to **two elected terms**.',
'u6-4':'As **Commander in Chief**, the President **leads the armed forces**. But only Congress can formally declare war.',
'u6-5':'The President negotiates treaties, but **two-thirds of the Senate** must approve them.',
'u6-6':'The **pardon power** lets the President **forgive someone for a federal crime**. It doesn\'t cover state crimes.',
'u6-7':'Every year the President reports to Congress in the **State of the Union** address.',
'u6-8':'The **Cabinet** is the President\'s top team: **the heads of the executive departments, plus the Vice President**.',
'u6-9':'There are **15 executive departments**, from State and Treasury to Veterans Affairs and Homeland Security.',
'u6-10':'The big four Cabinet jobs and what they handle:',
'u6-11':'If the President dies, resigns, or is removed, **the Vice President** becomes President.',
'u6-12':'After the VP, next in line is **the Speaker of the House**, then the Senate\'s president pro tempore.',
'u6-13':'An **executive order** is **a directive from the President on how to run the executive branch**. It has force, but only within the law.',
'u6-14':'Key limit: **an executive order can never override the Constitution** or a valid law. Courts can strike orders down.',
'u6-15':'Voters don\'t elect the President directly. **The Electoral College** formally does: you vote for electors, and they cast the official votes.',
/* u7 The Judicial Branch */
'u7-0':'The federal court ladder, bottom to top:',
'u7-1':'The Supreme Court has **9 justices**: one Chief Justice and eight associate justices.',
'u7-2':'That number isn\'t in the Constitution. **Congress decides by law** how many justices there are. It\'s been 9 since 1869.',
'u7-3':'Federal judges serve **for life, during good behavior**, so they can rule without worrying about reelection.',
'u7-4':'**The President nominates federal judges**, and the Senate confirms them.',
'u7-5':'The Supreme Court picks its cases. To take one, it grants a **writ of certiorari** ("cert" for short).',
'u7-6':'The **rule of four**: **four** of the nine justices must agree to hear a case.',
'u7-7':'Federal courts only decide **real cases** between real parties. **No advisory opinions**: the Supreme Court can\'t give advice on a law before someone brings a case.',
'u7-8':'Justices who disagree with the majority can write a **dissenting opinion**. Some old dissents later became the law.',
'u7-9':'A justice who **agrees with the outcome but for different reasons** writes a **concurring opinion**.',
'u7-10':'**Original jurisdiction** means a court **hears the case first**, like a trial.',
'u7-11':'**Appellate jurisdiction** means reviewing a lower court\'s decision. **Most** Supreme Court cases arrive this way.',
'u7-12':'Two kinds of cases: criminal (the government prosecutes a crime) and **civil**, like **one person suing another over a broken contract**.',
'u7-13':'Federal courts get the headlines, but **most court cases in the U.S. are heard in state courts**.',
'u7-14':'Outsiders can weigh in too. A brief from a group that isn\'t a party to the case is an **amicus curiae** ("friend of the court") **brief**.',
'u7-15':'The Supreme Court\'s leader is the **Chief Justice of the United States**.',
/* u8 The Bill of Rights */
'u8-0':'Why add a Bill of Rights? **To win over Anti-Federalists who feared a too-powerful national government.** Several states agreed to ratify only if rights were added.',
'u8-1':'**James Madison** again! He **drafted the amendments** that became the Bill of Rights.',
'u8-2':'The Bill of Rights was ratified in **1791**.',
'u8-3':'The First Amendment protects five freedoms. Remember **RAPPS**: **Religion, Assembly, Press, Petition, Speech**.',

'u8-7':'The 5th Amendment also bans **double jeopardy**: once you\'re **acquitted**, you **can\'t be tried again** for the same crime.',
'u8-8':'Government can take private property for public use (like a highway), but the 5th Amendment says it must pay **just compensation**.',
'u8-9':'The **6th Amendment** guarantees criminal defendants **a lawyer and a speedy, public trial** by jury.',
'u8-10':'Police generally need a **warrant** to search your home because of the **4th Amendment**: no unreasonable searches and seizures.',
'u8-11':'The **7th Amendment** guarantees a jury trial in **many civil cases** (lawsuits over money).',
'u8-12':'The **8th Amendment** bans **excessive bail**, excessive fines, and cruel and unusual punishment.',
'u8-13':'The **9th Amendment** says **listing some rights doesn\'t deny people other rights**. The list isn\'t the whole story.',
'u8-14':'The **10th Amendment** says powers not given to the federal government are reserved **to the states or the people**.',
'u8-15':'Twist: **the Bill of Rights originally limited only the federal government, not the states**. After the 14th Amendment (1868), courts applied most of it to states, a process called **incorporation**.',

/* u9 Federalism */
'u9-0':'**Federalism** means **power is divided between the national and state governments**. (Splitting power among the three branches is a different idea: separation of powers.)',
'u9-1':'Three ways to arrange national and local power:',
'u9-2':'Powers the Constitution gives the federal government are **enumerated (delegated) powers**. Example: **coining money**. States can\'t print their own dollars.',
'u9-3':'Powers kept by the states are **reserved powers**, like **running elections and creating local governments** (cities, counties, school districts).',
'u9-4':'Some powers belong to both levels, like taxing and building roads. Those are **concurrent powers**.',
'u9-5':'Sorting practice: who holds each power?',
'u9-6':'The **Supremacy Clause** lives in **Article VI**: the Constitution and federal laws are the supreme law of the land.',
'u9-7':'So **when a valid federal law conflicts with a state law, the federal law wins**. Key word: valid. It has to be within Congress\'s powers.',
'u9-8':'The **Necessary and Proper Clause** lets Congress make laws needed to carry out its listed powers. It stretches, so it\'s nicknamed the **Elastic Clause**.',

'u9-10':'In **cooperative federalism**, levels of government mix together on programs like highways and Medicaid. It\'s nicknamed **"marble cake"** federalism, versus the separate layers of "layer cake."',
'u9-11':'Federal money comes with strings. A grant with **strict rules on how the money must be spent** is a **categorical grant**. (A looser one is a block grant.)',
'u9-12':'When Washington D.C. orders states to do something but sends no money, that\'s an **unfunded mandate**.',
'u9-13':'**U.S. v. Lopez (1995)** **limited Congress\'s use of the Commerce Clause** for the first time in decades. Carrying a gun near a school wasn\'t economic activity, so Congress couldn\'t ban it that way.',
/* u10 The House Up Close */
'u10-0':'The **Speaker of the House** is **elected by the members of the House**, which in practice means the majority party picks.',
'u10-1':'Odd fact: **the Constitution doesn\'t require the Speaker to be a House member**. Every Speaker so far has been one, though.',
'u10-2':'Each party has a **whip** who **counts votes and makes sure members show up**. The name comes from the "whipper-in" in fox hunting who kept the hounds together.',
'u10-3':'The House **Ways and Means** Committee **writes tax laws**. It\'s one of the most powerful committees.',
'u10-4':'**Appropriations** Committees in each chamber decide **how federal money is spent**.',
'u10-5':'The Rules Committee can give a bill a **closed rule**, meaning **no amendments can be offered on the floor**. An open rule allows them.',
'u10-6':'Members can force a stuck bill out of committee with a **discharge petition**. It needs **218** signatures, a majority of the 435-member House.',
'u10-7':'In impeachment, **the House brings charges (impeaches) by majority vote**. Think of it as the indictment. The Senate holds the trial.',
'u10-8':'If no one gets 270 electoral votes, the House picks the President, but **each state delegation casts one vote**. Wyoming counts the same as California.',
'u10-9':'After each census, the 435 seats are redivided among states. That\'s **reapportionment**.',
'u10-10':'Drawing district lines to give one party an unfair advantage is **gerrymandering**, named after Gov. Elbridge Gerry and a salamander-shaped district.',
'u10-11':'Two gerrymandering tricks:',
'u10-12':'**One person, one vote** requires districts to have **roughly equal populations**, so every vote weighs about the same. It comes from 1960s cases like Baker v. Carr and Reynolds v. Sims.',
'u10-13':'The House has **435** voting members (plus non-voting delegates from D.C. and the territories).',
/* u11 The Senate Up Close */
'u11-0':'The **President pro tempore** runs the Senate when the VP is away. By tradition, it\'s **the longest-serving senator of the majority party**.',
'u11-1':'The real power in the Senate is the **Senate Majority Leader**, who controls **which bills reach the floor**.',
'u11-2':'**"Advice and consent"** is the Senate\'s power to **confirm appointments and approve treaties**.',
'u11-3':'Treaties need approval from **two-thirds** of senators present.',
'u11-4':'After the House impeaches, the Senate needs **a two-thirds vote** to **convict and remove** the official. That\'s why removal is so rare.',
'u11-5':'When a President is impeached, **the Chief Justice of the United States** presides over the Senate trial.',
'u11-6':'A **filibuster** is **using extended debate to delay or block a vote**. Today a senator rarely has to keep talking; just threatening one works.',

'u12-0':'Three checks, three branches:',

'u12-8':'In **United States v. Nixon (1974)**, the Court ruled **executive privilege isn\'t absolute**. Nixon had to hand over the Watergate tapes, and he resigned soon after.',

'u12-11':'Impeachment and removal, step by step:',

'u12-13':'If Congress wants to stop a program the President likes, it can defund it with **the power of the purse**.',

'u13-0':'The amendments that remade America after the Civil War and beyond:',
'u13-1':'The **13th Amendment** (1865) **abolished slavery**.',
'u13-2':'The **14th Amendment\'s Equal Protection Clause** says states can\'t **deny any person equal protection of the laws**. It\'s behind many civil rights rulings.',

'u13-8':'During Vietnam, people said "old enough to fight, old enough to vote." The **26th Amendment** (1971) lowered the voting age to **18**.',
'u13-9':'The **27th Amendment** (congressional pay raises) was first proposed in **1789** by Madison and finally ratified in 1992. A college student\'s paper revived it.',
'u13-10':'The **Equal Rights Amendment** passed Congress in **1972** but **wasn\'t ratified by enough states before its deadline**.',

'u13-12':'These amendments came in this order (1865, 1920, 1951, 1971):',
'u13-13':'The **17th Amendment** lets voters directly elect **senators**.',

'u14-2':'A state\'s electors = **its House seats plus 2 for its senators**. Washington has 10 + 2 = 12.',

'u14-5':'Yes, **a candidate can win the national popular vote and still lose the Electoral College**. It happened in 1876, 1888, 2000, and 2016.',

'u14-7':'A **caucus** is **a meeting where party members discuss and pick candidates**, instead of a simple ballot.',
'u14-8':'Why do third parties rarely win? **Winner-take-all, single-member districts favor two big parties**. Political scientists call this Duverger\'s law.',

/* u16 Political Theory */
'u16-0':'**Thomas Hobbes** (Leviathan, 1651) argued that without government, life would be **"solitary, poor, nasty, brutish, and short."** So people accept a strong ruler for safety.',
'u16-1':'**John Locke** was more hopeful. His natural rights were **life, liberty, and property**. Jefferson remixed them into "life, liberty, and the pursuit of happiness."',
'u16-2':'**Jean-Jacques Rousseau** said legitimate government follows the **general will**: what the community as a whole wants for the common good.',
'u16-3':'**Montesquieu**\'s book **"The Spirit of the Laws"** (1748) shaped the idea of **separation of powers**. The Framers quoted him constantly.',
'u16-4':'The four Federalist Papers professors love most:',
'u16-5':'The **Federalist Papers** (85 essays, 1787–88) were written by **Alexander Hamilton, James Madison, and John Jay** under the pen name "Publius" to sell the Constitution.',
'u16-6':'Madison\'s most famous line, from Federalist No. 51: **"If men were angels, no government would be necessary."**',
'u16-7':'In **Federalist No. 10**, Madison defines a **faction** as **a group united by an interest against others\' rights or the common good**. His cure: a large republic with many competing factions.',
'u16-8':'The **Anti-Federalists** feared a strong central government. Their **biggest demand: a bill of rights**. They got it in 1791.',
'u16-9':'In Federalist No. 78, **Hamilton** called the judiciary the **"least dangerous" branch** because it has **neither the sword nor the purse**, only judgment.',
/* u17 Congressional Procedure */
'u17-0':'**Suspension of the rules** is the House fast lane: a bill needs **a two-thirds vote, with limited debate and no amendments**. It\'s used for popular, low-conflict bills.',
'u17-1':'Two steps for spending: **authorization creates a program; appropriation funds it**. A program can exist on paper with no money.',
'u17-2':'If spending bills aren\'t passed on time, Congress can avoid a shutdown with a **continuing resolution** (CR), which keeps funding at current levels.',
'u17-3':'**Budget reconciliation** is powerful in the Senate because **it can\'t be filibustered, so it can pass with a simple majority**. Big tax and spending laws often use it.',
'u17-4':'Reconciliation has a limit: the **Byrd rule** blocks provisions that are **"extraneous,"** meaning not mainly about spending or revenue.',
'u17-5':'The nonpartisan **Congressional Budget Office (CBO)** estimates what bills will cost. (OMB is the President\'s budget office; GAO audits spending.)',
'u17-6':'An unrelated amendment attached to a bill is a **rider**. Riders often hitch onto must-pass spending bills.',
'u17-7':'The Senate Majority Leader can **"fill the amendment tree"**, using up every open amendment slot to **block other senators from offering amendments**.',
'u17-8':'To move faster, the House turns itself into the **Committee of the Whole**, which can do business with a **quorum of just 100 members** instead of 218.',
'u17-9':'Congress normally aims to pass **12** regular appropriations bills each year, one per appropriations subcommittee.',
/* u18 Presidency & Bureaucracy */
'u18-0':'Richard **Neustadt** (Presidential Power, 1960) argued that **presidential power is the power to persuade**. Orders alone rarely work.',
'u18-1':'**Theodore Roosevelt** called the presidency a **"bully pulpit"**, a great platform for shaping public opinion. ("Bully" meant "excellent.")',
'u18-2':'When signing a bill, a President may issue a **signing statement** explaining how they\'ll interpret or enforce it.',
'u18-3':'The **unitary executive theory** holds that **the President controls the entire executive branch**, including the power to fire officials.',
'u18-4':'Some agencies are built to be insulated from the President: **independent regulatory agencies**, like the **Securities and Exchange Commission (SEC)**.',
'u18-5':'An **iron triangle** is a cozy, stable relationship between **agencies, congressional committees, and interest groups** in one policy area.',
'u18-6':'Agencies make rules through **notice and comment** under the **Administrative Procedure Act (1946)**: propose a rule, take public comments, then finalize.',
'u18-7':'Proposed and final federal regulations are published in the **Federal Register**, the government\'s daily journal. Anyone can comment.',
'u18-8':'In **Loper Bright v. Raimondo (2024)**, the Supreme Court **overruled Chevron deference**. Courts no longer defer to agencies\' readings of unclear statutes.',
'u18-9':'After a frustrated job seeker assassinated President Garfield, the **Pendleton Act (1883)** began replacing the **spoils system** with a **merit-based civil service**.',
/* u19 Opinion, Voting & Parties */
'u19-0':'How do people get their political views? Through family, school, friends, and media. Scholars call it **political socialization**.',
'u19-1':'The **strongest single predictor** of how Americans vote is **party identification**. It often starts in childhood and rarely changes.',
'u19-2':'The **median voter theorem**: in two-party races on one issue dimension, candidates **move toward the center** to win the middle voter.',
'u19-3':'**Anthony Downs** wrote **"An Economic Theory of Democracy" (1957)**, applying economic logic to voters and parties.',
'u19-4':'The **paradox of voting** asks **why people vote when one vote almost never decides an election**. Answers involve civic duty and social pressure.',
'u19-5':'Judging an incumbent by how well they\'ve done ("Are you better off?") is **retrospective voting**. Judging by promises is prospective voting.',
'u19-6':'**Duverger\'s Law**: plurality, single-member district elections tend to produce **a two-party system**.',
'u19-7':'Some elections reshape party loyalties for decades. The **1932** election that built FDR\'s New Deal coalition is a classic **critical (realigning) election**.',
'u19-8':'Disliking and distrusting the other party, beyond disagreeing on issues, is **affective polarization**. It has risen sharply in the U.S.',
'u19-9':'**Proportional representation** systems give seats by vote share, so they **tend to support more than two parties**.',
/* u20 Comparative Politics */
'u20-0':'In a **parliamentary system** (like the UK or Canada), the head of government is usually **a prime minister drawn from the legislature**.',
'u20-1':'Parliaments hold a big weapon: a **vote of no confidence** can **bring down a government**, forcing a new cabinet or an election.',
'u20-2':'**France** has both a powerful elected president and a prime minister. That\'s a **semi-presidential system**.',
'u20-3':'In **proportional representation**, parties win seats **roughly in proportion to their share of the vote**. Win 20% of votes, get about 20% of seats.',
'u20-4':'**Germany and New Zealand** use **mixed-member proportional** (MMP): some seats from districts, the rest topped up to match vote share.',
'u20-5':'**Ranked-choice voting** lets voters **rank candidates in order of preference**. Alaska, Maine, and New York City use it, and Seattle voters approved it in 2022 for city primaries starting in 2027.',
'u20-6':'Arend **Lijphart** contrasted **majoritarian democracies** (winner takes power) with **consensus democracies** (power shared broadly).',
'u20-7':'Juan **Linz** warned about the **"perils of presidentialism"**: **fixed terms and dual legitimacy** (president and legislature both elected) **can cause deadlock and crises**.',
'u20-8':'When the central government holds most power and regions only get delegated authority, the country is **unitary**, like France or Japan.',
'u20-9':'The **United Kingdom has no single written constitution**. Its constitution is **uncodified**: statutes, conventions, and court rulings.',
/* u21 Rational Choice & Game Theory */
'u21-0':'Mancur **Olson** explained why big groups struggle to organize: **members can free-ride on others\' efforts** and still get the benefits. Organizers, take note.',
'u21-1':'Olson\'s fix: **selective incentives**, benefits given **only to members who join**, like insurance or a magazine.',
'u21-2':'In the **prisoner\'s dilemma**, each player\'s rational choice leads to **an outcome worse for both players than cooperating**.',
'u21-3':'Majorities can go in circles: A beats B, B beats C, C beats A. That\'s the **Condorcet paradox**.',
'u21-4':'**Arrow\'s impossibility theorem** shows **no ranked voting rule can meet every fairness condition with 3+ options**.',
'u21-5':'Keith **Krehbiel**\'s pivotal politics: the **filibuster pivot** is **the senator who casts the 60th vote for cloture**. Bills must win them over.',
'u21-6':'Because supermajority pivots can block change, a range of status quo policies stays stuck. That range is the **gridlock interval**.',
'u21-7':'George **Tsebelis**: policy stability increases when **there are more veto players with more distant preferences**. More vetoes, less change.',
'u21-8':'When Congress delegates to an agency but can\'t fully monitor it, that\'s a **principal–agent problem**. The agent may drift from what the principal wants.',
'u21-9':'**Agenda control matters most when majority preferences cycle**, because whoever sets the order of votes can pick the winner.',
/* u22 Congress Scholarship */
'u22-0':'David **Mayhew** (1974) described members of Congress as **"single-minded seekers of reelection."**',
'u22-1':'Mayhew\'s three reelection activities:',
'u22-2':'Richard **Fenno**\'s **"Home Style"** studied **how members present themselves to voters in their districts**. He followed them home.',
'u22-3':'Gary **Cox and Mathew McCubbins** say the majority party acts like a cartel mainly by **controlling the agenda to block bills that would split the party**.',
'u22-4':'The informal **Hastert rule**: the Speaker brings up bills only if **a majority of the majority party supports them**.',
'u22-5':'**Conditional party government** predicts strong party leaders when **members within each party agree and the parties are far apart**.',
'u22-6':'**Path dependence**: **early choices lock in later outcomes**, even when better options appear later.',
'u22-7':'Stephen **Skowronek**\'s "political time": FDR and Reagan swept away a failing old order, so they\'re presidents of **reconstruction**.',
'u22-8':'**DW-NOMINATE** is a method for **measuring legislators\' ideology from roll-call votes**. It\'s how scholars chart polarization.',
'u22-9':'**Historical institutionalism** emphasizes **critical junctures and long-run sequences**: how history shapes institutions.',
/* u23 Constitutional Interpretation */
'u23-0':'Reading the Constitution by **its meaning when it was ratified** is **originalism**. Its rival is "living constitutionalism."',
'u23-1':'The doctrine of following precedent is **stare decisis**, Latin for "to stand by things decided."',
'u23-2':'Courts use three levels of scrutiny when a law treats groups differently:',
'u23-3':'Laws that classify people **by race** get the toughest test: **strict scrutiny**.',
'u23-4':'Laws that classify **by sex** usually get **intermediate scrutiny**.',
'u23-5':'**Footnote four** of Carolene Products (1938) suggested **closer review for laws affecting "discrete and insular minorities" and the political process**. It\'s the seed of tiered scrutiny.',
'u23-6':'Applying Bill of Rights protections to states through the 14th Amendment, one right at a time, is **selective incorporation**.',
'u23-7':'**McDonald v. Chicago (2010)** incorporated **the 2nd Amendment** against the states.',
'u23-8':'The **major questions doctrine** (West Virginia v. EPA, 2022): agencies **need clear authorization from Congress for decisions of vast economic and political significance**.',
'u23-9':'**Textualism** focuses on **the ordinary meaning of a law\'s words** rather than what lawmakers intended.',
/* u24 Research Methods */
'u24-0':'A **confounder** is a variable that influences **both** the supposed cause and the effect. Ice cream sales and drownings both rise with summer heat.',
'u24-1':'**Randomized experiments** are the gold standard because **random assignment balances confounders between groups on average**.',
'u24-2':'Comparing candidates who **barely won** with those who **barely lost** is a **regression discontinuity design**. Near the cutoff, winners and losers are nearly identical.',
'u24-3':'**Difference-in-differences** compares changes over time between groups. Its key assumption: **parallel trends** without the treatment.',
'u24-4':'Whether findings apply to other places and times is **external validity**.',
'u24-5':'People overreport voting in surveys because it\'s seen as good. That\'s **social desirability bias**.',
'u24-6':'Tracing the step-by-step causal mechanism within one case is **process tracing**.',
'u24-7':'If wealth causes democracy, a study claiming democracy causes wealth may suffer from **reverse causality**.',
'u24-8':'Classic rule: **correlation, even statistically significant, does not prove causation**.',
'u24-9':'Alan **Gerber and Donald Green** ran famous field experiments on **get-out-the-vote mobilization**. Their finding: door-knocking beats robocalls. Useful for organizers!',

'w2-4':'In **odd-numbered years**, when the two-year budget is written, the regular session lasts **105 days**. In even years it\'s a short 60-day session.',
