<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<title>Capitol Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: three-column app on desktop (nav | path | rail); single column + bottom tabs on phones */
:root{
 --bg:#F5F6FB; --surface:#FFFFFF; --surface-2:#ECEFF7; --line:#DCE1EE; --ink:#1A2340; --ink-2:#5D6787;
 --blue:#2F6BFF; --blue-d:#1D4BC4; --gold:#FFB320; --gold-d:#D48A00; --red:#FF4B5C; --red-d:#CC2638;
 --green:#1FBF75; --green-d:#13935A; --purple:#8B5CF6; --purple-d:#6A3BD8; --teal:#10B4C2; --teal-d:#0A8893;
 --flame:#FF8A1F; --punk:#FF2E88; --punk-d:#C9116A;
 --ok-bg:#D9F7E8; --ok-ink:#0F7A48; --bad-bg:#FFE2E5; --bad-ink:#B11E30;
 --shadow:0 1px 0 rgba(20,30,60,.04),0 8px 24px rgba(20,30,60,.06);
 --display:'Fredoka','Nunito',ui-rounded,system-ui,sans-serif;
 --body:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#0F1426; --surface:#182037; --surface-2:#222B47; --line:#2E3858; --ink:#EEF1FB; --ink-2:#9AA4C6;
 --blue:#4C82FF; --blue-d:#2B57C9; --gold:#FFBE3D; --gold-d:#C98A06; --red:#FF5E6D; --red-d:#C22B3B;
 --green:#2BCB82; --green-d:#169457; --purple:#9B74FF; --purple-d:#6C46D6; --teal:#22C3D0; --teal-d:#0E8C97;
 --flame:#FF9A3A; --punk:#FF4D9C; --punk-d:#C21E6E;
 --ok-bg:#103A28; --ok-ink:#6FE3A9; --bad-bg:#40171F; --bad-ink:#FF9AA5;
 --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0F1426; --surface:#182037; --surface-2:#222B47; --line:#2E3858; --ink:#EEF1FB; --ink-2:#9AA4C6;
 --blue:#4C82FF; --blue-d:#2B57C9; --gold:#FFBE3D; --gold-d:#C98A06; --red:#FF5E6D; --red-d:#C22B3B;
 --green:#2BCB82; --green-d:#169457; --purple:#9B74FF; --purple-d:#6C46D6; --teal:#22C3D0; --teal-d:#0E8C97;
 --flame:#FF9A3A; --punk:#FF4D9C; --punk-d:#C21E6E;
 --ok-bg:#103A28; --ok-ink:#6FE3A9; --bad-bg:#40171F; --bad-ink:#FF9AA5;
 --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
.ic{display:inline-block;vertical-align:middle;flex:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}

/* ---------- 3D buttons ---------- */
.btn{--c:var(--blue);--cd:var(--blue-d);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:16px;background:var(--c);color:#fff;font-weight:900;font-size:15px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 4px 0 var(--cd);transition:transform .08s,box-shadow .08s,filter .15s;user-select:none}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--cd)}
.btn[disabled]{background:var(--surface-2);color:var(--ink-2);box-shadow:0 4px 0 var(--line);cursor:default;filter:none;transform:none}
.btn.wide{width:100%}
.btn.ghost{background:var(--surface);color:var(--blue);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.green{--c:var(--green);--cd:var(--green-d)}
.btn.red{--c:var(--red);--cd:var(--red-d)}
.btn.gold{--c:var(--gold);--cd:var(--gold-d)}
.btn.punk{--c:var(--punk);--cd:var(--punk-d)}
.btn.sm{min-height:40px;padding:0 14px;font-size:13px;border-radius:12px}
.linkbtn{color:var(--blue);font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:14px;padding:12px}

/* ---------- app frame ---------- */
#app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.rail{display:none}
.mainwrap{min-width:0;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));border-bottom:2px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.stat{display:inline-flex;align-items:center;gap:5px;font-weight:900;font-size:16px;padding:6px 8px;border-radius:12px}
.stat:hover{background:var(--surface-2)}
.stat.flame{color:var(--flame)} .stat.flame.cold{color:var(--ink-2)}
.stat.gem{color:var(--blue)} .stat.heart{color:var(--red)}
.chip-level{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:13px;padding:6px 10px;border-radius:12px;border:2px solid var(--line);color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase}
.view{padding:16px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));max-width:640px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:var(--surface);border-top:2px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;color:var(--ink-2);font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;flex:1;max-width:84px;border:2px solid transparent}
.tab.on{color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent);border-color:color-mix(in srgb,var(--blue) 35%,transparent)}
@media (min-width:1000px){
 #app{grid-template-columns:232px minmax(0,1fr) 360px}
 .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:24px 14px;border-right:2px solid var(--line)}
 .rail{display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto;padding:24px 24px 24px 8px}
 .tabs{display:none}
 .mainwrap{padding-bottom:40px}
 .topbar .stats-m{display:none}
 .topbar{justify-content:flex-start}
 .brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px}
 .brand b{font-family:var(--display);font-size:24px;font-weight:700;color:var(--punk);letter-spacing:-.01em}
 .side .tab{flex-direction:row;gap:14px;font-size:14px;padding:10px 14px;max-width:none;flex:none;justify-content:flex-start}
}
.railstats{display:flex;justify-content:space-between;align-items:center}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px}
.card h3{font-size:19px}
.card .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}

/* ---------- path ---------- */
.banner-risk{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--flame) 14%,var(--surface));border:2px solid color-mix(in srgb,var(--flame) 45%,transparent);border-radius:18px;padding:12px 14px;margin-bottom:18px;font-weight:800}
.sec{margin-bottom:28px}
.sec-head{border-radius:22px;padding:18px;background:var(--surface);border:2px solid var(--line);margin-bottom:18px;display:grid;gap:8px}
.sec-head .lvl{display:inline-flex;align-self:start;justify-self:start;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--c);color:#fff;font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.sec-head h2{font-size:24px}
.sec-head .bar{height:12px}
.sec-head.locked{opacity:.92}
.bar{height:16px;border-radius:999px;background:var(--surface-2);overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--c,var(--green));border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar>i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.unit-banner{--c:var(--blue);--cd:var(--blue-d);display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--c);color:#fff;border-radius:18px;padding:16px 16px 16px 18px;box-shadow:0 4px 0 var(--cd);margin:8px 0 26px}
.unit-banner small{font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:12px;opacity:.85}
.unit-banner h3{font-size:21px;margin:2px 0}
.unit-banner p{font-size:14px;opacity:.92}
.unit-banner .guide{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid rgba(255,255,255,.4);border-radius:14px;padding:10px;color:#fff;font-size:10px;font-weight:900;letter-spacing:.06em}
.unit-banner .guide:hover{background:rgba(255,255,255,.12)}
.unit-banner.locked{filter:saturate(.25) brightness(.95);opacity:.75}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:34px;padding:10px 0 34px}
.stats-m{display:flex;gap:2px}
.nodewrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{--c:var(--blue);--cd:var(--blue-d);position:relative;width:72px;height:66px;border-radius:50%;background:var(--c);color:#fff;box-shadow:0 7px 0 var(--cd);display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(6px);box-shadow:0 1px 0 var(--cd)}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-d)}
.node.lock{background:var(--surface-2);color:var(--ink-2);box-shadow:0 7px 0 var(--line)}
.node.test{width:84px;height:76px}
.node.cp{width:96px;height:86px;border-radius:28px}
.node.cur{animation:none}
.ring{position:absolute;inset:-12px;pointer-events:none}
.startbub{position:absolute;top:-46px;left:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--line);color:var(--c);font-weight:900;letter-spacing:.06em;padding:7px 12px;border-radius:12px;white-space:nowrap;font-size:14px;animation:bob 1.6s ease-in-out infinite;z-index:2}
.startbub::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
.pop{--c:var(--blue);--cd:var(--blue-d);position:relative;margin-top:18px;width:min(300px,86vw);background:var(--c);color:#fff;border-radius:18px;padding:16px;display:grid;gap:10px;z-index:5;animation:popin .18s ease-out}
.pop::before{content:"";position:absolute;top:-8px;left:50%;width:16px;height:16px;background:var(--c);transform:translateX(-50%) rotate(45deg)}
.pop.lock{background:var(--surface-2);color:var(--ink-2);border:2px solid var(--line)}
.pop.lock::before{background:var(--surface-2);border-left:2px solid var(--line);border-top:2px solid var(--line)}
.pop h4{font-size:18px}
.pop .btn{background:#fff;color:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.18)}
@keyframes popin{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
.path-mascot{position:absolute;top:70px;pointer-events:none;opacity:.98}
.live-tag{display:inline-flex;align-items:center;gap:6px;color:var(--red);font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}

/* ---------- overlay / session ---------- */
#overlay{position:fixed;inset:0;z-index:60;display:none}
#overlay.on{display:block}
.screen{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lhead{display:flex;align-items:center;gap:14px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));max-width:1000px;width:100%;margin:0 auto}
.lhead .bar{flex:1}
.lhead .x{color:var(--ink-2);padding:6px;border-radius:10px}
.lhead .x:hover{background:var(--surface-2)}
.lbody{flex:1;overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.lin{max-width:620px;margin:0 auto;display:grid;gap:18px;padding-top:8px}
.qtype{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--punk)}
.qtype.newword{display:inline-flex;gap:6px;align-items:center}
.prompt{font-family:var(--display);font-size:clamp(22px,4.6vw,28px);font-weight:600;line-height:1.25}
.speak{display:flex;align-items:flex-end;gap:10px}
.bubble{position:relative;border:2px solid var(--line);border-radius:18px;padding:14px 16px;font-size:18px;font-weight:700;background:var(--surface);flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-9px;bottom:22px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:58px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line);font-weight:700;font-size:16px;transition:transform .06s,box-shadow .06s,background .12s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--ink-2);font-weight:900}
.opt.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--surface));box-shadow:0 4px 0 color-mix(in srgb,var(--blue) 60%,var(--line));color:var(--blue)}
.opt.sel .k{border-color:var(--blue);color:var(--blue)}
.opt.right{border-color:var(--green);background:var(--ok-bg);color:var(--ok-ink);box-shadow:0 4px 0 var(--green)}
.opt.wrong{border-color:var(--red);background:var(--bad-bg);color:var(--bad-ink);box-shadow:0 4px 0 var(--red);animation:shake .35s}
.opt[disabled]{cursor:default}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-size:20px;font-family:var(--display);min-height:84px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.fillline{font-size:20px;font-weight:700;line-height:2.1}
.blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--ink-2);padding:0 8px;text-align:center;color:var(--blue);font-family:var(--display)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chipb{padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:16px}
.chipb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.chipb.used{visibility:hidden}
.chipb.sel{border-color:var(--blue);color:var(--blue)}
.orderzone{min-height:60px;border:2px dashed var(--line);border-radius:16px;padding:10px;display:grid;gap:8px;counter-reset:st}
.orderzone:empty::before{content:"Tap the steps below in order";color:var(--ink-2);font-weight:700;padding:8px}
.ostep{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line);font-weight:700;width:100%}
.orderzone .ostep::before{counter-increment:st;content:counter(st);flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px;display:grid;place-items:center;font-weight:900}
.bank{display:grid;gap:8px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start;min-width:0}
.mt{min-height:58px;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:14px;line-height:1.25;transition:opacity .3s,transform .06s}
.mt.sel{border-color:var(--blue);color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,var(--surface))}
.mt.ok{border-color:var(--green);color:var(--ok-ink);background:var(--ok-bg);box-shadow:0 4px 0 var(--green)}
.mt.gone{opacity:.35;pointer-events:none;box-shadow:none}
.mt.bad{border-color:var(--red);color:var(--bad-ink);background:var(--bad-bg);animation:shake .35s}
.typein{width:100%;min-height:120px;resize:none;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:14px;font:700 18px var(--body)}
.lfoot{border-top:2px solid var(--line);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
.lfoot .in{max-width:1000px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.lfoot.ok{background:var(--ok-bg);border-color:transparent}
.lfoot.bad{background:var(--bad-bg);border-color:transparent}
.fb{display:flex;gap:12px;align-items:flex-start;flex:1;min-width:220px}
.fb .badge{flex:none;width:52px;height:52px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.fb h3{font-size:22px}
.lfoot.ok .fb{color:var(--ok-ink)} .lfoot.bad .fb{color:var(--bad-ink)}
.fb p{font-weight:700;font-size:15px;margin-top:2px}
.fb .why{font-weight:600;opacity:.9;margin-top:4px;font-size:14px}
@media (max-width:600px){.lfoot .in>.btn{width:100%}}
.learn{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px;display:grid;gap:14px}
.learn ul{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.learn li{display:flex;gap:10px;font-size:17px;line-height:1.45}
.learn li::before{content:"";flex:none;width:10px;height:10px;margin-top:8px;border-radius:3px;background:var(--punk);transform:rotate(45deg)}
.learn b{color:var(--punk)}
.combo{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--flame);color:#fff;font-weight:900;padding:8px 16px;border-radius:999px;display:flex;gap:6px;align-items:center;box-shadow:0 4px 0 #c75f00;animation:comboin 1.4s ease forwards;pointer-events:none}
@keyframes comboin{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.08)}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.timer{height:16px;flex:1}
.timer>i{background:var(--gold)}

/* results */
.result{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));text-align:center}
.result h1{font-size:clamp(28px,6vw,36px);color:var(--gold)}
.result h1.fail{color:var(--red)}
.tiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.tile{--c:var(--gold);width:118px;border-radius:16px;border:2px solid var(--c);background:var(--c);overflow:hidden;animation:popin .4s both}
.tile .t{color:#fff;font-weight:900;font-size:11px;letter-spacing:.08em;padding:5px 0;text-transform:uppercase}
.tile .v{background:var(--surface);border-radius:13px;padding:12px 4px;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--c)}
.bigflame{position:relative;animation:flamein .8s cubic-bezier(.2,1.4,.4,1) both}
@keyframes flamein{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.bignum{font-family:var(--display);font-size:88px;font-weight:700;color:var(--flame);line-height:1}
.week{display:flex;gap:8px;justify-content:center;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px}
.wd{display:grid;gap:6px;justify-items:center;font-size:12px;font-weight:900;color:var(--ink-2)}
.wd i{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:#fff}
.wd.on i{background:var(--flame)} .wd.fz i{background:var(--teal)} .wd.today{color:var(--flame)}
.rfoot{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:2px solid var(--line)}
.rfoot .in{max-width:560px;margin:0 auto;display:grid;gap:10px}

/* modal */
.modal-bg{position:absolute;inset:0;background:rgba(10,14,30,.55);display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:24px;padding:22px;width:min(440px,100%);max-height:90vh;overflow:auto;display:grid;gap:14px;text-align:center;justify-items:center;animation:popin .2s}
.modal h2{font-size:24px}
.modal .row{display:grid;gap:10px;width:100%}
.guidebook{text-align:left;justify-items:stretch;width:min(560px,100%)}
.guidebook .learn{border-width:2px}

/* lists: league, quests, shop, profile */
.pagehead{display:flex;align-items:center;gap:14px;margin:4px 0 18px}
.pagehead h1{font-size:28px}
.lb{display:grid;gap:2px}
.lbrow{display:grid;grid-template-columns:34px 40px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 10px;border-radius:14px}
.lbrow.me{background:color-mix(in srgb,var(--blue) 12%,var(--surface));outline:2px solid color-mix(in srgb,var(--blue) 40%,transparent)}
.lbrow .rk{font-weight:900;text-align:center;color:var(--ink-2)}
.lbrow .rk.top{color:var(--green)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900}
.lbrow .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbrow .xp{font-weight:800;color:var(--ink-2)}
.zone{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;padding:8px 6px}
.zone::before,.zone::after{content:"";flex:1;height:2px;background:currentColor;opacity:.4}
.zone.up{color:var(--green)} .zone.down{color:var(--red)}
.tiers{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.tierb{flex:none;width:52px;height:58px;display:grid;place-items:center}
.tierb.off{opacity:.3;filter:grayscale(1)}
.quest{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-bottom:2px solid var(--line)}
.quest:last-child{border-bottom:0}
.quest .t{font-weight:800;margin-bottom:6px}
.quest .bar{height:18px}
.quest .bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--ink)}
.shopitem{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 0;border-bottom:2px solid var(--line)}
.shopitem:last-child{border-bottom:0}
.shopitem h3{font-size:18px}
.shopitem p{font-size:14px;color:var(--ink-2);margin-top:2px}
.price{display:inline-flex;align-items:center;gap:4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.statbox{border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.statbox b{display:block;font-size:20px;font-weight:900;line-height:1.1}
.statbox small{color:var(--ink-2);font-weight:700}
.ach{display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px;align-items:center;padding:14px 0;border-bottom:2px solid var(--line)}
.ach:last-child{border-bottom:0}
.ach h4{font-size:17px;display:flex;justify-content:space-between;gap:8px}
.ach p{font-size:14px;color:var(--ink-2);margin:2px 0 8px}
.ach .bar{height:12px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid var(--line);font-weight:800}
.setrow:last-child{border-bottom:0}
.switch{width:52px;height:30px;border-radius:999px;background:var(--surface-2);border:2px solid var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch.on{background:var(--green);border-color:var(--green)}
.switch.on::after{left:24px}
select,.textin{font:800 15px var(--body);color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.practice-card{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;align-items:center;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 4px 0 var(--line);margin-bottom:14px}
.practice-card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.practice-card h3{font-size:19px}
.practice-card p{color:var(--ink-2);font-size:14px;margin-top:2px}
.pc-ic{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;color:#fff}
.ring-goal{position:relative;width:64px;height:64px;flex:none}
.ring-goal svg{transform:rotate(-90deg)}
.ring-goal b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:900}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:grid;gap:8px;pointer-events:none;width:min(420px,92vw)}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:800;display:flex;gap:10px;align-items:center;animation:toast 3.2s ease forwards}
@keyframes toast{0%{opacity:0;transform:translateY(10px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.mascot-bob{animation:mbob 2.4s ease-in-out infinite}
@keyframes mbob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.chest{animation:chest .9s ease both}
@keyframes chest{0%{transform:scale(.6) rotate(0)}30%{transform:scale(1.05) rotate(-8deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}75%{transform:rotate(3deg)}100%{transform:scale(1) rotate(0)}}
.onb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));text-align:center;max-width:560px;margin:0 auto;width:100%}
.onb h1{font-size:clamp(28px,7vw,40px)}
.onb .opts{width:100%}
.goalopt{justify-content:space-between}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ===== 3D + motion layer ===== */
body{background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--ink) 8%,transparent) 1.2px,transparent 0);background-size:24px 24px}
.topbar,.lhead,.lfoot:not(.ok):not(.bad),.rfoot{background:var(--bg)}
.btn{background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 52%);box-shadow:0 5px 0 var(--cd),0 10px 18px -8px color-mix(in srgb,var(--cd) 80%,transparent);transition:transform .14s cubic-bezier(.3,1.7,.5,1),box-shadow .14s,filter .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--cd),0 14px 22px -8px color-mix(in srgb,var(--cd) 80%,transparent)}
.btn:active{transform:translateY(5px) scale(.985);box-shadow:0 0 0 var(--cd)}
.btn[disabled]{background-image:none}
.btn.ghost{background-image:none}

/* nodes: chunky glossy buttons that float */
.node{background-image:radial-gradient(circle at 33% 26%,rgba(255,255,255,.6) 0 9%,rgba(255,255,255,.16) 26%,transparent 52%);box-shadow:0 9px 0 var(--cd),0 20px 24px -10px rgba(0,0,0,.45);transition:transform .18s cubic-bezier(.3,1.7,.5,1),box-shadow .12s}
.node:hover{transform:translateY(-4px) scale(1.06)}
.node:active{transform:translateY(8px) scale(.97);box-shadow:0 1px 0 var(--cd),0 4px 8px -4px rgba(0,0,0,.4)}
.node.done{box-shadow:0 9px 0 var(--gold-d),0 20px 24px -10px rgba(0,0,0,.45);overflow:hidden}
.node.done::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.75) 50%,transparent 62%);background-size:260% 100%;animation:shine 3.2s ease-in-out infinite;pointer-events:none}
.node.lock{background-image:radial-gradient(circle at 33% 26%,rgba(255,255,255,.35) 0 9%,transparent 50%);box-shadow:0 8px 0 var(--line),0 14px 18px -10px rgba(0,0,0,.3)}
.node.cur{animation:float 2.2s ease-in-out infinite}
.node svg.ic{filter:drop-shadow(0 2px 0 rgba(0,0,0,.22))}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -7px}}
@keyframes shine{0%,55%{background-position:130% 0}100%{background-position:-130% 0}}
.startbub{box-shadow:0 4px 0 var(--line);font-size:15px}

/* cards and banners get depth */
.unit-banner{background-image:linear-gradient(135deg,rgba(255,255,255,.22),transparent 42%),repeating-linear-gradient(-45deg,rgba(255,255,255,.07) 0 12px,transparent 12px 24px);box-shadow:0 6px 0 var(--cd),0 18px 26px -14px color-mix(in srgb,var(--cd) 90%,transparent)}
.unit-banner h3{text-shadow:0 2px 0 rgba(0,0,0,.18)}
.sec-head,.card{box-shadow:0 5px 0 var(--line)}
.practice-card{box-shadow:0 6px 0 var(--line);transition:transform .15s cubic-bezier(.3,1.7,.5,1),box-shadow .12s}
.practice-card:hover{transform:translateY(-3px)}
.practice-card:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line)}
.pc-ic{box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.25)}
.tilt{transform-style:preserve-3d;transition:transform .25s ease-out;will-change:transform}
.view.enter .sec-head,.view.enter .unit-banner{animation:rise .55s cubic-bezier(.2,1.5,.4,1) both}
.view.enter .nodewrap{animation:dropin .6s cubic-bezier(.2,1.6,.4,1) both}
.view.enter .path .nodewrap:nth-child(3){animation-delay:.05s}.view.enter .path .nodewrap:nth-child(4){animation-delay:.1s}.view.enter .path .nodewrap:nth-child(5){animation-delay:.15s}.view.enter .path .nodewrap:nth-child(6){animation-delay:.2s}.view.enter .path .nodewrap:nth-child(7){animation-delay:.25s}
.view.enter .practice-card,.view.enter .card,.view.enter .lbrow{animation:rise .5s cubic-bezier(.2,1.5,.4,1) both}
.view.enter .practice-card:nth-child(3),.view.enter .lbrow:nth-child(2n){animation-delay:.06s}.view.enter .practice-card:nth-child(4){animation-delay:.12s}.view.enter .practice-card:nth-child(5){animation-delay:.18s}.view.enter .practice-card:nth-child(6){animation-delay:.24s}
@keyframes rise{from{transform:translateY(18px) scale(.97)}}
@keyframes dropin{from{transform:translateY(-26px) scale(.6)}}
.tab.on svg{animation:tabpop .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes tabpop{0%{transform:scale(.6) rotate(-12deg)}70%{transform:scale(1.2) rotate(4deg)}100%{transform:none}}

/* lesson screen */
.lhead .bar{height:20px;box-shadow:inset 0 3px 0 rgba(0,0,0,.08)}
.bar>i{background-image:linear-gradient(180deg,rgba(255,255,255,.25),transparent 60%)}
.bar.bump>i{animation:bump .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{40%{filter:brightness(1.3)}}
.bar.bump{animation:barpop .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes barpop{40%{transform:scaleY(1.35)}}
.stat.heart.hurt svg{animation:hurt .7s ease}
@keyframes hurt{0%{transform:scale(1)}20%{transform:scale(1.7) rotate(-14deg)}40%{transform:scale(.8) rotate(10deg)}60%{transform:scale(1.2) rotate(-6deg)}100%{transform:none}}
.lin>*{animation:qin .45s cubic-bezier(.2,1.4,.4,1) both}
.lin>*:nth-child(2){animation-delay:.05s}.lin>*:nth-child(3){animation-delay:.1s}
@keyframes qin{from{opacity:0;transform:translateX(40px)}}
.lin.still>*{animation:none}
.opt,.chipb,.ostep,.mt{transition:transform .14s cubic-bezier(.3,1.7,.5,1),box-shadow .12s,background .12s}
.opt{box-shadow:0 5px 0 var(--line)}
.opt:hover:not([disabled]),.chipb:hover,.ostep:hover:not([disabled]),.mt:hover{transform:translateY(-2px)}
.opt.sel{animation:selpop .25s cubic-bezier(.2,1.8,.4,1);box-shadow:0 5px 0 color-mix(in srgb,var(--blue) 60%,var(--line))}
.opt.right{animation:right .6s cubic-bezier(.2,1.8,.4,1);box-shadow:0 5px 0 var(--green),0 0 0 6px color-mix(in srgb,var(--green) 25%,transparent)}
.mt.ok{animation:right .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes selpop{50%{transform:scale(1.04)}}
@keyframes right{0%{transform:scale(1)}35%{transform:scale(1.07) translateY(-3px)}100%{transform:none}}
.opt .k{box-shadow:0 2px 0 var(--line)}
.lfoot.ok,.lfoot.bad{animation:slideup .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes slideup{from{transform:translateY(100%)}}
.fb .badge{box-shadow:0 4px 0 rgba(0,0,0,.08);animation:badge .6s cubic-bezier(.2,1.8,.4,1) .08s both}
@keyframes badge{from{transform:scale(0) rotate(-120deg)}}
.fb h3{animation:titlepop .5s cubic-bezier(.2,1.6,.4,1) .1s both}
.mascot-react{transform-origin:50% 100%;flex:none}
.mascot-react.idle{animation:mbob 2.6s ease-in-out infinite}
.mascot-react.hop{animation:hop .7s cubic-bezier(.3,1.5,.5,1)}
.mascot-react.droop{animation:droop .7s ease}
@keyframes hop{0%{transform:none}20%{transform:scale(1.1,.85)}45%{transform:translateY(-22px) scale(.95,1.08) rotate(-4deg)}70%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
@keyframes droop{0%{transform:none}25%{transform:rotate(-8deg) translateX(-4px)}50%{transform:rotate(6deg)}75%{transform:rotate(-3deg) scale(.97)}100%{transform:none}}
.combo{font-size:19px;padding:10px 20px;box-shadow:0 5px 0 #c75f00,0 14px 24px -8px rgba(199,95,0,.6);animation:comboin 1.5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes comboin{0%{opacity:0;transform:translate(-50%,20px) scale(.4) rotate(-12deg)}15%{opacity:1;transform:translate(-50%,0) scale(1.18) rotate(4deg)}28%{transform:translate(-50%,0) scale(1) rotate(-2deg)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-20px) scale(.9)}}

/* result screens */
.hero{position:relative;display:grid;place-items:center}
.burst{position:absolute;width:340px;height:340px;max-width:92vw;max-height:92vw;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--gold) 38%,transparent) 0 9deg,transparent 9deg 22.5deg);-webkit-mask:radial-gradient(circle,#000 22%,transparent 68%);mask:radial-gradient(circle,#000 22%,transparent 68%);animation:spin 14s linear infinite,fade .6s}

@keyframes spin{to{transform:rotate(360deg)}}
.hero>svg,.hero>.bigflame,.hero>.ring-goal,.hero>.pc-ic{position:relative;animation:jumpin .8s cubic-bezier(.2,1.6,.4,1) both}
@keyframes jumpin{0%{transform:translateY(60px) scale(.3);opacity:0}60%{transform:translateY(-12px) scale(1.08);opacity:1}100%{transform:none}}
.result h1{text-shadow:0 4px 0 var(--gold-d);animation:titlepop .6s cubic-bezier(.2,1.6,.4,1) .2s both}
.result h1.fail{text-shadow:0 4px 0 var(--red-d)}
@keyframes titlepop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:none;opacity:1}}
.tile{box-shadow:0 6px 0 color-mix(in srgb,var(--c) 70%,#000),0 16px 22px -12px color-mix(in srgb,var(--c) 70%,transparent);animation:flipin .7s cubic-bezier(.2,1.5,.4,1) both}
.tile:nth-child(1){animation-delay:.35s}.tile:nth-child(2){animation-delay:.5s}.tile:nth-child(3){animation-delay:.65s}.tile:nth-child(4){animation-delay:.8s}
@keyframes flipin{from{transform:perspective(600px) rotateX(-95deg) translateY(-20px);opacity:0}}
.bignum{text-shadow:0 6px 0 #c75f00;animation:numpop .7s cubic-bezier(.2,1.8,.4,1) .25s both}
@keyframes numpop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:none}}
.bigflame svg{animation:flicker 1.1s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes flicker{0%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.06,1.1) rotate(2deg)}100%{transform:scale(.98,1.03) rotate(-1deg)}}
.week{box-shadow:0 5px 0 var(--line)}
.wd i{box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.wd.on i,.wd.fz i{animation:numpop .5s cubic-bezier(.2,1.8,.4,1) .6s both}
.modal{box-shadow:0 8px 0 rgba(0,0,0,.12),0 30px 60px -20px rgba(0,0,0,.5);animation:modalin .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes modalin{from{transform:translateY(40px) scale(.85);opacity:0}}
.chest{animation:chest 1s cubic-bezier(.2,1.4,.4,1) both;filter:drop-shadow(0 8px 0 rgba(0,0,0,.15))}
.onb>svg{animation:jumpin .8s cubic-bezier(.2,1.6,.4,1) both}
.onb h1{animation:titlepop .6s cubic-bezier(.2,1.6,.4,1) .15s both;text-shadow:0 3px 0 color-mix(in srgb,var(--punk) 35%,transparent)}
.brand svg{animation:mbob 2.6s ease-in-out infinite}
.path{gap:44px}
/* ---- teaching cards ---- */
.tcard{position:relative;background:var(--surface);border:2px solid var(--line);border-bottom-width:6px;border-radius:22px;padding:22px 20px 20px;display:grid;gap:14px;overflow:hidden}
.tcard::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--punk),var(--gold),var(--teal))}
.lin:not(.still) .tcard{animation:cardflip .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cardflip{from{transform:perspective(900px) rotateY(-70deg) translateX(40px) scale(.9);opacity:0}}
.tfact{margin:0;font-size:19px;line-height:1.5;font-weight:700}

.tlist{margin:0;padding:0;list-style:none;counter-reset:t;display:grid;gap:8px}

.gfacts{width:100%;text-align:left;margin:-4px 0 6px}

/* level switcher */
.lvlchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 0 8px;scrollbar-width:none}
.lvlchips::-webkit-scrollbar{display:none}
.lvlchip{flex:none;padding:8px 14px;border-radius:999px;background:var(--c);color:#fff;font-weight:900;font-size:13px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 65%,#000);transition:transform .14s cubic-bezier(.3,1.7,.5,1)}
.lvlchip:hover{transform:translateY(-2px)}
.lvlchip:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 65%,#000)}
button.chip-level{cursor:pointer}
button.chip-level:hover{background:var(--surface-2)}
/* vote prompts */
.vcard h3{font-size:20px}
.vsides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.vsides{grid-template-columns:1fr}}
.vsides>div{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px}
.vsides ul{margin:6px 0 0;padding-left:18px;display:grid;gap:6px;font-weight:600;font-size:15px}
.vsides .yes{color:var(--green-d)} .vsides .no{color:var(--red-d)}
.vwhy{display:grid;gap:8px;font-weight:800}
.vwhy .typein{min-height:110px;font-size:16px}
.pos{padding:12px 0;border-bottom:2px solid var(--line);display:grid;gap:6px}
.pos:last-child{border-bottom:0}
.pos p{font-weight:600;color:var(--ink-2)}
.vtag{flex:none;font-weight:900;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;color:#fff}
.vtag.yes{background:var(--green)} .vtag.no{background:var(--red)}
/* my reps */
.reps{display:grid;gap:12px}
@media (min-width:700px){.reps{grid-template-columns:1fr 1fr}}
.repc{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:14px 16px;display:grid;gap:4px;align-content:start}
.repc h3{font-size:20px;color:var(--punk)}
.repc p{font-size:15px;font-weight:600}
.repnote{display:flex;gap:6px;align-items:flex-start;color:var(--gold-d);font-size:14px!important;margin-top:4px}
.repnote svg{flex:none;margin-top:3px}
.repsel{display:grid;gap:6px;font-weight:800}
.repsel select{width:100%}
.view a{color:var(--blue);font-weight:800}

.howcard{background:var(--surface);border:2px solid var(--line);border-left:6px solid var(--punk);border-radius:16px;padding:12px 14px;margin-bottom:12px;display:grid;gap:4px;font-size:15px;line-height:1.45}
.howcard b{font-weight:900}
.sec-head .how{font-weight:800;color:var(--c);font-size:15px}

details.danger{margin-top:14px;border:2px dashed var(--line);border-radius:16px;padding:6px 14px}
details.danger summary{cursor:pointer;font-weight:800;color:var(--ink-2);padding:6px 0}

.seg{display:flex;gap:6px;background:var(--surface-2);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;font:inherit;font-weight:900;padding:10px;border-radius:10px;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.lbjoin{display:grid;gap:12px}
.lbtable{display:grid;gap:4px;padding:8px}
.lbrow{display:grid;grid-template-columns:28px 40px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:12px}
.lbrow.me{background:color-mix(in srgb,var(--punk) 12%,transparent)}
.lbrow .rank{font-weight:900;text-align:center;color:var(--ink-2)}
.lbrow .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900}
.lbrow .who{display:grid;min-width:0}.lbrow .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .who>small{display:block;line-height:1.35}.lbrow .who>small svg{vertical-align:-2px}.lbrow .who b small{display:inline}
.lbrow .pts{font-weight:900;font-size:20px;text-align:right}.lbrow .pts small{font-size:12px;margin-left:3px;color:var(--ink-2)}
.linkbtn{border:0;background:none;color:var(--blue);font:inherit;font-weight:800;text-decoration:underline;cursor:pointer;padding:0}

.pop{translate:calc(-1 * var(--nx,0px)) 0}
.pop::before{left:calc(50% + var(--nx,0px))}

.lfoot .quip{font-weight:800;opacity:.9;margin-top:2px}
.path-mascot.talk{pointer-events:auto;cursor:pointer}
.pquip{position:absolute;bottom:calc(100% + 6px);left:-6px;width:max-content;max-width:170px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:8px 10px;font-weight:800;font-size:13px;line-height:1.3;box-shadow:0 3px 0 var(--line);text-align:left}
.pquip::after{content:"";position:absolute;top:100%;left:30px;border:7px solid transparent;border-top-color:var(--line)}
.path-mascot.flip .pquip{left:auto;right:-6px}.path-mascot.flip .pquip::after{left:auto;right:30px}
.pquip.pop-in{animation:popin .2s ease-out}
.path-mascot.talk{z-index:4}
.pquip{max-width:150px}
.lfoot .quip{font-style:italic}

.testout{margin-top:10px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);color:inherit;border:2px solid rgba(255,255,255,.55);border-radius:12px;padding:6px 12px;font-weight:800;font-size:14px;cursor:pointer}
.testout:hover{background:rgba(255,255,255,.3)}
.unit-banner.locked .testout{opacity:1;filter:none}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chiprow .btn{color:var(--c);border-color:var(--c)}
.deeper{display:grid;gap:6px;text-align:left;width:100%;max-width:520px;margin:14px auto 0;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--surface)}
.deeper b{display:flex;align-items:center;gap:6px;font-weight:900}
.deeper a{color:var(--blue);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.hinge{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-weight:700;font-size:15px;text-align:left}
.hinge svg{flex:none;margin-top:3px;color:var(--purple)}
.hinge a{color:var(--blue);font-weight:800;margin-left:4px}
.lfoot .hinge{font-size:14px}
.recap{text-align:left;width:100%;max-width:520px;margin:18px auto 0;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--surface)}
.recap h3{display:flex;align-items:center;gap:6px;font-size:17px;margin:0 0 8px;color:var(--green)}
.recap ul{margin:0;padding-left:18px;display:grid;gap:8px;font-weight:600;font-size:15px;line-height:1.4}
.recap b{color:var(--ink)}
.mapsec{margin:0 0 18px;border:2px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.maphd{background:var(--c);color:#fff;padding:12px 16px;display:grid;gap:2px}
.maphd .lvl{font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.maphd h2{margin:0;font-size:19px}
.maphd small{font-weight:800;opacity:.9}
.maprow{display:grid;grid-template-columns:32px 1fr 70px;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:2px solid var(--line);padding:10px 14px;color:var(--ink);cursor:pointer;font:inherit}
.maprow:first-of-type{border-top:0}
.maprow:hover{background:var(--surface-2)}
.maprow b{display:block;font-weight:800}
.maprow small{color:var(--ink-2);font-weight:700}
.mapic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.maprow.done .mapic{background:var(--c);color:#fff}
.maprow.cur .mapic{border:3px solid var(--c);color:var(--c)}
.maprow.lock{opacity:.7}
.mapbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.mapbar i{display:block;height:100%;background:var(--c)}

.term{all:unset;cursor:pointer;font-weight:800;color:var(--punk);text-decoration:underline dotted 2px;text-underline-offset:4px;border-radius:4px}
.term:hover,.term:focus-visible{background:color-mix(in srgb,var(--punk) 14%,transparent);outline:none}
.tfact .term{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--gold) 40%,transparent) 60%);padding:0 2px}
.glossm{text-align:left}
.gloss{display:grid;gap:12px;width:100%;text-align:left}
.gloss h2{margin:0;color:var(--punk)}
.gloss .gd{font-weight:700;font-size:17px;line-height:1.45;margin:0}
.gsrc,.gex{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface-2)}
.gsrc b,.gex b{display:flex;align-items:center;gap:6px;font-weight:900;font-size:14px;margin-bottom:4px}
.gsrc p,.gex p{margin:0;font-weight:600;line-height:1.45}
.glink{color:var(--blue);font-weight:800;text-decoration:underline;text-underline-offset:3px}

.path-mascot.bea{z-index:4}
.beaq{border-color:#E23B3B;box-shadow:0 3px 0 #E23B3B}
.beaq::after{border-top-color:#E23B3B}
.beatake{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;border:2px dashed #E23B3B;border-radius:14px;text-align:left}
.beatake .beafig{flex:none}
.beatake b{color:#E23B3B;font-weight:900}
.beatake p{margin:2px 0 4px;font-weight:700}
.beatake small{color:var(--ink-2);font-weight:700;font-size:12px}
.beacameo{display:flex;gap:10px;align-items:center;max-width:460px;margin:14px auto 0;text-align:left}
.beacameo .bubble{border-color:#E23B3B}
.beacameo b{color:#E23B3B}
.result{justify-content:flex-start}
.result>:first-child{margin-top:auto}
.result>:last-child{margin-bottom:auto}
.recap,.deeper,.beacameo{flex:none}
/* ===== Zine refresh (Nov 2026): paper, ink, and Ruckus pink. Loaded after style.css and pop.css. ===== */
:root{
 --bg:#FAF7F2; --surface:#FFFFFF; --surface-2:#F2EDE4; --line:#E7E1D6; --line-2:#CFC7BA; --track:#EFE9DF; --ink:#16141C; --ink-2:#6B6775;
 --blue:#3B5BFF; --blue-d:#2440CC; --gold:#FFB320; --gold-d:#C98A06; --red:#EF3B55; --red-d:#B8213A;
 --green:#12A150; --green-d:#0B7A3B; --purple:#7C4DFF; --purple-d:#5A2FD6; --teal:#0FA3B1; --teal-d:#0A7C87;
 --flame:#FF7A1A; --punk:#FF2E88; --punk-d:#C9116A; --punk-soft:#FFE3F0; --on-punk:#FFFFFF;
 --ok-bg:#E3F6E9; --ok-ink:#0B6B35; --bad-bg:#FFE6EA; --bad-ink:#B4182E; --bea:#D8452F;
 --shadow:0 1px 2px rgba(22,20,28,.05),0 8px 24px rgba(22,20,28,.06);
 --display:'Bricolage Grotesque','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
 --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#131118; --surface:#1D1A23; --surface-2:#27232E; --line:#332E3B; --line-2:#4A4455; --track:#2B2732; --ink:#F4F1EA; --ink-2:#A9A3B3;
 --blue:#6B83FF; --blue-d:#3F57D6; --gold:#FFC14D; --gold-d:#C98A06; --red:#FF5C72; --red-d:#C22B42;
 --green:#2BC46F; --green-d:#178C4C; --purple:#9C7BFF; --purple-d:#6C46D6; --teal:#2CC2CF; --teal-d:#118C97;
 --flame:#FF9440; --punk:#FF4D9C; --punk-d:#C21E6E; --punk-soft:#3A1A2B; --on-punk:#FFFFFF;
 --ok-bg:#12301F; --ok-ink:#7BE3A6; --bad-bg:#3B1720; --bad-ink:#FF9DAB; --bea:#FF7A63;
 --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#131118; --surface:#1D1A23; --surface-2:#27232E; --line:#332E3B; --line-2:#4A4455; --track:#2B2732; --ink:#F4F1EA; --ink-2:#A9A3B3;
 --blue:#6B83FF; --blue-d:#3F57D6; --gold:#FFC14D; --gold-d:#C98A06; --red:#FF5C72; --red-d:#C22B42;
 --green:#2BC46F; --green-d:#178C4C; --purple:#9C7BFF; --purple-d:#6C46D6; --teal:#2CC2CF; --teal-d:#118C97;
 --flame:#FF9440; --punk:#FF4D9C; --punk-d:#C21E6E; --punk-soft:#3A1A2B; --on-punk:#FFFFFF;
 --ok-bg:#12301F; --ok-ink:#7BE3A6; --bad-bg:#3B1720; --bad-ink:#FF9DAB; --bea:#FF7A63;
 --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

/* ---------- base ---------- */
body{background-image:none;font-size:16px;line-height:1.5}
h1,h2,h3,h4{font-weight:700;letter-spacing:-.02em}
.eyebrow{font-weight:700;letter-spacing:.06em}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--punk);outline-offset:2px}

/* ---------- buttons: sentence case, one accent ---------- */
.btn{--c:var(--punk);--cd:var(--punk-d);background-image:none;font-weight:700;font-size:16px;letter-spacing:0;text-transform:none;min-height:52px;border-radius:16px;box-shadow:0 4px 0 var(--cd)}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--cd)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--cd)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.ghost:hover{box-shadow:0 4px 0 var(--line)}
.btn[disabled]{background:var(--surface-2);color:var(--ink-2);box-shadow:0 4px 0 var(--line)}
.btn.sm{font-size:14px;min-height:40px}
.linkbtn{color:var(--punk);letter-spacing:0;text-transform:none;font-weight:700}

/* ---------- frame ---------- */
.topbar{border-bottom:1px solid var(--line)}
.chip-level{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;letter-spacing:0;text-transform:none}
button.chip-level:hover{background:var(--surface-2)}
.stat{font-weight:700}
.tabs{background:var(--bg);border-top:1px solid var(--line)}
.tab,.tab.on{font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;border:0;background:none;gap:4px}
.tab.on{color:var(--ink)}
.tab .ic{box-sizing:content-box;padding:3px 14px;border-radius:999px;transition:background .2s}
.tab.on .ic{background:var(--punk-soft);color:var(--punk)}
.side{border-right:1px solid var(--line)}
@media (min-width:1000px){.side .tab,.side .tab.on{font-size:15px}.side .tab .ic{padding:3px 8px}.side .tab.on{background:var(--surface)}}
.card,.sec-head,.statbox,.week,.deeper,.recap,.mapsec,.repc,.learn{border-width:1px;box-shadow:none}
.card{border-radius:20px}

/* ---------- Today card ---------- */
.today{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:14px;margin-bottom:16px}
.today-top{display:flex;gap:16px;align-items:center}
.today h2{font-size:21px;line-height:1.15;text-wrap:balance}
.tring{position:relative;width:72px;height:72px;flex:none}
.tring svg circle:last-child{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.tring b{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:var(--display);font-size:20px;line-height:1}
.tring b small{display:block;font-family:var(--body);font-size:10px;font-weight:600;color:var(--ink-2);margin-top:2px}
.todaygo{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px;font-weight:700;font-size:16px;line-height:1.25;box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 55%,var(--punk));transition:transform .14s cubic-bezier(.3,1.7,.5,1),box-shadow .12s}
.todaygo small{display:block;color:var(--punk);font-size:12px;font-weight:600;margin-bottom:2px}
.todaygo .ic{flex:none;transition:transform .2s}
.todaygo:hover .ic{transform:translateX(4px)}
.todaygo:active{transform:translateY(4px);box-shadow:0 0 0 transparent}
.view.enter .today{animation:rise .5s cubic-bezier(.2,1.4,.4,1) both}

/* level chips and the folded how-to */
.lvlchips{padding:2px 2px 10px;margin:0 0 4px}
.lvlchip{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:600;font-size:14px;letter-spacing:0;text-transform:none;display:inline-flex;align-items:center;gap:8px}
.lvlchip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.lvlchip:hover{border-color:var(--line-2)}
.lvlchip:active{box-shadow:none;transform:translateY(1px)}
details.howcard{background:none;border:0;border-radius:0;padding:0 2px;margin:0 0 18px;font-size:15px;color:var(--ink-2)}
details.howcard summary{cursor:pointer;font-weight:600;color:var(--ink-2);list-style:none;display:inline-flex;align-items:center;gap:6px;padding:4px 0}
details.howcard summary::-webkit-details-marker{display:none}
details.howcard summary::before{content:"?";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);font-size:11px;font-weight:700}
details.howcard[open] p{margin:6px 0 10px;color:var(--ink)}
.banner-risk{border-width:1px;border-radius:16px;font-weight:600}

/* ---------- section + unit headers ---------- */
.sec-head{border-radius:22px;padding:18px}
.sec-head .lvl{background:var(--ink);color:var(--bg);font-weight:700;letter-spacing:.04em;font-size:11px}
.sec-head h2{font-size:26px}
.sec-head .how{color:var(--ink)}
.bar{background:var(--track)}
.bar>i{background-color:var(--punk);background-image:none}
.bar>i::after{display:none}
.timer>i{background-color:var(--gold)}
.unit-banner{background:none;background-image:none;color:var(--ink);box-shadow:none;border-radius:0;padding:4px 2px;margin:10px 0 22px;align-items:flex-end}
.unit-banner.tilt{transform:none!important}
.unit-banner small{display:inline-block;background:var(--punk);color:var(--on-punk);opacity:1;font-size:12px;font-weight:700;letter-spacing:0;text-transform:none;padding:3px 9px;border-radius:6px;transform:rotate(-2deg)}
.unit-banner h3{font-size:28px;line-height:1.05;margin:8px 0 4px;text-shadow:none}
.unit-banner p{opacity:1;color:var(--ink-2);font-size:15px}
.unit-banner .guide,.testout{flex:none;display:inline-flex;flex-direction:row;align-items:center;gap:6px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;letter-spacing:0}
.unit-banner .guide:hover,.testout:hover{background:var(--surface-2)}
.unit-banner.locked{filter:none;opacity:.5}
.unit-banner.locked small{background:var(--ink-2)}

/* ---------- path ---------- */
.node{background:var(--punk);background-image:none;color:var(--on-punk);box-shadow:0 6px 0 var(--punk-d)}
.node:active{box-shadow:0 1px 0 var(--punk-d)}
.node svg.ic{filter:none}
.node.done{background:var(--ink);color:var(--bg);box-shadow:0 6px 0 color-mix(in srgb,var(--ink) 55%,var(--punk))}
.node.done::after{display:none}
.node.test.done,.node.cp.done{background:var(--gold);color:#3D2A00;box-shadow:none;border-radius:0;clip-path:polygon(50% 0%,61% 9%,75% 6%,80% 20%,94% 25%,91% 39%,100% 50%,91% 61%,94% 75%,80% 80%,75% 94%,61% 91%,50% 100%,39% 91%,25% 94%,20% 80%,6% 75%,9% 61%,0% 50%,9% 39%,6% 25%,20% 20%,25% 6%,39% 9%)}
.node.lock{background:transparent;color:var(--ink-2);border:2.5px dashed var(--line-2);box-shadow:none}
.node.lock svg{opacity:.6}
.node.cur{box-shadow:0 6px 0 var(--punk-d),0 0 0 8px color-mix(in srgb,var(--punk) 16%,transparent)}
.ring circle:first-child{stroke:var(--track)}
.ring circle:last-child{stroke:var(--punk)}
.startbub{background:var(--ink);color:var(--bg)!important;border:0;box-shadow:none;letter-spacing:0;font-weight:700;font-size:14px;border-radius:10px}
.startbub::after{background:var(--ink);border:0;width:10px;height:10px;bottom:-5px}
.pop{background:var(--ink);color:var(--bg)}
.pop::before{background:var(--ink)}
.pop .btn{background:var(--punk);color:var(--on-punk);box-shadow:0 4px 0 var(--punk-d)}
.pop.lock{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pquip{border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-weight:600;transform:rotate(-2deg);border-radius:12px}
.pquip::after{border-top-color:var(--ink)}
.beaq{border-color:var(--bea);box-shadow:3px 3px 0 var(--bea);transform:rotate(2deg)}
.beaq::after{border-top-color:var(--bea)}
.maphd{background:var(--ink);color:var(--bg)}
.maprow{border-top-width:1px}
.mapbar i{background:var(--punk)}
.maprow.done .mapic{background:var(--ink);color:var(--bg)}
.maprow.cur .mapic{border-color:var(--punk);color:var(--punk)}

/* ---------- Ruckus personality ---------- */
.rk-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.rk-hawk{transform-box:fill-box;transform-origin:50% 100%;transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
.path-mascot .rk-hawk{animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.hot .rk-hawk{transform:scaleY(1.35);animation:hawkfire .5s ease-in-out infinite alternate;filter:drop-shadow(0 -2px 4px rgba(255,90,31,.7))}
@keyframes hawkfire{from{transform:scaleY(1.3) skewX(-3deg)}to{transform:scaleY(1.45) skewX(3deg)}}
svg.poke{animation:poke .6s cubic-bezier(.3,1.6,.5,1);transform-origin:50% 100%}
@keyframes poke{0%{transform:none}25%{transform:scale(1.12,.86)}55%{transform:translateY(-18px) rotate(-6deg)}80%{transform:scale(1.05,.95)}100%{transform:none}}

/* ---------- lesson ---------- */
.lhead .bar{height:12px;box-shadow:none}
.lhead .bar>i{background-color:var(--punk)}
.bar.fire{box-shadow:0 0 0 3px color-mix(in srgb,var(--flame) 30%,transparent),0 0 18px color-mix(in srgb,var(--flame) 55%,transparent);animation:firepulse .9s ease-in-out infinite alternate}
.lhead .bar.fire>i{background-image:linear-gradient(90deg,var(--gold),var(--flame),var(--punk),var(--flame),var(--gold));background-size:300% 100%;animation:fireflow 1.2s linear infinite}
@keyframes fireflow{to{background-position:-300% 0}}
@keyframes firepulse{to{box-shadow:0 0 0 4px color-mix(in srgb,var(--flame) 40%,transparent),0 0 26px color-mix(in srgb,var(--flame) 70%,transparent)}}
.qtype{color:var(--ink-2);font-weight:600;letter-spacing:0;text-transform:none;font-size:14px}
.qtype.newword{color:var(--punk)}
.prompt{font-weight:700;font-size:clamp(24px,6vw,30px);line-height:1.12;letter-spacing:-.02em}
.bubble{border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-weight:600;border-radius:16px}
.bubble::before{border-color:var(--ink)}
.speak .bubble{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.2;letter-spacing:-.01em}
.opt{border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:600;border-radius:16px}
.opt .k{border:1px solid var(--line);box-shadow:none;font-weight:600;border-radius:7px;width:24px;height:24px;font-size:12px}
.opt.sel{border:2px solid var(--ink);background:var(--punk-soft);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.opt.sel .k{border-color:var(--ink);color:var(--ink)}
.opt.right{border:2px solid var(--green);box-shadow:0 3px 0 var(--green),0 0 0 5px color-mix(in srgb,var(--green) 18%,transparent)}
.opt.right .k{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border:2px solid var(--red);box-shadow:0 3px 0 var(--red)}
.tf .opt{font-weight:700}
.chipb,.ostep,.mt{border-width:1.5px;font-weight:600}
.chipb.sel,.mt.sel{border-color:var(--ink);color:var(--ink);background:var(--punk-soft)}
.orderzone .ostep::before{background:var(--punk)}
.blank{color:var(--punk)}
.lfoot{border-top:1px solid var(--line)}
.lfoot.ok,.lfoot.bad{border-radius:24px 24px 0 0}
.fb h3{font-size:24px}
.fb p{font-weight:600}
.fb .badge{box-shadow:none}
.fbr{flex:none;margin-top:-34px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08))}
.beacomfort{display:flex;gap:10px;align-items:center;margin-top:10px;padding:8px 12px 8px 6px;background:var(--surface);border:1.5px solid color-mix(in srgb,var(--bea) 55%,transparent);border-radius:14px;color:var(--ink);font-size:14px;animation:beain .5s cubic-bezier(.2,1.5,.4,1) .35s both}
.beacomfort svg{flex:none}
.beacomfort p{margin:0;font-weight:600}
.beacomfort b{color:var(--bea)}
@keyframes beain{from{opacity:0;transform:translateY(10px) scale(.95)}}
.tcard{border-width:1.5px;border-bottom-width:4px}
.tcard::before{background:var(--punk);height:4px}
.tfact{font-weight:600}
.tfact b,.tfact .term{background:linear-gradient(transparent 58%,var(--punk-soft) 58%)}
.tlist li,.tpairs div{border-width:1px;font-weight:600}
.learn{border-radius:22px}
.learn li{font-weight:500}
.combo{background:var(--ink);color:var(--bg);box-shadow:0 4px 0 var(--punk),0 14px 24px -8px rgba(0,0,0,.35);font-weight:700}
.combo .ic{color:var(--flame)}
.hintbtn{font-size:15px}

/* ---------- results ---------- */
.result h1{color:var(--punk);text-shadow:none;font-size:clamp(30px,7vw,40px)}
.result h1.fail{color:var(--ink);text-shadow:none}
.burst{background:repeating-conic-gradient(color-mix(in srgb,var(--punk) 26%,transparent) 0 9deg,transparent 9deg 22.5deg)}
.burst.flame{background:repeating-conic-gradient(color-mix(in srgb,var(--flame) 32%,transparent) 0 9deg,transparent 9deg 22.5deg)}
.tile{background:var(--surface);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:18px}
.tile .t{color:var(--ink-2);font-weight:600;letter-spacing:0;text-transform:none;font-size:12px;padding:8px 0 0}
.tile .v{color:var(--ink);font-weight:700;font-family:var(--display);font-size:26px;padding:6px 4px 12px}
.tile .v .ic{color:var(--c)}
.bignum{text-shadow:none}
.onb h1{text-shadow:none}
.wd{font-weight:700}
.beacameo .bubble{border-color:var(--bea);box-shadow:3px 3px 0 var(--bea);font-family:var(--body);font-size:15px}

/* the bill and the stamp */
.bill{position:relative;width:min(280px,80vw);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px 20px 26px;display:grid;gap:10px;text-align:left;box-shadow:var(--shadow);transform:rotate(-2deg);animation:jumpin .7s cubic-bezier(.2,1.5,.4,1) both,thud .35s ease .5s}
.bill small{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--ink-2);letter-spacing:.04em}
.bill b{font-family:var(--display);font-size:22px;line-height:1.1;letter-spacing:-.01em}
.bill i{display:block;height:7px;border-radius:4px;background:var(--surface-2)}
.bill i.short{width:60%}
.stamp{position:absolute;left:50%;top:64%;translate:-50% -50%;border:4px solid var(--punk);color:var(--punk);border-radius:10px;padding:6px 14px;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;rotate:-14deg;background:color-mix(in srgb,var(--surface) 70%,transparent);animation:stampin .32s cubic-bezier(.5,0,.75,0) .4s both}
@keyframes stampin{0%{opacity:0;transform:scale(3)}100%{opacity:1;transform:scale(1)}}
@keyframes thud{0%,100%{transform:rotate(-2deg)}30%{transform:rotate(-2deg) translateY(4px) scale(.98)}60%{transform:rotate(-1deg)}}

/* ---------- lists, profile, practice ---------- */
.practice-card{border-width:1px;box-shadow:0 3px 0 var(--line);border-radius:20px}
.practice-card:active{box-shadow:0 0 0 var(--line)}
.practice-card .pc-ic{background:var(--ink)!important;color:var(--bg);box-shadow:none;border-radius:18px;width:60px;height:60px}
.practice-card{grid-template-columns:60px minmax(0,1fr)}
.pc-ic{box-shadow:none}
.ach,.quest,.shopitem,.setrow,.pos{border-bottom-width:1px}
.statbox b{font-family:var(--display);font-weight:700}
.lbrow.me{background:var(--punk-soft);outline:0}
.seg{background:var(--surface-2)}
.seg button{font-weight:700}
.switch.on{background:var(--punk);border-color:var(--punk)}
select,.textin{border-width:1px;font-weight:600}
.view a,.deeper a,.glink,.hinge a{color:var(--punk)}
.term{color:var(--punk)}
.gloss h2{color:var(--punk)}
.repc{border-bottom-width:3px}
.repc h3{color:var(--ink)}
.modal{border-radius:26px}
.vsides>div,.gsrc,.gex{border-width:1px}

@media (prefers-reduced-motion:reduce){.rk-eyes,.rk-hawk,.path-mascot .rk-hawk,.hot .rk-hawk,.bar.fire,.lhead .bar.fire>i{animation:none!important}.hot .rk-hawk{transform:scaleY(1.3)}}

/* keep today's goal and streak in view while the path is scrolled */
.topbar{flex-wrap:wrap;row-gap:0}
.goalchip{color:var(--ink);gap:4px}
.goalchip small{font-size:11px;font-weight:600;color:var(--ink-2);margin-left:1px}
.goalchip svg circle:last-child{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.tstrip{flex-basis:100%;display:flex;align-items:center;justify-content:center;gap:6px;max-height:0;overflow:hidden;opacity:0;margin:0 -4px;padding:0 10px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;text-align:center;transition:max-height .25s ease,opacity .2s ease,margin .25s ease,padding .25s ease}
.tstrip .ic{transform:rotate(180deg);flex:none;color:var(--punk)}
.tstrip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.today-off .tstrip{max-height:44px;opacity:1;margin:8px -4px 0;padding:9px 12px}
@media (min-width:1000px){.tstrip{display:none}}
/* New question formats: source excerpts, small data charts, sort into groups, explain-then-compare */
.qsrc{margin:0 0 14px;padding:12px 16px;border-left:4px solid var(--punk);background:var(--surface-2);border-radius:0 12px 12px 0}
.qsrc blockquote{margin:0;font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:1.5;color:var(--ink)}
.qsrc figcaption{margin-top:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.qdata{margin:0 0 14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.qdata>figcaption{font-weight:800;font-size:14px;margin-bottom:8px;color:var(--ink)}
.qbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;margin:5px 0;font-size:14px;font-weight:600}
.qbar .ql{color:var(--ink);overflow-wrap:anywhere}
.qbar .qt{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.qbar .qt i{display:block;height:100%;background:var(--ink-2);border-radius:6px}
.qbar b{font-size:13px;color:var(--ink)}
.qnote{margin:8px 0 0;font-size:12px;color:var(--ink-2);font-weight:600}
.sortlist{display:grid;gap:10px}
.sortrow{display:grid;gap:8px;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
.sortrow.right{border-color:var(--green)}
.sortrow.wrong{border-color:var(--red)}
.sortrow .sitem{font-weight:700;color:var(--ink)}
.sortrow .sitem small{display:block;margin-top:2px;color:var(--red);font-weight:800;font-size:13px}
.sortrow .sitem small::before{content:'Belongs in: '}
.sbtns{display:flex;flex-wrap:wrap;gap:6px}
.sbtns .chipb{padding:6px 10px;font-size:14px;border-radius:10px}
.sbtns .chipb[disabled]{opacity:.7}
.sortgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}
.sortgroups>div{border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.sortgroups b{font-size:14px}
.sortgroups ul{margin:6px 0 0;padding-left:18px;font-size:14px;font-weight:600}
.selfcard{margin-top:14px;padding:12px 14px;border:1.5px solid var(--ink);border-radius:14px;background:var(--punk-soft);color:var(--ink)}
.selfcard p{margin:4px 0 10px;font-weight:600;line-height:1.45}
.selfcard ul{margin:4px 0 0;padding-left:20px;font-weight:600}
.selfrate{display:flex;gap:10px;flex-wrap:wrap}
/* ===== Vinyl refresh (Nov 2026): warm gradient sky, soft cards, gradient pills, glossy 3D nodes. Loaded last. ===== */
:root{
 --bg:#FFF4EE; --surface:#FFFFFF; --surface-2:#F7EEF2; --line:#F0E4EA; --line-2:#DCCBD5; --track:#F3E5EC; --ink:#1E1633; --ink-2:#6A607D;
 --punk:#F0307F; --punk-d:#C2185F; --punk-2:#FF7A59; --punk-soft:#FFE3EF;
 --green:#16B364; --green-d:#0A8A49; --red:#F04462; --red-d:#C02443;
 --ok-bg:#E8F8EF; --ok-ink:#0B6B3A; --bad-bg:#FFECEF; --bad-ink:#B3193A;
 --sky:linear-gradient(180deg,#FFEDE3 0%,#FDF0F2 38%,#F3ECFC 100%);
 --frost:rgba(255,255,255,.72); --frost-line:rgba(255,255,255,.9);
 --soft:0 1px 2px rgba(60,20,70,.05),0 10px 30px -8px rgba(90,40,110,.16);
 --soft-lg:0 2px 4px rgba(60,20,70,.05),0 22px 44px -14px rgba(90,40,110,.24);
 --hill1:#FBD9C9; --hill2:#F6C9D7; --hill3:#E7D8F7; --treeA:#7FCB8E; --treeB:#4FA86A; --trunk:#B07B55; --dome:#FFFFFF; --domeS:#E6DDF0;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#1B1230; --surface:#2A1F3E; --surface-2:#342848; --line:#3E3154; --line-2:#56476F; --track:#3A2D50; --ink:#F7F1FF; --ink-2:#B6A9CB;
 --punk:#FF5A9E; --punk-d:#D0306F; --punk-2:#FF8F6B; --punk-soft:#4A2443;
 --ok-bg:#163828; --ok-ink:#8BEAB4; --bad-bg:#45182A; --bad-ink:#FFA3B6;
 --sky:linear-gradient(180deg,#2E1A3C 0%,#1F1433 45%,#130C24 100%);
 --frost:rgba(42,31,62,.72); --frost-line:rgba(255,255,255,.08);
 --soft:0 1px 2px rgba(0,0,0,.3),0 12px 30px -10px rgba(0,0,0,.55);
 --soft-lg:0 2px 4px rgba(0,0,0,.3),0 22px 44px -14px rgba(0,0,0,.6);
 --hill1:#3A2550; --hill2:#33204A; --hill3:#2A1C42; --treeA:#3E8A5E; --treeB:#2B6B47; --trunk:#6E4C3A; --dome:#D9D0EA; --domeS:#9C8FB8}}
:root[data-theme="dark"]{
 --bg:#1B1230; --surface:#2A1F3E; --surface-2:#342848; --line:#3E3154; --line-2:#56476F; --track:#3A2D50; --ink:#F7F1FF; --ink-2:#B6A9CB;
 --punk:#FF5A9E; --punk-d:#D0306F; --punk-2:#FF8F6B; --punk-soft:#4A2443;
 --ok-bg:#163828; --ok-ink:#8BEAB4; --bad-bg:#45182A; --bad-ink:#FFA3B6;
 --sky:linear-gradient(180deg,#2E1A3C 0%,#1F1433 45%,#130C24 100%);
 --frost:rgba(42,31,62,.72); --frost-line:rgba(255,255,255,.08);
 --soft:0 1px 2px rgba(0,0,0,.3),0 12px 30px -10px rgba(0,0,0,.55);
 --soft-lg:0 2px 4px rgba(0,0,0,.3),0 22px 44px -14px rgba(0,0,0,.6);
 --hill1:#3A2550; --hill2:#33204A; --hill3:#2A1C42; --treeA:#3E8A5E; --treeB:#2B6B47; --trunk:#6E4C3A; --dome:#D9D0EA; --domeS:#9C8FB8}

html{background:var(--bg)}
body{background:var(--sky) fixed;background-color:var(--bg);min-height:100vh}
#overlay{background:var(--sky);background-color:var(--bg)}

/* ---------- buttons: gradient pills ---------- */
.btn{--c:var(--punk);--cd:var(--punk-d);--c2:var(--punk-2);background:linear-gradient(135deg,var(--c2),var(--c) 70%);color:#fff;border-radius:999px;min-height:54px;padding:0 26px;border:0;
 box-shadow:0 10px 22px -8px color-mix(in srgb,var(--c) 75%,transparent),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .18s cubic-bezier(.3,1.7,.5,1),box-shadow .18s,filter .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px -8px color-mix(in srgb,var(--c) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:scale(.96);box-shadow:0 4px 10px -4px color-mix(in srgb,var(--c) 70%,transparent)}
.btn.green{--c:var(--green);--cd:var(--green-d);--c2:#4FD68C}
.btn.red{--c:var(--red);--cd:var(--red-d);--c2:#FF7E7E}
.btn.gold{--c:#F59E0B;--cd:#C27803;--c2:#FFC95C}
.btn.punk{--c:var(--punk);--c2:var(--punk-2)}
.btn.ghost{background:var(--surface);color:var(--ink);border:0;box-shadow:var(--soft)}
.btn.ghost:hover{box-shadow:var(--soft-lg)}
.btn[disabled]{background:var(--surface-2);color:var(--ink-2);box-shadow:none;transform:none}
.btn.sm{min-height:40px;padding:0 16px}

/* ---------- cards ---------- */
.card,.sec-head,.statbox,.week,.deeper,.recap,.mapsec,.repc,.practice-card,.ach,.quest,.shopitem,.setrow,.tile,.modal{border:0!important;border-radius:26px;box-shadow:var(--soft);background:var(--surface)}
.modal{border-radius:30px;box-shadow:var(--soft-lg)}

/* ---------- top bar + tabs: frosted ---------- */
.topbar{background:var(--frost);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--frost-line)}
.chip-level{border-radius:999px;border:0;background:var(--surface);box-shadow:var(--soft)}
.stat{border-radius:999px}
.tabs{background:var(--frost);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border-top:1px solid var(--frost-line);box-shadow:0 -10px 30px -16px rgba(90,40,110,.25)}
.tab{border-radius:20px;padding:7px 4px 6px;transition:background .2s,color .2s,transform .18s cubic-bezier(.3,1.7,.5,1)}
.tab.on{background:linear-gradient(135deg,var(--punk-2),var(--punk));color:#fff;box-shadow:0 8px 16px -8px color-mix(in srgb,var(--punk) 80%,transparent)}
.tab.on .ic{color:#fff;background:transparent}
.tab .ic{padding:2px 8px}
.tab:active{transform:scale(.94)}
.side .tab.on{background:linear-gradient(135deg,var(--punk-2),var(--punk))}
.tstrip{background:var(--punk-soft);color:var(--punk-d);border-radius:999px;font-weight:700}
:root[data-theme="dark"] .tstrip{color:#FFC2DA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tstrip{color:#FFC2DA}}

/* ---------- Today card: big mascot, up next ---------- */
.today{position:relative;border:0;border-radius:30px;background:var(--surface);box-shadow:var(--soft-lg);padding:18px 18px 18px;overflow:hidden;gap:12px}
.today::before{content:"";position:absolute;right:-60px;top:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--punk-2) 30%,transparent),transparent 70%);pointer-events:none}
.today .tday{position:relative;display:grid;grid-template-columns:1fr auto;align-items:end;gap:6px}
.today .tday .tm{position:relative;margin:-6px -8px -14px 0}
.today .eyebrow{color:var(--punk);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:0}
.today h2.ttl{font-family:var(--display);font-size:27px;line-height:1.05;margin:6px 0 6px;letter-spacing:-.03em}
.today .tsub{color:var(--ink-2);font-size:15px;line-height:1.4;margin:0;font-weight:500}
.today .todaygo{justify-content:center;text-align:center;background:linear-gradient(135deg,var(--punk-2),var(--punk) 70%);color:#fff;border-radius:999px;min-height:56px;font-size:17px;box-shadow:0 12px 24px -10px color-mix(in srgb,var(--punk) 85%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.today .todaygo:active{transform:scale(.97);box-shadow:0 4px 10px -4px color-mix(in srgb,var(--punk) 70%,transparent)}
.today .tgoal{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--ink-2)}
.today .tgoal .gbar{flex:1;height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.today .tgoal .gbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--punk-2),var(--punk))}
.today .tgoal b{color:var(--ink)}

/* ---------- path: scenery, road, glossy nodes ---------- */
.path{isolation:isolate}
.cq-road{position:absolute;left:0;top:0;z-index:-1;pointer-events:none;overflow:visible}
.cq-road-bed{fill:none;stroke:color-mix(in srgb,var(--surface) 70%,transparent);stroke-width:30;stroke-linecap:round}
.cq-road-dash{fill:none;stroke:color-mix(in srgb,var(--punk) 35%,var(--line-2));stroke-width:4;stroke-linecap:round;stroke-dasharray:1 14}
.node{--c:var(--punk);--cd:var(--punk-d);width:78px;height:74px;border-radius:50%;
 background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.75) 0 7%,rgba(255,255,255,.18) 24%,transparent 46%),radial-gradient(circle at 50% 60%,var(--punk-2),var(--punk) 55%,var(--punk-d) 100%);
 box-shadow:0 7px 0 color-mix(in srgb,var(--punk-d) 85%,#000),0 18px 26px -10px color-mix(in srgb,var(--punk-d) 70%,transparent);color:#fff}
.node.done{background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.75) 0 7%,rgba(255,255,255,.18) 24%,transparent 46%),radial-gradient(circle at 50% 60%,#8E7CF6,#6A4FE0 55%,#4A33B8);color:#fff;box-shadow:0 7px 0 #3A2794,0 18px 26px -10px rgba(74,51,184,.6)}
.node.test.done,.node.cp.done{background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.8) 0 7%,rgba(255,255,255,.2) 24%,transparent 46%),radial-gradient(circle at 50% 60%,#FFD56A,#FFB320 55%,#E08A00);color:#5A3A00;clip-path:none;border-radius:50%;box-shadow:0 7px 0 #B86E00,0 18px 26px -10px rgba(224,138,0,.6)}

/* ===== Capitol Quest course content =====
   Question helpers:
   M(prompt, answer, [wrong...], why)   multiple choice
   TF(statement, true|false, why)       true / false
   F("... ___ ...", answer, [wrong...], why)  fill in the blank (word bank)
   O(prompt, [steps in correct order], why)   put in order
   P(prompt, [[left,right],...], why)         match pairs
   T(prompt, [accepted answers], why)         type the answer
   SORT(prompt, [groups], [[item, group#],...]) sort into groups
   EXPLAIN(prompt, model answer, [key points]) write, then self-check against a model
   withSource(q, excerpt, cite) / withData(q, title, rows) add a source or a small chart to any question
*/
function M(p,a,w,ex){return {t:'mc',p,a,o:[a].concat(w),ex}}
function TF(p,v,ex){return {t:'tf',p,a:v?'True':'False',o:['True','False'],ex}}
function F(p,a,w,ex){return {t:'fill',p,a,o:[a].concat(w),ex}}
function O(p,steps,ex){return {t:'order',p,a:steps,ex}}
function P(p,pairs,ex){return {t:'match',p,pairs,ex}}
function T(p,acc,ex){return {t:'type',p,acc,a:acc[0],ex}}
function V(p,what,pro,con,result){return {t:'vote',p,what,pro,con,result,a:''}}   // how would you vote? (not graded)
function D(p,what,pro,con,result){return Object.assign(V(p,what,pro,con,result),{debate:true})}   // both-sides debate (not graded)
function SORT(p,buckets,items,ex){return {t:'sort',p,b:buckets,items,a:'',ex}}   // sort into groups: items are [text, group index]
function EXPLAIN(p,model,keys){return {t:'self',p,model,keys,a:model}}   // write an answer, then compare to a model answer (self-graded)
function withSource(q,text,cite){q.src={text,cite};return q}   // show a short primary-source excerpt above the question
function withData(q,title,rows,note){q.data={title,rows,note};return q}   // show a small bar chart: rows are [label, number, shown text]

],

{id:'u25',s:0,title:'Forms of Government',desc:'Democracy, monarchy, communism, socialism, fascism, and how the U.S. compares',

{id:'u9',s:1,title:'Federalism',desc:'National power, state power, and the line between them',
