'w2-6':'Washington\'s governor has a **section veto**: they **can veto individual sections of bills**, not just the whole bill.',
'w2-7':'To qualify an initiative for the ballot, sponsors need signatures equal to **8% of the votes cast for governor in the last election**.',
'w2-8':'An **initiative to the Legislature** **goes to lawmakers first**. If they don\'t pass it, it goes to the ballot.',
'w2-9':'Washington has **no state income tax** on wages, so it relies heavily on **sales and property taxes**. That makes its tax system one of the most regressive in the country.',
/* w3 Running for Local Office */
'w3-0':'Washington candidates officially file to run during **filing week in May**. Then comes the August primary and November general.',
'w3-1':'The filing fee for a paid office is generally **1% of the office\'s annual salary**.',
'w3-2':'Can\'t afford the fee? You can **submit signatures instead**. Money shouldn\'t block you from the ballot.',
'w3-3':'Washington state and local candidates report money raised and spent to the **Public Disclosure Commission (PDC)**. (Federal races report to the FEC.)',
'w3-4':'Every campaign starts with its **win number**: **the number of votes needed to win**.',
'w3-5':'Math time: in a two-candidate race with about **40,000** voters, you need a majority. Half is 20,000, so the rough win number is **20,001**. (Real campaigns add a safety cushion.)',
'w3-6':'Going door to door to talk with voters is **canvassing**. It\'s still the most effective way to win votes.',
'w3-7':'Campaigns use the **voter file** to **see who\'s registered and how often they vote, so they can target outreach**. Ballots stay secret; the file never shows who you voted for.',
'w3-8':'A common first step toward local office: **serving on a city board, commission, or neighborhood group**. You build experience and a network.',
'w3-9':'In Washington, **Precinct Committee Officers (PCOs)** are **elected neighborhood-level party representatives**. It\'s the most grassroots elected position there is.',
/* w4 Organizing & Running Meetings */
'w4-0':'Under **Robert\'s Rules**, someone makes a motion ("I move that..."), then **another member seconds it** before debate begins. No second, no debate.',
'w4-1':'A **quorum** is **the minimum number of members needed to do official business**. Without one, no binding votes.',
'w4-2':'The official record of what a meeting decided is the **minutes**. Good minutes list motions and results, not every word said.',
'w4-3':'The rules that govern how an organization runs itself are its **bylaws**. Read your chapter\'s bylaws before you run for anything.',
'w4-4':'In organizing, a **one-on-one** is **a conversation to build a relationship and learn what someone cares about**. Listen far more than you talk.',
'w4-5':'**Power mapping** helps a campaign figure out **who has the power to decide an issue and who influences them**.',
'w4-6':'A campaign\'s **target** is **a specific person with the power to grant the demand**: a named councilmember, not "the city."',
'w4-7':'Changed your mind? Robert\'s Rules lets members move to **rescind or amend something previously adopted** at an earlier meeting.',
'w4-8':'Moving the **"previous question"** **ends debate** and goes straight to a vote. It usually **needs a two-thirds vote**, since it cuts off discussion.',
'w4-9':'**DSA\'s National Political Committee** is elected at **the national convention, held every two years** by delegates from the chapters.',
/* l1 Laws in the News */
'l1-0':'The **CHIPS and Science Act (2022)** aimed to **boost U.S. computer-chip manufacturing and research**, with about $52 billion for chips.',
'l1-1':'The **Inflation Reduction Act (2022)** (climate, health care, taxes) dodged a Senate filibuster by using **budget reconciliation**.',
'l1-2':'After January 6, Congress passed the **Electoral Count Reform Act (2022)**, which made clear **the Vice President only has a ceremonial role** in counting electoral votes.',
'l1-3':'The same law raised the bar for objecting to a state\'s electoral votes: it now needs **one-fifth of each chamber**, up from one member of each.',
'l1-4':'The **Respect for Marriage Act (2022)** requires **recognition of valid same-sex and interracial marriages performed in other states**.',
'l1-5':'The **Infrastructure Investment and Jobs Act (2021)** paid for **roads, bridges, broadband, water systems, and transit**.',
'l1-6':'The **Laken Riley Act** (January 2025), about detaining certain immigrants, was **the first bill Trump signed in his second term**.',
'l1-7':'The **TAKE IT DOWN Act (2025)** targets **nonconsensual intimate images, including AI deepfakes**, and requires platforms to remove them quickly.',
'l1-8':'The **GENIUS Act (2025)** created the first federal rules for **stablecoins**, a kind of cryptocurrency pegged to the dollar.',
'l1-9':'The **One Big Beautiful Bill Act**, signed July 4, 2025, passed the Senate with a simple majority because it used **budget reconciliation**. Notice a pattern?',

'l1-11':'Recent big laws on a timeline (2020, 2021, 2022, 2025):',
/* l2 Bills & Amendments to Watch */
'l2-0':'**One Congress lasts 2 years**, matching the House election cycle.',
'l2-1':'The **119th Congress** runs from **2025 to 2027**.',
'l2-2':'When a Congress ends, unpassed bills die. **They have to be reintroduced in the next Congress** and start over.',
'l2-3':'To track any federal bill, use **Congress.gov**, the official site. You can see text, sponsors, and votes.',
'l2-4':'**Virginia** ratified the **Equal Rights Amendment** in 2020 as the 38th state. It\'s still not in the Constitution because **the deadline Congress set had passed and the Archivist hasn\'t certified it**.',
'l2-5':'The **National Popular Vote Interstate Compact** would give a state\'s electors to the national vote winner. It **takes effect when states with at least 270 electoral votes join**.',
'l2-6':'Want to cap how long members of Congress serve? That would take **a congressional term limits amendment**. The 22nd Amendment only limits Presidents.',
'l2-7':'The filibuster isn\'t in the Constitution, so **ending it would only require changing Senate rules**, not amending the Constitution.',
'l2-8':'A **Balanced Budget Amendment** would require **the federal government not to spend more than it takes in**, with some exceptions like war.',

function chunkSize(u){return Math.ceil(u.q.length/u.L)}
function graded(qs){return qs.filter(q=>q.t!=='vote')}
function taughtQs(u){const p=pr(u);if(p.t||p.d>=u.L)return graded(u.q);return graded(u.q.slice(0,Math.min(u.q.length,p.d*chunkSize(u))))}
function lessonQs(u,k,teach){const size=chunkSize(u);const all=u.q.slice(k*size,(k+1)*size);const votes=all.filter(q=>q.t==='vote');const chunk=graded(all);const earlier=graded(u.q.slice(0,k*size));const rev=shuffle(earlier).slice(0,k?3:0);
 if(!teach)return shuffle(chunk).concat(votes,shuffle(rev));
 let out=[];for(let i=0;i<chunk.length;i+=2){const g=chunk.slice(i,i+2);g.forEach((q,j)=>out.push({t:'teach',q,n:i+j+1,of:chunk.length}));out=out.concat(shuffle(g))}
 return out.concat(votes,shuffle(rev))}
function newInfo(ex,t){const w=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/ +/).filter(x=>x.length>3);const T=new Set(w(t));const e=w(ex);return e.filter(x=>!T.has(x)).length/Math.max(1,e.length)>.5}

 return h}

function startSession(o){closeModal();
 S=Object.assign({queue:[],idx:0,base:0,done:0,correct:0,wrong:0,combo:0,maxCombo:0,start:Date.now(),checked:false,learn:null,v:null},o);
 const k=o.kind;
 if(k==='lesson'){S.queue=lessonQs(o.u,o.k,!o.replay);if(!o.replay)S.learn=o.u.tips[o.k]}
 else if(k==='test')S.queue=shuffle(graded(o.u.q)).slice(0,10);
 else if(k==='cp'){const us=UNITS.filter(u=>u.s===o.s);const per=Math.max(2,Math.ceil(16/us.length));let qs=[];us.forEach(u=>{qs=qs.concat(shuffle(graded(u.q)).slice(0,per))});S.queue=shuffle(qs).slice(0,16)}
 else if(k==='review'){let pool=[];UNITS.forEach(u=>{pool=pool.concat(taughtQs(u))});S.queue=shuffle(pool).slice(0,10)}
 else if(k==='weak'){S.queue=shuffle(weakDue().map(id=>QMAP[id])).slice(0,12);S.missed={}}
 else if(k==='lightning'){let pool=[];UNITS.forEach(u=>{pool=pool.concat(taughtQs(u).filter(q=>q.t==='mc'||q.t==='tf'||q.t==='fill'))});S.pool=pool;S.queue=shuffle(pool);S.endAt=Date.now()+60000;S.learn=null}
 if(!S.queue.length){S=null;toast('Finish a lesson first. I only quiz you on what I\'ve taught you.');return}

function newView(){const q=S.queue[S.idx];if(!q){S.v=null;return}const v={sel:null};if(q.t==='teach'){S.v=v;S.checked=false;S.result=null;S.fresh=true;return}
 if(q.t==='vote'){const pv=st.votes[q.id]||{};v.vote=pv.v||null;v.why=pv.why||'';S.v=v;S.checked=false;S.fresh=true;return}

 if(q.t==='tf')v.opts=q.o.slice();
 if(q.t==='order'){let b=shuffle(q.a.map((s,i)=>i));if(b.every((x,i)=>x===i))b=b.reverse();v.bank=b;v.picked=[]}
 if(q.t==='match'){v.L=shuffle(q.pairs.map((p,i)=>i));v.R=shuffle(q.pairs.map((p,i)=>i));v.sl=null;v.sr=null;v.okL=[];v.okR=[];v.miss=false;v.bad=null}

 'ooh-practice':()=>{closeSession();startSession({kind:'review'})},
 'ooh-end':()=>closeSession(),
 'res-next':()=>{R.i++;if(R.i>=R.screens.length){const d=R.d;closeSession();scrollPending=true;if(tab!=='learn'&&(d.k==='lesson'||d.k==='test'||d.k==='cp'))setTab('learn');else render()}else renderResult()},
 'res-guide':()=>{const d=R.d;const u=d.unitId?UNITS.find(x=>x.id===d.unitId):UNITS.find(x=>x.s===d.s);closeSession();if(u)guideModal(u)},
 set:el=>{const k=el.dataset.k;st[k]=!st[k];save();if(k==='sound'&&st.sound)sfx('ok');render()},
 reset:()=>modal(ruckus('wow',100)+'<h2>Reset everything?</h2><p class="muted" style="font-weight:700">This deletes your streak, XP, and all lesson progress on this device. It can\'t be undone.</p><div class="row"><button class="btn red wide" data-a="reset-yes">Yes, reset</button><button class="btn ghost wide" data-a="close">Cancel</button></div>'),
 'reset-yes':()=>{st=fresh();save();closeModal();buildNodes();onboarding()},
 prac:el=>{const k=el.dataset.k;closeModal();if(k==='reps'){setTab('reps');return}if(k==='local'){setTab('learn');setTimeout(()=>{const s=$('#sec4');if(s)s.scrollIntoView({behavior:'smooth'})},80);return}
 if(k==='livedesk'){setTab('learn');setTimeout(()=>{const s=$('#sec5');if(s)s.scrollIntoView({behavior:'smooth'})},80);return}startSession({kind:k})},
 'ob-next':()=>{if(OB.step===1){const n=$('#obName');OB.name=n?n.value:''}OB.step++;sfx('tap');renderOB()},
 'ob-goal':el=>{OB.goal=+el.dataset.g;sfx('tap');renderOB()},
 'ob-start':el=>finishOB(el.dataset.m)
};
function startNode(i){const n=NODES[i];const s=nodeState(i);if(s==='lock')return;
 if(n.type==='lesson'){if(!st.unlimited&&st.hearts<=0){heartsModal();return}startSession({kind:'lesson',u:n.u,k:n.k,replay:s==='done'})}
 else if(n.type==='test')startSession({kind:'test',u:n.u,replay:s==='done'});
 else startSession({kind:'cp',s:n.s,replay:s==='done'})}
function matchTap(side,i){if(S.checked)return;const v=S.v,q=S.queue[S.idx];v.bad=null;
 if(side==='L'){if(v.okL.includes(i))return;v.sl=v.sl===i?null:i}else{if(v.okR.includes(i))return;v.sr=v.sr===i?null:i}
 sfx('tap');
 if(v.sl!=null&&v.sr!=null){if(q.pairs[v.sl][1]===q.pairs[v.sr][1]){v.okL.push(v.sl);v.okR.push(v.sr);v.sl=v.sr=null;tone(880,0,.08,'triangle',.1);
   if(v.okL.length===q.pairs.length){renderSession();setTimeout(()=>{if(S&&S.v===v)grade(!v.miss)},250);return}}
  else{v.miss=true;v.bad='R'+v.sr;const L=v.sl,Rr=v.sr;sfx('bad');renderSession();setTimeout(()=>{if(S&&S.v===v&&v.sl===L&&v.sr===Rr){v.sl=v.sr=null;v.bad=null;renderSession()}},450);return}}
 renderSession()}
function setTab(t){if(!VIEWS[t])t='learn';tab=t;enterAnim=true;openNode=-1;window.scrollTo(0,0);if(t==='learn')scrollPending=true;render()}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){f(el,e)}});
document.addEventListener('input',e=>{const el=e.target;const k=el.dataset&&el.dataset.in;if(!k)return;
 if(k==='type'&&S){S.v.text=el.value;const b=document.querySelector('[data-a="check"]');if(b)b.disabled=!canCheck(S.queue[S.idx],S.v)}
 if(k==='name'){st.name=el.value.slice(0,24);save()}
 if(k==='why'&&S&&S.v){S.v.why=el.value;const b=document.querySelector('[data-a="vsave"]');if(b)b.disabled=!(S.v.vote&&S.v.why.trim().length>=10)}
 if(k==='obname'&&OB)OB.name=el.value});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.rep){st.reps[el.dataset.rep]=el.value;save();render();return}if(el.dataset&&el.dataset.in==='goal'){st.goal=+el.value;save();render()}});
document.addEventListener('keydown',e=>{
 if($('#modal').children.length){if(e.key==='Escape')closeModal();return}
 if(OB){if(e.key==='Enter'){const b=document.querySelector('[data-a="ob-next"]');if(b){e.preventDefault();b.click()}}return}
 if(R){if(e.key==='Enter'){e.preventDefault();A['res-next']()}return}
 if(!S)return;
 if(e.key==='Escape'){A.quit();return}
 if(S.learn){if(e.key==='Enter'){e.preventDefault();A['learn-go']()}return}
 const q=S.queue[S.idx];
 if(q&&q.t==='teach'){if(e.key==='Enter'||e.key===' '){e.preventDefault();A.taught()}return}
 if(q&&q.t==='vote')return;
 if(e.key==='Enter'){if(q.t==='type'&&!e.shiftKey)e.preventDefault();if(S.checked)A.cont();else if(canCheck(q,S.v))check();return}
 if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
 const n=parseInt(e.key,10);if(n>=1&&n<=9){if((q.t==='mc'||q.t==='tf'||q.t==='fill')&&S.v.opts[n-1]!=null){if(S.kind==='lightning'){lightAnswer(n-1);return}if(!S.checked){S.v.sel=S.v.opts[n-1];sfx('tap');renderSession()}}}});
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(VIEWS[t]&&t!==tab)setTab(t)});
setInterval(()=>{if(S||OB||R)return;const a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='SELECT'))return;ensureDaily();renderChrome()},30000);

/* ---------- 3D tilt on hover ---------- */
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||reduceMotion())return;const el=e.target.closest('.tilt');document.querySelectorAll('.tilt[data-tilted]').forEach(o=>{if(o!==el){o.style.transform='';delete o.dataset.tilted}});if(!el)return;const r=el.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform='perspective(700px) rotateX('+(-y*9).toFixed(2)+'deg) rotateY('+(x*11).toFixed(2)+'deg) translateY(-3px)';el.dataset.tilted='1'});

/* ---------- boot ---------- */
load();buildNodes();ensureDaily();checkStreak();heartsTick();newAchievements();save();
const h0=location.hash.slice(1);if(VIEWS[h0])tab=h0;
render();
if(!st.onboarded)onboarding();else showNotices();
})();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){})</script>
</body></html>
