 P('Match the system to its description.',[['Federal','Power shared between national and state levels'],['Unitary','Central government holds most power'],['Confederation','States hold most power; weak center']]),
 M('Which is an enumerated (delegated) power of the federal government?','Coining money',['Issuing driver\'s licenses','Running public schools','Setting the marriage age']),
 M('Which power is reserved to the states?','Running elections and setting up local governments',['Declaring war and raising an army or navy','Making treaties and alliances with other countries','Coining money and setting its value']),
 M('Powers shared by national and state governments are called...','Concurrent powers',['Reserved powers','Implied powers','Enumerated powers']),
 P('Sort these powers.',[['Declare war','Federal'],['Create school districts','State'],['Collect taxes','Both (concurrent)']]),
 M('The Supremacy Clause makes which the "supreme Law of the Land"?','The Constitution, federal laws made under it, and treaties',['Only the Constitution itself, not ordinary laws','Federal and state laws, which rank equally','Supreme Court rulings and presidential executive orders']),
 TF('When a valid federal law conflicts with a state law, the federal law wins.',true),
 M('The Necessary and Proper Clause is also called the...','Elastic Clause',['Commerce Clause','Due Process Clause','Full Faith and Credit Clause']),
 M('McCulloch v. Maryland (1819) decided that...','Congress could create a national bank and states couldn\'t tax it',['Congress could not create a bank, since it isn\'t a listed power','States could tax federal offices inside their borders','Congress could regulate all trade, even inside one state']),
 M('"Marble cake" federalism, where levels of government work together on programs, is...','Cooperative federalism',['Dual (layer cake) federalism','Unitary government','Nullification']),
 M('A federal grant with strict rules on how the money must be spent is a...','Categorical grant',['Block grant','Tax rebate','Unfunded mandate']),
 M('The federal government requires states to do something but provides no money. That\'s an...','Unfunded mandate',['Block grant','Earmark','Enumerated power']),
 M('U.S. v. Lopez (1995) mattered because it...','Limited Congress\'s use of the Commerce Clause',['Expanded Congress\'s power to regulate any economic activity','Allowed states to ignore federal gun laws','Gave the President power over school safety'],'The Court struck down the Gun-Free School Zones Act: carrying a gun near a school wasn\'t economic activity.')
]},

{id:'u10',s:1,title:'The House Up Close',desc:'Leaders, special powers, committees, and districts',
tips:[
 ['House leadership',['The **Speaker** is elected by the full House, controls the floor, and is 2nd in line to the presidency.','The **Majority Leader** schedules floor business; the **Minority Leader** leads the other party.','**Whips** count votes and keep members in line.']],
 ['Powers only the House has',['**Revenue bills** must start in the House.','The House **impeaches** (formally charges) officials by **simple majority**.','If no one wins 270 electoral votes, the House picks the President, **one vote per state delegation**.']],
 ['Committees and rules',['**Ways and Means** writes tax law; **Appropriations** controls spending.','The **Rules Committee** issues a "rule": **closed** (no amendments), **open**, or **structured**.','A **discharge petition** with **218** signatures forces a bill out of committee.']],
 ['Districts',['After each census, the 435 seats are **reapportioned** among the states.','States draw district lines (**redistricting**). **Gerrymandering** draws them to favor a party or group.','Districts must have roughly equal population: **one person, one vote**.']]
],
q:[
 M('How is the Speaker of the House chosen?','Elected by the members of the House',['Appointed by the President','Chosen by voters nationwide','Automatically the longest-serving member']),
 TF('The Constitution requires the Speaker to be a member of the House.',false,'It doesn\'t, but every Speaker so far has been a member.'),
 M('Which party leader counts votes and makes sure members show up?','The whip',['The Speaker','The President pro tempore','The Parliamentarian']),
 M('Which House committee writes tax laws?','Ways and Means',['Rules','Armed Services','Oversight']),
 M('Which committee in each chamber decides how federal money is spent?','Appropriations',['Ways and Means','Rules','Finance']),
 M('A "closed rule" from the Rules Committee means...','No amendments can be offered on the floor',['Only committee members may speak','Debate is held in a closed session, with no public gallery','The bill bypasses committee review']),
 F('A discharge petition needs ___ signatures to force a bill out of committee.','218',['100','60','290'],'218 is a majority of the 435-member House.'),
 M('In impeachment, the House\'s role is to...','Bring charges (impeach) by majority vote',['Hold the trial and decide guilt','Remove the official by a 2/3 vote','Choose the punishment']),
 M('If no candidate gets 270 electoral votes, how does the House vote for President?','Each state delegation casts one vote',['Each member of the House gets one vote','The House votes by party, with each party casting one vote','Each state delegation casts votes equal to its electors']),
 M('Dividing the 435 House seats among the states after the census is called...','Reapportionment',['Gerrymandering','Filibustering','Impoundment']),
 M('Drawing district lines to give one party an unfair advantage is called...','Gerrymandering',['Logrolling','Pork barrel spending','Reconciliation']),
 P('Match the gerrymandering tactic.',[['Packing','Crowding opponents into a few districts'],['Cracking','Splitting opponents across many districts']]),
 M('Which principle requires districts to have roughly equal populations?','One person, one vote',['Majority rule','Separate but equal','The rule of four, applied to districts'],'From Baker v. Carr (1962) and Wesberry v. Sanders and Reynolds v. Sims (1964).'),
 T('How many voting members are in the House? (Type a number.)',['435'])
]},

{id:'u11',s:1,title:'The Senate Up Close',desc:'Leaders, advice and consent, and the filibuster',
tips:[
 ['Senate leadership',['The **Vice President** is President of the Senate but votes only to break ties.','The **President pro tempore**, usually the longest-serving majority senator, is 3rd in line to the presidency.','The **Majority Leader** holds the real power: they control what reaches the floor.']],
 ['Powers only the Senate has',['**Advice and consent**: confirms judges, Cabinet members, and ambassadors by **simple majority**.','Approves **treaties** by **2/3** of senators present.','Holds **impeachment trials**; conviction takes **2/3**. The Chief Justice presides when a President is tried.']],
 ['Filibuster and cloture',['Senate tradition allows **extended debate**. A **filibuster** uses it to delay or block a vote.','**Cloture** ends debate with **60 votes** on most bills.','Since 2013 and 2017, nominations need only a **simple majority** for cloture (the "nuclear option").']],
 ['How senators are chosen',['Originally, **state legislatures** picked senators.','The **17th Amendment (1913)** gave that choice to **voters**.','Senators represent whole states, so their voters are larger and more varied than a House district\'s.']]
],
q:[
 M('Who usually holds the title President pro tempore of the Senate?','The longest-serving senator of the majority party',['The Vice President of the United States','The Senate Majority Leader, who is elected by the majority party','The senator chosen by the minority party']),
 M('Who has the most control over which bills reach the Senate floor?','The Senate Majority Leader',['The Vice President','The President pro tempore','The Chief Justice']),
 M('"Advice and consent" is the Senate\'s power to...','Confirm appointments and approve treaties',['Start bills that raise taxes','Bring impeachment charges against officials','Approve the President\'s budget request']),
 M('Presidents often skip the Senate\'s two-thirds treaty vote by making...','Executive agreements with other countries',['Signing statements on foreign trade bills','Recess appointments of ambassadors','Pocket vetoes of foreign aid bills']),
 M('What does the Senate need to convict and remove an impeached official?','A two-thirds vote',['A simple majority','60 votes','A unanimous vote']),
 M('Who presides over the Senate trial when a President is impeached?','The Chief Justice of the United States',['The Vice President of the United States','The Speaker of the House','The Senate Majority Leader']),
 M('A filibuster is...','Using extended debate to delay or block a vote',['A vote to end debate and move to passage','A rule that limits floor debate to one hour','A motion to send a bill back to committee']),
 F('Cloture, which ends a filibuster on most bills, takes ___ votes.','60',['51','67','50']),
 M('The "nuclear option" changed Senate rules so that nominations need...','Only a simple majority to end debate',['A two-thirds vote to end debate, as with treaties','Approval by the House as well','Sixty votes, the same as bills']),
 M('Before the 17th Amendment (1913), who chose U.S. senators?','State legislatures',['Governors','The President','The House of Representatives']),
 TF('A single senator can place a "hold" to signal they object to taking up a bill or nomination.',true),
 M('A lot of Senate business moves by "unanimous consent." That means...','It goes forward unless any senator objects',['All 100 senators must vote yes in a roll call','The President must agree','The House passes it automatically']),
 P('Which chamber has this power?',[['Start revenue bills','House'],['Impeach officials','House'],['Hold impeachment trials','Senate'],['Approve treaties','Senate']]),
 TF('Confirming a Cabinet secretary takes a two-thirds Senate vote.',false,'A simple majority. Two-thirds is for treaties and impeachment convictions.')
]},

{id:'u12',s:1,title:'Checks & Balances in Action',desc:'Vetoes, judicial review, war powers, and real clashes',
tips:[
 ['How Congress checks the others',['**Override** vetoes with 2/3 of both chambers.','**Impeach** and remove officials. **Confirm** appointments and approve treaties.','Control the budget (**power of the purse**) and hold **oversight** hearings.']],
 ['How the President checks the others',['**Veto** bills.','**Nominate** judges and officials.','Issue **pardons**; set enforcement priorities.']],
 ['How the courts check the others',['**Judicial review**: strike down unconstitutional laws and executive actions.','Established in **Marbury v. Madison (1803)** by Chief Justice **John Marshall**.','The phrase "judicial review" isn\'t in the Constitution.']],
 ['Real clashes',['**War Powers Resolution (1973)**: the President must notify Congress within **48 hours** of sending troops into combat and withdraw within 60 days (plus 30) without approval.','**United States v. Nixon (1974)**: executive privilege isn\'t absolute.','Veto **overrides are rare** because 2/3 of both chambers is a high bar.']]
],
q:[
 P('Match each real clash to the check that was used.',[['Truman seizes steel mills (1952)','Court rules the seizure unconstitutional'],['Andrew Johnson (1868)','House impeaches the President'],['Robert Bork\'s nomination (1987)','Senate rejects a Supreme Court nominee'],['Watergate tapes (1974)','Court orders the President to turn over evidence']]),
 M('Which case established judicial review?','Marbury v. Madison (1803)',['McCulloch v. Maryland (1819)','Brown v. Board (1954)','Gibbons v. Ogden (1824)']),
 M('Why was John Marshall\'s ruling in Marbury v. Madison so clever?','He claimed the power of judicial review in a case that his political rivals won',['He forced President Jefferson to deliver Marbury\'s commission at once','He had Congress add judicial review to the Judiciary Act','He let the states decide whether the law was constitutional']),
 TF('The words "judicial review" appear in the Constitution.',false),
 M('Congress holds hearings to see how agencies carry out laws. That\'s called...','Oversight',['Judicial review','Executive privilege','Gerrymandering']),
 M('How can the President check the judicial branch?','By nominating judges',['By firing judges','By overruling Supreme Court decisions','By vetoing court rulings']),
 M('How can Congress check the judicial branch?','Confirming, impeaching, and removing judges, and proposing amendments',['Vetoing court decisions it strongly disagrees with, by majority vote','Cutting a sitting judge\'s salary as a punishment','Overturning constitutional rulings by a two-thirds vote'],'The Constitution says judges\' pay can\'t be cut while they serve.'),
 M('The War Powers Resolution (1973) requires the President to...','Notify Congress within 48 hours of sending troops into combat',['Get a formal declaration of war from Congress within 30 days','Win a majority vote in the Senate before acting','Notify the UN Security Council before any strike']),
 M('In United States v. Nixon (1974), the Court ruled that...','Executive privilege isn\'t absolute; Nixon had to hand over the tapes',['Presidents can\'t be subpoenaed while in office','Executive privilege protects every White House conversation from courts','Congress, not the courts, decides privilege disputes']),
 TF('Overriding a veto is easy and happens most of the time.',false,'It takes 2/3 of both chambers, so overrides are rare.'),
 M('Which is a check the courts have on the President?','Ruling that an executive action is unconstitutional',['Vetoing executive orders the courts disagree with','Removing Cabinet members who break the law','Refusing to swear in a newly elected President']),
 O('Put the steps of impeachment and removal in order.',['The House investigates','The House votes to impeach (majority)','The Senate holds a trial','The Senate votes to convict (2/3)']),
 M('Why did the Framers build in checks and balances?','To keep any branch from abusing power',['To speed up lawmaking','To give the President the final say','To keep states out of government']),
 M('Which check lets Congress defund a program the President likes?','The power of the purse',['Judicial review','The line-item veto','Executive privilege'])
]},

{id:'u13',s:1,title:'Amendments 11–27',desc:'Every amendment after the Bill of Rights, and the ones that failed',
tips:[
 ['The Reconstruction Amendments',['**13th (1865)**: abolished slavery.','**14th (1868)**: citizenship for all born here, **due process**, and **equal protection** from the states.','**15th (1870)**: no denying the vote based on race.']],
 ['The Progressive Era',['**16th (1913)**: federal income tax. **17th (1913)**: voters elect senators.','**18th (1919)**: Prohibition of alcohol.','**19th (1920)**: women\'s right to vote.']],
 ['The 20th century and beyond',['**20th**: Inauguration moved to **January 20**. **21st (1933)**: repealed Prohibition, the only amendment to repeal another.','**22nd**: two-term limit. **23rd**: D.C. gets electors. **24th**: no poll taxes. **25th**: succession and disability.','**26th (1971)**: voting age 18. **27th (1992)**: congressional pay raises wait until after an election. It was proposed in **1789**.']],
 ['Amendments that didn\'t make it',['Thousands of amendments have been proposed; Congress has sent only **33** to the states, and **27** were ratified.','The **Equal Rights Amendment** passed Congress in 1972 but missed its ratification deadline.','The **Archivist of the United States** certifies when an amendment is ratified.']]
],
q:[
 P('Match the amendment to what it did.',[['13th','Abolished slavery'],['14th','Equal protection of the laws'],['15th','No race test for voting'],['19th','Women\'s suffrage']]),
 M('The first sentence of the 14th Amendment makes nearly everyone born on U.S. soil...','A citizen of the United States and of their state',['A citizen only once a parent naturalizes','A citizen of their state, but not of the nation','Eligible for citizenship after five years of residence']),
 M('The 14th Amendment\'s Equal Protection Clause says states can\'t...','Deny any person equal protection of the laws',['Give any group special voting rights','Leave the Union without Congress\'s approval','Tax people differently based on income']),
 M('Which amendment allowed a federal income tax?','16th',['17th','18th','21st']),
 M('Which is the only amendment that repealed another amendment?','21st (it ended Prohibition)',['18th (it began Prohibition)','27th (it limited pay raises)','13th (it ended slavery)']),
 M('The 18th Amendment (1919) banned...','Making and selling alcohol',['Selling but not making alcohol','Owning enslaved people','Charging poll taxes in elections']),
 M('The 20th Amendment moved Inauguration Day from March to January. What problem did that fix?','A long "lame duck" period when defeated officials still held power',['Bad winter weather on Inauguration Day in Washington, D.C., in March','Presidents taking office before their votes were counted','Congress meeting too rarely to pass a budget']),
 M('The 25th Amendment deals with...','Presidential succession and disability',['Term limits for the President and Vice President','The order of Cabinet succession','How electors cast their votes']),
 M('Which amendment lowered the voting age to 18?','26th',['19th','24th','15th']),
 M('The 27th Amendment was ratified in 1992. When was it first proposed?','1789',['1920','1971','1865'],'It was one of Madison\'s original proposals and took 202 years to ratify.'),
 TF('The Equal Rights Amendment passed Congress in 1972 but wasn\'t ratified by enough states before its deadline.',true),
 F('Of the 33 amendments Congress has sent to the states, ___ have been ratified.','27',['10','33','15']),
 P('Match each amendment to what it did.',[['12th (1804)','Separate electoral votes for president and vice president'],['16th (1913)','Allowed a federal income tax'],['20th (1933)','Moved the start of new terms to January'],['25th (1967)','Set rules for presidential disability']]),
 M('The 11th Amendment (1795) stops federal courts from hearing many lawsuits against a state brought by...','Citizens of another state or a foreign country',['Members of Congress who represent that state','The state\'s own governor','Federal agencies enforcing federal law'])
]},

{id:'u14',s:1,title:'Elections & Parties',desc:'The Electoral College, primaries, parties, and voting rights',
tips:[
 ['The Electoral College',['**538** electors; a candidate needs **270** to win.','Each state gets electors equal to its **House seats + 2 senators**. D.C. gets 3 (23rd Amendment).','**48 states** and D.C. are winner-take-all. **Maine and Nebraska** can split their votes.']],
 ['Primaries and conventions',['Parties pick nominees through **primaries** (ballots) and **caucuses** (meetings).','**Open** primary: any voter. **Closed** primary: only party members.','Winners earn **delegates** to the **national convention**.']],
 ['Political parties',['The U.S. has a **two-party system**.','Winner-take-all, **single-member districts** make third-party wins rare.','Parties aren\'t in the Constitution. Washington warned against "faction."']],
 ['Expanding the vote',['**15th (1870)**: race. **19th (1920)**: women. **24th (1964)**: no poll taxes. **26th (1971)**: age 18.','The **Voting Rights Act of 1965** banned literacy tests and protected minority voters.','States run elections, within federal rules.']]
],
q:[
 T('How many electoral votes does a candidate need to win the presidency? (Type a number.)',['270']),
 M('How many electors are in the Electoral College?','538',['435','100','270']),
 M('How is a state\'s number of electors set?','Its House seats plus 2 for its senators',['Equal for every state','By land area','By its number of registered voters in the last election']),
 M('Which two states can split their electoral votes?','Maine and Nebraska',['Texas and California','Ohio and Florida','Vermont and Alaska']),
 M('Which amendment gave Washington, D.C. electoral votes?','23rd',['19th','22nd','26th']),
 TF('A candidate can win the national popular vote and still lose the Electoral College.',true,'It happened in 1876, 1888, 2000, and 2016 (and in 1824, when the House decided).'),
 M('A primary where only registered party members can vote is a...','Closed primary',['Open primary','Caucus','General election']),
 M('A caucus is...','A meeting where party members pick candidates',['A primary where only party members can vote','A party\'s national nominating convention','A vote of the Electoral College in December']),
 M('Why do third parties rarely win in the U.S.?','Winner-take-all, single-member districts favor two big parties',['Federal law caps public funding for parties outside the top two','The Constitution sets up a two-party Congress','Third-party candidates can\'t appear in presidential debates by law']),
 P('Match the amendment to the voting right.',[['15th','No race test for voting'],['19th','Women\'s suffrage'],['24th','Bans poll taxes'],['26th','Voting age 18']]),
 M('What did the Voting Rights Act of 1965 do?','Banned literacy tests and protected minority voters',['Gave women the right to vote in every state election','Lowered the voting age to 18','Created the Federal Election Commission']),
 M('Why did suffragists push for a constitutional amendment instead of winning the vote state by state?','Many states refused, and only an amendment could cover every state at once',['State laws granting women the vote were struck down by federal courts','Congress had already banned states from deciding who could vote','Women could not legally sign petitions for state ballot measures']),
 TF('The Constitution created the Democratic and Republican parties.',false,'Parties aren\'t in the Constitution at all.'),
 M('Party nominees for President are officially chosen at...','National conventions',['The Supreme Court','The Electoral College','A joint session of Congress'])
]},

{id:'u15',s:1,title:'Landmark Supreme Court Cases',desc:'The rulings every civics expert knows',
tips:[
 ['Power and structure',['**Marbury v. Madison (1803)**: judicial review.','**McCulloch v. Maryland (1819)**: implied powers and federal supremacy.','**Gibbons v. Ogden (1824)**: Congress regulates interstate commerce.']],
 ['Equal protection',['**Plessy v. Ferguson (1896)**: allowed "separate but equal."','**Brown v. Board of Education (1954)**: overturned Plessy; segregated schools are unconstitutional.','**Obergefell v. Hodges (2015)**: same-sex couples have a right to marry.']],
 ['Rights of the accused',['**Mapp v. Ohio (1961)**: illegally obtained evidence is excluded (the **exclusionary rule**).','**Gideon v. Wainwright (1963)**: a lawyer for defendants who can\'t afford one.','**Miranda v. Arizona (1966)**: police must tell suspects their rights.']],
 ['Speech and religion',['**Schenck v. U.S. (1919)**: "clear and present danger." **Tinker v. Des Moines (1969)**: students keep free speech.','**Engel v. Vitale (1962)**: no school-led prayer. **New York Times v. U.S. (1971)**: no **prior restraint**.','**Citizens United v. FEC (2010)**: independent political spending is protected speech.']]
],
q:[
 P('Match the case to its ruling.',[['Marbury v. Madison','Judicial review'],['Brown v. Board','Ended school segregation'],['Miranda v. Arizona','Police must read suspects their rights'],['Gideon v. Wainwright','Right to a lawyer']]),
 M('Which case allowed "separate but equal" segregation?','Plessy v. Ferguson (1896)',['Brown v. Board (1954)','Marbury v. Madison (1803)','Tinker v. Des Moines (1969)']),
 M('Which case overturned Plessy v. Ferguson?','Brown v. Board of Education',['Miranda v. Arizona','Sweatt v. Painter','Heart of Atlanta Motel v. United States']),
 M('In Tinker v. Des Moines, students wore black armbands to protest the Vietnam War. The Court ruled...','Students don\'t lose free speech rights at school',['Schools can ban any protest','Armbands are conduct, not speech','Schools may ban speech that is merely unpopular']),
 M('Gibbons v. Ogden (1824) expanded Congress\'s power to...','Regulate interstate commerce',['Regulate all trade inside each state','Collect a federal income tax','Build roads and canals']),
 M('The exclusionary rule from Mapp v. Ohio says...','Illegally obtained evidence can\'t be used in court',['Juries must agree unanimously before they can convict','Defendants must be told their rights','Judges may close trials to the public']),
 M('"You have the right to remain silent" comes from...','Miranda v. Arizona (1966)',['Gideon v. Wainwright (1963)','Mapp v. Ohio (1961)','Schenck v. U.S. (1919)']),
 M('Engel v. Vitale (1962) ruled that...','Public schools can\'t lead official prayers',['Students can\'t pray at school at all','Public schools can\'t teach about religion','Teachers can lead voluntary prayer']),
 M('New York Times v. United States (the Pentagon Papers case) blocked the government from...','Prior restraint (stopping publication in advance)',['Punishing papers for publishing secrets afterward','Suing reporters for libel','Requiring reporters to name sources']),
 M('Which case created the "clear and present danger" test for speech?','Schenck v. United States (1919)',['Tinker v. Des Moines (1969)','Citizens United v. FEC (2010)','Engel v. Vitale (1962)']),
 M('Korematsu v. United States (1944) is now seen as one of the Court\'s worst decisions because it...','Upheld forcing Japanese Americans into incarceration camps in World War II',['Upheld segregated public schools in the South after Reconstruction ended','Allowed police to search homes without a warrant in wartime','Struck down the first federal minimum wage law in 1935']),
 TF('In Obergefell v. Hodges (2015), the Court ruled that same-sex couples have a constitutional right to marry.',true),
 M('Dobbs v. Jackson Women\'s Health Organization (2022) overturned...','Roe v. Wade (1973)',['Brown v. Board (1954)','Miranda v. Arizona (1966)','Marbury v. Madison (1803)']),
 O('Put these cases in order, oldest first.',['Marbury v. Madison','Plessy v. Ferguson','Brown v. Board of Education','Miranda v. Arizona'])
]},

/* ---------------- SECTION 3: COLLEGE ---------------- */
{id:'u27',s:1,title:'More Landmark Cases',desc:'Citizens United and the money cases, plus rights, elections, and presidential power',
tips:[
 ['Money and speech',['**Buckley v. Valeo** (1976): spending money on campaigns is protected speech.','**Citizens United v. FEC** (2010): the government can\'t ban independent political spending by corporations and unions.','That ruling led to **super PACs**, which can raise and spend unlimited money but can\'t coordinate with candidates.']],
 ['Rights and equality',['**Loving v. Virginia** (1967) struck down bans on interracial marriage.','**New York Times v. Sullivan** (1964): public officials must prove "actual malice" to win a libel suit.','**D.C. v. Heller** (2008) found an individual right to own a gun. **SFFA v. Harvard** (2023) ended race-conscious college admissions.']],
 ['Elections and power',['**Bush v. Gore** (2000) stopped the Florida recount.','**Shelby County v. Holder** (2013) and **Rucho v. Common Cause** (2019) reshaped voting rights and redistricting.','**Trump v. United States** (2024) gave presidents immunity for official acts.']]
],
q:[
 M('What did Buckley v. Valeo (1976) decide about campaign money limits?','Limits on giving are allowed; limits on spending are not',['Limits on both giving and spending are allowed','Limits on spending are allowed; limits on giving are not','Neither giving nor spending may ever be limited']),
 M('What did Citizens United v. FEC (2010) decide?','The government can\'t ban independent election spending by corporations or unions',['Corporations may give unlimited money directly to federal candidates\' campaigns','Super PACs must disclose every donor within 24 hours of a gift','Unions may spend on elections, but corporations may not']),
 M('What is a super PAC?','A group that can spend unlimited sums on elections but can\'t coordinate with candidates',['A candidate\'s own official campaign committee, which faces strict giving limits','A party committee that can give unlimited money to its candidates','A PAC that may give a candidate up to $5,000 per election']),
 TF('Citizens United lets corporations give unlimited money directly to federal candidates.',false,'Direct corporate contributions to federal candidates are still banned. The ruling covers independent spending.'),
 M('What did Loving v. Virginia (1967) decide?','States can\'t ban interracial marriage',['States can ban same-sex marriage','Marriage is a federal power only','States must recognize marriages from other countries']),
 M('Under New York Times v. Sullivan (1964), a public official suing for libel must prove...','"Actual malice": the publisher knew it was false or recklessly ignored the truth',['Only that the story was false and that it damaged their public reputation','That the error caused them measurable financial harm','That the publisher was careless in checking its facts before printing']),
 M('What did District of Columbia v. Heller (2008) decide?','The Second Amendment protects an individual right to own a gun for self-defense',['The Second Amendment protects only service in a state militia','Cities may ban handguns kept in the home, as long as rifles are allowed','Only Congress, not states or cities, may regulate guns']),
 M('Students for Fair Admissions v. Harvard (2023) ruled that...','Race-conscious admissions violate equal protection',['Race may be one factor among many in admissions','Colleges must use race-based quotas to admit students','Admissions tests like the SAT are unconstitutional']),
 M('What did Bush v. Gore (2000) do?','Stopped the Florida recount, which left George W. Bush the winner',['Ordered a new statewide recount of every ballot cast in Florida','Gave Florida\'s electoral votes to Al Gore','Sent the election to the House to decide']),
 M('Shelby County v. Holder (2013) struck down...','The formula for which places needed federal approval to change voting rules',['The entire Voting Rights Act of 1965, as outdated','The ban on literacy tests and other tests as a condition of voting','Section 2, which bans discriminatory voting rules nationwide']),
 M('Rucho v. Common Cause (2019) said partisan gerrymandering claims...','Can\'t be decided by federal courts',['Must be struck down whenever one party gains an edge','Are judged by federal courts under strict scrutiny','Can be heard only by the Supreme Court directly']),
 M('What did Trump v. United States (2024) decide about presidential immunity?','Immunity for official acts, absolute for core powers, none for unofficial acts',['Presidents can never be prosecuted for anything done in office','Presidents have no immunity at all from prosecution once they leave office','Immunity only for acts that Congress approved in advance'])
]},

{id:'u26',s:1,title:'The Parties Today',desc:'Democrats, Republicans, third parties, and what each says it stands for',
tips:[
 ['Why two big parties?',['**Winner-take-all** elections reward two big parties. Political scientists call this **Duverger\'s law**.','The **Democratic Party** (1828) is the oldest. The **Republican Party** (1854) formed to stop slavery\'s spread.','Each party writes a **platform** at its national convention every four years.']],
 ['What the big two stand for',['Democrats generally favor a **bigger government role** in health care, climate action, and abortion rights.','Republicans generally favor **lower taxes, less regulation**, stricter immigration enforcement, and limits on abortion.','Both have factions: progressives and moderates, populists and traditional conservatives.']],
 ['Everyone else',['**Libertarians**: minimal government in both the economy and personal life.','**Greens**: environment, social justice, grassroots democracy. **Working Families**: progressive, uses New York\'s fusion voting.','More Americans call themselves **independents** than Democrats or Republicans.']]
],
q:[
 M('Which change would most help third parties win seats in Congress?','Proportional representation in multi-member districts',['Holding every federal election on a national holiday, so more people vote','Letting third parties into presidential debates','Moving all the states\' primaries to the same day']),

{id:'u16',s:2,title:'Political Theory',desc:'Hobbes, Locke, Montesquieu, and the Federalist Papers',
tips:[
 ['Social contract thinkers',['**Hobbes** (*Leviathan*, 1651): without government, life is "solitary, poor, nasty, brutish, and short," so people need a strong sovereign.','**Locke** (*Two Treatises*, 1689): natural rights to **life, liberty, and property**; government rests on **consent**.','**Rousseau** (*The Social Contract*, 1762): the **general will**.']],
 ['Montesquieu and the ratification fight',['**Montesquieu** (*The Spirit of the Laws*, 1748) argued for **separation of powers**.','The **Federalist Papers**: 85 essays by **Hamilton, Madison, and Jay** writing as "Publius."','**Anti-Federalists** feared central power and demanded a bill of rights.']],
 ['Federalist essays to know',['**No. 10** (Madison): **factions** are best controlled by a **large republic**.','**No. 51** (Madison): "**Ambition must be made to counteract ambition**." "If men were angels, no government would be necessary."','**No. 70** (Hamilton): an **energetic** single executive. **No. 78** (Hamilton): the judiciary is the "**least dangerous**" branch.']]
],
q:[
 M('Who wrote that life without government would be "solitary, poor, nasty, brutish, and short"?','Thomas Hobbes',['John Locke','Jean-Jacques Rousseau','Montesquieu']),

 M('Rousseau\'s name for what the community as a whole wills is the...','General will',['Invisible hand','Social gospel','Tyranny of the majority']),
 M('Whose book "The Spirit of the Laws" shaped the idea of separation of powers?','Montesquieu',['Hobbes','Machiavelli','Plato']),
 P('Match the Federalist Paper to its big idea.',[['No. 10','Control factions with a large republic'],['No. 51','Ambition counteracts ambition'],['No. 70','An energetic single executive'],['No. 78','The least dangerous branch']]),
 M('Who wrote the Federalist Papers?','Alexander Hamilton, James Madison, and John Jay',['Thomas Jefferson, John Adams, and Benjamin Franklin','George Washington, Alexander Hamilton, and James Madison','James Madison, James Monroe, and John Jay']),
 F('"If men were ___, no government would be necessary." (Federalist No. 51)','angels',['equal','free','wise']),
 M('In Federalist No. 10, Madison defines a faction as...','A group whose interest runs against others\' rights or the common good',['A political party organized inside the halls of Congress and the states','Any group of states that regularly votes as a bloc','A minority that opposes whatever government is in power']),
 M('What was the Anti-Federalists\' biggest demand?','A bill of rights',['Abolishing the Senate','Ending the slave trade immediately','A stronger President']),
 TF('Hamilton called the judiciary the "least dangerous" branch because it has neither the sword nor the purse.',true)
]},

{id:'u17',s:2,title:'Congressional Procedure',desc:'The insider rules that decide what passes',
tips:[
 ['Fast tracks in the House',['**Suspension of the rules**: 40 minutes of debate, no amendments, and a **2/3** vote. Used for less controversial bills.','**Special rules** from the Rules Committee structure debate on major bills.','The **Committee of the Whole** lets the House work with a quorum of just **100**.']],
 ['Budget and money',['**Authorization** creates a program; **appropriation** funds it. Congress aims to pass **12** appropriations bills a year.','Miss the deadline and you need a **continuing resolution**, or the government **shuts down**.','**Reconciliation** can\'t be filibustered, but the **Byrd rule** blocks provisions that aren\'t about the budget. The **CBO** estimates costs.']],
 ['Senate floor tactics',['**Unanimous consent agreements** set the terms of debate.','**Filling the amendment tree** lets the Majority Leader block other amendments.','Senators can add unrelated amendments (**riders**). The **Parliamentarian** advises on the rules.']]
],
q:[
 M('Under suspension of the rules in the House, a bill needs...','A two-thirds vote, with limited debate and no amendments',['A simple majority, with unlimited debate and amendments','A three-fifths vote, with amendments open to all','Unanimous consent from every member present']),
 M('What\'s the difference between authorization and appropriation?','Authorization creates a program; appropriation funds it',['They\'re the same thing','Appropriation creates a program; authorization funds it','Authorization is only for the Senate']),
 M('If appropriations aren\'t passed on time, Congress can avoid a shutdown with a...','Continuing resolution',['Discharge petition from the House','Cloture motion','Pocket veto']),
 M('Why is budget reconciliation powerful in the Senate?','It can\'t be filibustered, so it can pass with a simple majority',['It skips the House and goes straight to the President to sign','It takes effect without the President\'s signature','It can change the Constitution by majority vote']),
 M('The Byrd rule blocks reconciliation provisions that are...','"Extraneous," not mainly about spending or revenue',['Written or proposed by the minority party','More than 100 pages long, or added after debate','About defense, war, or national security']),
 M('Which nonpartisan agency estimates what bills will cost?','The Congressional Budget Office (CBO)',['The Office of Management and Budget (OMB)','The Federal Reserve','The Government Accountability Office (GAO)'],'OMB is the President\'s budget office. GAO audits how money is spent.'),
 M('An unrelated amendment attached to a bill is called a...','Rider',['Hold','Markup','Quorum call']),
 M('The Senate Majority Leader "fills the amendment tree" to...','Block other senators from offering amendments',['Speed up a final vote on a pending nominee','Force a vote on every pending amendment','Send the bill back to committee']),
 TF('The House\'s Committee of the Whole can do business with a quorum of 100 members.',true),
 F('Congress normally aims to pass ___ regular appropriations bills each year.','12',['1','3','50'])
]},

{id:'u18',s:2,title:'Presidency & Bureaucracy',desc:'Presidential power and the agencies that run the government',
tips:[
 ['Presidential power',['**Richard Neustadt** (*Presidential Power*, 1960): presidential power is "the **power to persuade**."','Theodore Roosevelt called the office a **bully pulpit**.','Unilateral tools: **executive orders**, **signing statements**, memoranda. The **unitary executive** theory says the President controls the whole executive branch.']],
 ['The bureaucracy',['Millions of civilian federal workers in **departments**, **independent agencies** (like the SEC), and **government corporations** (like the Postal Service).','**Iron triangles** link agencies, congressional committees, and interest groups. **Issue networks** are looser.','The **Pendleton Act (1883)** began replacing the spoils system with a merit civil service.']],
 ['Rulemaking and control',['Agencies write regulations under the **Administrative Procedure Act (1946)** using **notice and comment**.','Rules are published in the **Federal Register**.','In **Loper Bright v. Raimondo (2024)**, the Court overruled **Chevron** deference, so judges now decide what statutes mean on their own.']]
],
q:[
 M('Neustadt argued that presidential power is the power to...','Persuade',['Command the bureaucracy','Veto','Spend']),
 M('Theodore Roosevelt called the presidency\'s platform for shaping opinion the...','Bully pulpit',['Imperial presidency','Rose Garden strategy','Fireside chat']),
 M('A statement a President issues when signing a bill, sometimes explaining how they\'ll interpret it, is a...','Signing statement',['Pocket veto','Executive agreement','Line-item veto']),
 M('The unitary executive theory holds that...','The President controls the entire executive branch',['Congress controls the agencies that it creates','The Vice President shares power equally','States run federal agencies']),
 M('Which is an independent regulatory agency?','The Securities and Exchange Commission (SEC)',['The Department of Justice','The Department of Homeland Security','The Office of Management and Budget (OMB)']),
 M('An iron triangle links which three groups?','Agencies, congressional committees, and interest groups',['The President, Congress, and the federal courts working together','Voters, political parties, and the news media','Federal, state, and local governments']),
 M('Agencies write rules through notice and comment under the...','Administrative Procedure Act (1946)',['Voting Rights Act (1965)','War Powers Resolution (1973)','Pendleton Civil Service Act (1883)']),
 M('Proposed and final federal regulations are published in the...','Federal Register',['Congressional Record','U.S. Reports','Constitution Annotated']),
 M('In Loper Bright Enterprises v. Raimondo (2024), the Supreme Court...','Overruled Chevron deference to agencies\' readings of statutes',['Expanded Chevron deference to agencies\' readings of statutes','Ruled that the President may fire any agency official','Struck down the Administrative Procedure Act']),
 TF('The Pendleton Act (1883) began replacing the spoils system with a merit-based civil service.',true)
]},

{id:'u19',s:2,title:'Opinion, Voting & Parties',desc:'Why people vote the way they do',
tips:[
 ['Where opinions come from',['**Political socialization**: family, school, peers, media, religion.','**Party identification** is the strongest predictor of how people vote.','*The American Voter* (1960) described party ID as a stable, psychological attachment.']],
 ['Theories of voting',['**Anthony Downs** (*An Economic Theory of Democracy*, 1957): the **median voter theorem**. In two-party races on one dimension, candidates move to the center.','The **paradox of voting**: why vote if one vote almost never decides?','**Retrospective voting**: judging incumbents by past results.']],
 ['Parties and polarization',['**Duverger\'s Law**: plurality, single-member districts produce two parties. **Proportional representation** supports more.','**Critical elections** realign coalitions, as in **1932** (the New Deal).','**Affective polarization**: partisans increasingly dislike and distrust the other side.']]
],
q:[
 M('The process by which people develop their political views is called...','Political socialization',['Partisan realignment','Retrospective voting','Political efficacy']),
 M('What is the strongest single predictor of how Americans vote?','Party identification',['Income alone','Region alone','The candidate\'s age']),
 M('The median voter theorem predicts that in two-party races on one issue dimension, candidates...','Move toward the center',['Move to the extremes','Refuse to take positions','Always split the vote evenly']),
 M('Anthony Downs argued that since one vote almost never decides an election, most voters will...','Stay "rationally ignorant," using shortcuts like party labels',['Stop voting entirely within a few elections, since it feels pointless','Vote only for third parties as a form of protest','Study every issue closely so their one vote counts']),
 M('The paradox of voting asks...','Why people vote when one vote almost never decides an election',['Why the popular vote and the Electoral College can disagree','Why turnout is higher in midterms','Why primaries come first']),
 M('Voting based on how well an incumbent has done is called...','Retrospective voting',['Prospective voting','Straight-ticket voting','Strategic voting']),
 M('Duverger\'s Law says plurality, single-member district elections tend to produce...','A two-party system',['Many parties','One-party rule','No lasting parties at all']),
 M('The 1932 election that built the New Deal coalition is a classic example of a...','Realigning election',['Dealigning election','Deviating election','Maintaining election']),
 M('Disliking and distrusting the other party, beyond disagreeing on issues, is called...','Affective polarization',['Ideological sorting by issue','Split-ticket voting','Political efficacy']),
 TF('Proportional representation systems tend to support more than two parties.',true)
]},

{id:'u20',s:2,title:'Comparative Politics',desc:'How other democracies are built',
tips:[
 ['Presidential vs. parliamentary',['**Presidential** (U.S.): the executive is elected separately and serves a fixed term.','**Parliamentary** (UK): the **prime minister** comes from the legislature and needs its **confidence**. A **vote of no confidence** can bring the government down.','**Semi-presidential** (France): an elected president plus a prime minister.']],
 ['Electoral systems',['**First-past-the-post** (single-member plurality): U.S., UK.','**Proportional representation**: seats match vote share (Netherlands, Israel).','**Mixed-member proportional**: Germany, New Zealand. **Ranked-choice voting**: voters rank candidates.']],
 ['Models of democracy',['**Arend Lijphart**: **majoritarian** (Westminster) vs. **consensus** democracies.','**Juan Linz**: the "**perils of presidentialism**": fixed terms and dual legitimacy can cause deadlock.','**Federal** vs. **unitary** states; **bicameral** vs. **unicameral** legislatures.']]
],
q:[
 M('In a parliamentary system, the head of government is usually...','A prime minister drawn from the legislature',['A directly elected president','A monarch','A minister chosen by voters separately from parliament']),
 M('A vote of no confidence can...','Bring down a government in a parliamentary system',['Remove a U.S. President between elections by a majority of Congress','Overturn a ruling of the highest court','Cancel a scheduled national election']),
 M('France, with a powerful elected president and a prime minister, is a...','Semi-presidential system',['Pure parliamentary system','Absolute monarchy','Confederation']),
 M('In proportional representation, parties win seats...','Roughly in proportion to their share of the vote',['Only by winning the most votes in a district','In proportion to their share of members','Based on each region\'s share of the population']),
 M('Germany and New Zealand use which electoral system?','Mixed-member proportional',['Pure first-past-the-post','An electoral college','Ranked-choice only']),
 M('Ranked-choice voting lets voters...','Rank candidates in order of preference',['Vote more than once','Choose only a party, not a candidate','Skip the general election']),
 M('Arend Lijphart contrasted majoritarian democracies with...','Consensus democracies',['Authoritarian regimes','Direct democracies','Theocracies']),
 M('Juan Linz warned about the "perils of presidentialism" because...','Fixed terms and dual legitimacy can cause deadlock and crises',['Presidents are designed to become dictators over a few terms','Presidential systems can\'t hold truly free elections','Presidents are usually too weak to set any policy']),
 M('A country where the central government holds most power and regions get delegated authority is...','Unitary',['Federal','Confederal','Presidential']),
 TF('The United Kingdom has a single written, codified constitution like the U.S.',false,'The UK\'s constitution is uncodified: statutes, conventions, and court rulings.')
]},

{id:'u21',s:3,title:'Rational Choice & Game Theory',desc:'Collective action, social choice, and pivots',
tips:[
 ['Collective action',['**Mancur Olson** (*The Logic of Collective Action*, 1965): the **free-rider problem**. Small, concentrated groups organize more easily than large, diffuse ones.','**Selective incentives** reward only members who contribute.','The **prisoner\'s dilemma**: individually rational choices leave everyone worse off.']],
 ['Social choice',['The **Condorcet paradox**: majority preferences can cycle (A beats B, B beats C, C beats A).','**Arrow\'s impossibility theorem**: with 3+ options, no ranked voting rule meets every fairness condition.','When preferences cycle, **agenda control** decides outcomes.']],
 ['Spatial models of lawmaking',['**Krehbiel\'s pivotal politics**: the **filibuster pivot** (the 60th vote) and the **veto pivot** (2/3) create a **gridlock interval**.','**Tsebelis\'s veto players**: more veto players, farther apart, means more policy stability.','**Principal–agent** problems: principals can\'t fully monitor the agents they delegate to.']]
],
q:[
 M('In Olson\'s theory, why do large groups struggle to organize?','Members can free-ride on others\' efforts',['Large groups disagree too much to agree on goals','Large groups are legally limited in what they can spend','Leaders of large groups lack the authority to act']),
 M('Benefits given only to members who join (like insurance or a magazine) are...','Selective incentives',['Public goods','Externalities','Pork barrel spending']),
 M('In the prisoner\'s dilemma, rational individual choices lead to...','An outcome worse for both players than cooperating',['The best outcome for both players, without any trust','The outcome a central planner would choose','One player always winning']),
 M('When majority preferences cycle (A beats B, B beats C, C beats A), it\'s called...','The Condorcet paradox',['Duverger\'s Law','The median voter theorem','Path dependence']),
 M('Arrow\'s impossibility theorem shows that...','With 3+ options, no ranked voting rule meets every fairness test',['Democracy can never produce fair outcomes for anyone at all','Plurality voting always produces exactly two parties','Majority preferences can never cycle among options']),
 M('In Krehbiel\'s pivotal politics, the filibuster pivot is...','The senator who casts the 60th vote for cloture',['The Senate Majority Leader','The 51st, median senator','The senator who casts the 67th vote to override']),
 M('The range of status quo policies that supermajority pivots keep from changing is the...','Gridlock interval',['Win set','Pareto frontier of policies','Median line']),
 M('According to Tsebelis, policy stability increases when...','There are more veto players with more distant preferences',['There are fewer veto players, and they mostly agree on policy','One party controls every branch at once','Elections happen more often']),
 M('Congress delegates to an agency but can\'t fully monitor it. That\'s a...','Principal–agent problem',['Collective action problem','Condorcet cycle','Median voter problem']),
 TF('Agenda control matters most when majority preferences cycle.',true)
]},

{id:'u22',s:3,title:'Congress Scholarship',desc:'Mayhew, Fenno, party cartels, and political time',
tips:[
 ['The electoral connection',['**David Mayhew** (*Congress: The Electoral Connection*, 1974): members are "**single-minded seekers of reelection**."','They pursue **advertising**, **credit claiming**, and **position taking**.','**Richard Fenno** (*Home Style*, 1978) studied how members present themselves back home.']],
 ['Parties in Congress',['**Cox & McCubbins**: the majority party is a **cartel** that uses **negative agenda control** to keep divisive bills off the floor.','The informal **Hastert rule**: bring bills up only with support from a "majority of the majority."','**Aldrich & Rohde**: **conditional party government**. Leaders get strong when parties are internally united and far apart.']],
 ['Institutions and time',['**Historical institutionalism**: **path dependence**, **critical junctures**, and **increasing returns** (Paul Pierson).','**Skowronek** (*The Politics Presidents Make*): presidents act in "**political time**": reconstruction, articulation, disjunction, preemption.','**DW-NOMINATE** (Poole & Rosenthal) measures ideology from roll-call votes.']]
],
q:[
 M('Mayhew described members of Congress as "single-minded seekers of..."','Reelection',['Power','Wealth','Good policy']),
 P('Match Mayhew\'s three activities.',[['Advertising','Building name recognition'],['Credit claiming','Taking credit for benefits'],['Position taking','Stating views on issues']]),
 M('Fenno\'s "Home Style" studied...','How members present themselves to voters back home',['How members vote on bills once they arrive in Washington','How committee chairs control the agenda','How party leaders reward loyal members']),
 M('Cox and McCubbins say the majority party acts like a cartel mainly by...','Controlling the agenda to block bills that would split the party',['Buying votes with federal spending in members\' home districts','Controlling the committees that confirm federal judges','Requiring every member to vote the party line always']),
 M('The informal Hastert rule says the Speaker brings up bills only if...','A majority of the majority party supports them',['The President approves','The Senate passes them first','Two-thirds of the whole House supports them']),
 M('Conditional party government predicts strong leaders when...','Each party agrees internally and the parties are far apart',['The two parties overlap a lot on the major issues of the day','Government is divided between the two parties','The majority party holds a very large margin']),
 M('The idea that early choices lock in later outcomes is...','Path dependence',['The median voter theorem','Retrospective voting','Agenda setting']),
 M('In Skowronek\'s political time, presidents like FDR and Reagan are presidents of...','Reconstruction',['Disjunction','Preemption','Articulation']),
 M('DW-NOMINATE is a method for...','Measuring legislators\' ideology from roll-call votes',['Counting electoral votes by congressional district in each state','Drawing districts with equal populations','Predicting who will win party nominations']),
 TF('Historical institutionalism emphasizes critical junctures and long-run sequences.',true)
]},

{id:'u23',s:3,title:'Constitutional Interpretation',desc:'Originalism, scrutiny, incorporation, and modern doctrine',
tips:[
 ['Ways to read the Constitution',['**Originalism**: the meaning when it was ratified. **Textualism**: the ordinary meaning of the words.','**Living constitutionalism**: meaning adapts as society changes.','**Stare decisis**: courts generally follow precedent.']],
 ['Levels of scrutiny',['**Strict scrutiny**: a **compelling** interest, **narrowly tailored** (race, fundamental rights).','**Intermediate scrutiny**: an **important** interest, **substantially related** (sex).','**Rational basis**: a **legitimate** interest, **rationally related** (most laws). The idea traces to **Carolene Products footnote four (1938)**.']],
 ['Incorporation and modern doctrine',['**Selective incorporation**: the 14th Amendment applies most of the Bill of Rights to states (e.g., **McDonald v. Chicago**, 2010, for the 2nd Amendment).','The **major questions doctrine** (**West Virginia v. EPA**, 2022): agencies need clear authorization for decisions of vast significance.','The **nondelegation doctrine** limits how much lawmaking power Congress can hand off.']]
],
q:[
 M('Reading the Constitution by its meaning when it was ratified is...','Originalism',['Living constitutionalism','Legal realism','Judicial restraint']),
 M('The doctrine of following precedent is called...','Stare decisis',['Certiorari','Habeas corpus','Amicus curiae']),
 P('Match the level of scrutiny to its test.',[['Strict scrutiny','Compelling interest, narrowly tailored'],['Intermediate scrutiny','Important interest, substantially related'],['Rational basis','Legitimate interest, rationally related']]),
 M('Which level of scrutiny applies to laws that classify people by race?','Strict scrutiny',['Rational basis','Intermediate scrutiny','No scrutiny']),
 M('Laws that classify by sex usually get...','Intermediate scrutiny',['Strict scrutiny','Rational basis review','Heightened rational basis']),
 M('Footnote four of United States v. Carolene Products (1938) suggested...','Closer review for laws hurting "discrete and insular minorities"',['Strict scrutiny for every law that regulates the national economy','An end to judicial review of laws passed by Congress','Leaving all questions about rights to the states']),
 M('Applying Bill of Rights protections to states through the 14th Amendment is...','Selective incorporation',['Nullification by the states','Preemption','Judicial restraint']),
 M('McDonald v. Chicago (2010) incorporated which amendment against the states?','The 2nd Amendment',['The 1st Amendment','The 4th Amendment','The 10th Amendment']),
 M('The major questions doctrine (West Virginia v. EPA, 2022) says agencies...','Need clear permission from Congress for decisions of vast importance',['Can\'t write rules on any major economic subject without a new law','Need Supreme Court approval before issuing any big rule','Get deference from courts whenever a statute is unclear']),
 TF('Textualism focuses on the ordinary meaning of a law\'s words rather than lawmakers\' intentions.',true)
]},

{id:'u24',s:3,title:'Research Methods',desc:'How political scientists know what they know',
tips:[
 ['Correlation is not causation',['A **confounder** affects both the supposed cause and the effect.','**Reverse causality**: the effect actually drives the cause.','**Selection bias**: the cases studied aren\'t representative.']],
 ['Designs for causal inference',['**Randomized experiments** balance confounders on average (e.g., Gerber & Green\'s get-out-the-vote field experiments).','**Regression discontinuity**: compare cases just above and below a cutoff, like barely winning vs. barely losing.','**Difference-in-differences** compares changes over time and assumes **parallel trends**.']],
 ['Validity and measurement',['**Internal validity**: is the causal claim right in this study? **External validity**: does it generalize?','Surveys suffer from **social desirability bias** and wording effects.','Qualitative tools include case studies and **process tracing**.']]
],
q:[
 M('A variable that influences both the supposed cause and the effect is a...','Confounder',['Instrument','Dependent variable','Constant']),
 M('Why are randomized experiments the "gold standard" for causal claims?','Random assignment balances confounders between groups on average',['They cost less than surveys, interviews, or observational studies','Their results apply to every population and setting','They remove the need for statistical tests']),
 M('Comparing candidates who barely won with those who barely lost uses a...','Regression discontinuity design',['Difference-in-differences design','Content analysis','Process tracing']),
 M('Difference-in-differences depends on which key assumption?','Parallel trends',['Random sampling','A normal distribution','Zero correlation']),
 M('Asking whether findings apply to other places and times is a question of...','External validity',['Internal validity','Reliability','Statistical significance']),
 M('Survey respondents overreport voting because it\'s seen as good. That\'s...','Social desirability bias',['Selection bias','Survivorship bias','Omitted variable bias in surveys']),
 M('Tracing the step-by-step causal mechanism within one case is called...','Process tracing',['Regression with controls','Randomization','Bootstrapping']),
 M('If wealth causes democracy, a study claiming democracy causes wealth may suffer from...','Reverse causality',['Measurement reliability','External validity','Random assignment']),
 TF('A statistically significant correlation proves that one variable causes another.',false),
 M('Gerber and Green\'s field experiments found which get-out-the-vote method works best per contact?','Face-to-face canvassing at the door',['Prerecorded robocalls from candidates','Mailed postcards reminding people to vote','Online banner ads on news sites'])
]},

{id:'w1',s:4,region:'wa',title:'Seattle City Government',desc:'The mayor, the council, King County, and how Seattle votes',
tips:[

 ['The other local players',['The **City Attorney** is elected separately from the Mayor.','**King County** runs elections, public health, the courts, the jail, and **King County Metro**. It\'s led by an elected **County Executive** and a **9-member County Council**.','The **Port of Seattle** has **5 commissioners** elected countywide. The **Seattle School Board** has 7 directors.']],
 ['How Seattle voters decide',['Washington uses a **top-two primary** in **August**: the two highest vote-getters advance, whatever their party.','Everyone **votes by mail**. Seattle voters approved **ranked-choice voting** for city primaries in 2022, starting in **2027**.','**Democracy Vouchers**: each eligible resident gets **four $25 vouchers** to give to qualifying city candidates.']]
],

 M('How are Seattle City Council members elected?','7 by district and 2 citywide',['All 9 citywide','All 9 by district','Appointed by the mayor, then confirmed']),
 M('How long is a Seattle mayor\'s term?','4 years',['2 years','6 years','Until replaced by the council']),
 TF('Seattle city elections are partisan, with candidates listed as Democrats or Republicans.',false,'City races are nonpartisan.'),
 M('Which office runs elections for Seattle voters?','King County Elections',['The Seattle City Clerk','The Washington State Patrol','The Mayor\'s office']),
 M('King County Metro, the region\'s bus system, is run by...','King County',['The City of Seattle','The State of Washington','The Port of Seattle']),
 M('How is the Port of Seattle governed?','By 5 commissioners elected countywide',['By 9 commissioners appointed by the governor','By the Seattle City Council','By a single appointed director']),
 M('In Washington\'s top-two primary...','The two highest vote-getters advance, regardless of party',['Each party\'s top vote-getter advances','Only registered party members can vote in it','The top four advance, ranked on the November ballot']),
 M('Seattle\'s Democracy Voucher program gives each eligible resident...','Four $25 vouchers to give to qualifying city candidates',['A $100 tax refund for voting in the city\'s primary','Free public funding for any candidate they choose','A $100 credit for donating to state candidates']),
 M('Seattle voters approved ranked-choice voting for city primaries starting in...','2027',['2020','2023','2031']),

 ['City and county',['Salt Lake City Mayor **Erin Mendenhall**. Council Chair **Alejandro "Ale" Puy** leads the council in 2026.','Salt Lake County Mayor **Jenny Wilson**. County District Attorney **Sim Gill**.']],
 ['Utah\'s Capitol',['Gov. **Spencer Cox** and Lt. Gov. **Deidre Henderson**, who oversees elections.','Attorney General **Derek Brown**.','Senate President **Stuart Adams** and House Speaker **Mike Schultz**.']],
 ['Washington, D.C.',['U.S. Senators **Mike Lee** and **John Curtis**. Neither seat was up in 2026.','Democrat **Ben McAdams** won the new **1st District**, based in Salt Lake County.','Find yours on the My reps page.']]
],

 M('Who is Utah\'s lieutenant governor?','Deidre Henderson',['Spencer Cox','Derek Brown','Michelle Kaufusi']),
 M('In Utah, the lieutenant governor\'s office also...','Oversees elections',['Runs the state prisons','Writes the state budget alone','Appoints county clerks']),
