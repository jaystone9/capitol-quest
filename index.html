'u1-8':'America\'s first government ran under the **Articles of Confederation** (1781). Its fatal flaw: **Congress could not collect taxes**. It had to beg the states for money. There was also no President and no national courts.',
'u1-9':'Under the Articles, every state got exactly **one vote** in Congress, big or small. Changing the Articles needed every single state to agree.',
'u1-10':'In 1786–87, broke Massachusetts farmers led by Daniel Shays rose up in **Shays\' Rebellion**. The national government had no army to respond, and leaders panicked: the Articles were too weak.',
'u1-11':'So in 1787 delegates met in **Philadelphia** for the **Constitutional Convention**. George Washington ran the meeting. (Washington, D.C. didn\'t exist yet.)',
'u1-12':'**James Madison** planned so much of the Constitution that he\'s called the **"Father of the Constitution."** Jefferson wasn\'t even there; he was in France.',
'u1-13':'Big states wanted power by population; small states wanted equal votes. The **Great Compromise** gave both: **a House based on population and a Senate with equal votes per state**.',
'u1-14':'Here\'s the founding timeline. Memorize the years: 1776, 1781, 1787, 1791.',
'u1-15':'Four founding documents, four jobs. Lock these in:',
/* u2 The Constitution, Article by Article */
'u2-0':'The original Constitution is just **7 articles**. It builds a **framework** and leaves details to **Congress and later laws**. State constitutions, like Washington\'s, are long and detailed, and amended often.',
'u2-1':'The **Preamble** opens with "We the People" and lists six goals: a more perfect union, justice, domestic tranquility, the common defence, the general welfare, and liberty. Here\'s what four of them look like today:',
'u2-2':'The Preamble lists six goals: union, justice, tranquility, defense, welfare, and liberty. It does **not** mention property, even though Locke and many framers prized it. **Protect the rights of private property** shows up later, in the 5th Amendment.',
'u2-3':'Articles I, II, and III set up the three branches. Article IV covers how states treat each other, V is how to amend, VI makes federal law supreme, and VII covers ratification.',
'u2-4':'Article I is the longest article for a reason. **The framers listed Congress\'s powers, and the limits on them, so it couldn\'t claim powers it wasn\'t given.** Section 8 lists what Congress may do. Section 9 lists what it may not.',
'u2-5':'Inside Article I, **Section 8** is the famous one: it **lists the powers of Congress**, like taxing, borrowing, and declaring war.',
'u2-6':'Article III names only **one court: the Supreme Court**. Every lower federal court exists because **Congress created them by law, starting with the Judiciary Act of 1789**. That\'s why Congress can also reshape or abolish them.',
'u2-7':'Fun fact: **treason** is the **only crime the Constitution defines**. Article III says it means waging war against the U.S. or giving its enemies aid and comfort.',
'u2-8':'Article IV\'s **Full Faith and Credit Clause** means states must **respect each other\'s public records and court rulings**. A marriage or court judgment in Washington counts in Texas too.',
'u2-9':'Article VI says **no religious test** can ever be required to **hold a federal office**. It also makes the Constitution the **supreme law of the land**.',
'u2-10':'Article VII set the launch rule: the Constitution took effect once **9** of the 13 states ratified it.',
'u2-11':'**Habeas corpus** can be suspended **only during rebellion or invasion, when public safety requires it**. Lincoln famously did it during the Civil War.',
'u2-12':'A **writ of habeas corpus** protects you from **being held in jail without going before a judge**. The government has to show a legal reason for locking you up.',
'u2-13':'The Constitution bans **ex post facto laws**: laws that **punish an act that was legal when it was done**. They can\'t change the rules after the game.',
'u2-14':'The **Commerce Clause** lets Congress regulate trade **with foreign nations, among the states, and with Native American tribes**. It\'s become one of Congress\'s biggest powers.',
'u2-15':'Surprise: the word **"democracy" never appears** in the Constitution or the Declaration. The Framers talked about a "republic" instead.',
/* u3 Three Branches */
'u3-0':'Three branches, three jobs. This is the core of the whole system:',
'u3-1':'**Congress** is the **legislative branch**. "Legislate" means to make laws.',
'u3-2':'The **executive branch** is led by **the President**. It carries out (executes) the laws.',
'u3-3':'Why three branches? **So no single person or group gets too much power.** The Framers had just escaped a king and didn\'t want another.',
'u3-4':'Only **Congress** can **declare war**. The President commands the military, but the formal declaration belongs to Congress.',
'u3-5':'Congress also controls money: taxing and spending. That\'s called the **"power of the purse,"** and it belongs to **Congress**.',
'u3-6':'When the President rejects a bill Congress passed, that\'s a **veto**. It\'s Latin for "I forbid."',
'u3-7':'But Congress can fight back: it can **override a veto** with a **two-thirds** vote in **both** the House and the Senate.',
'u3-8':'Courts check the others with **judicial review**: ruling that a law **violates the Constitution** and striking it down.',
'u3-9':'The President picks Supreme Court justices, but **the Senate must confirm them**. It\'s another check.',
'u3-10':'The Constitution changes **through amendments**. There\'s no national vote of the people to change it.',
'u3-11':'There are **27 amendments** so far. The first one passed in 1791 and the newest, the 27th, in 1992.',
'u3-12':'Amending is hard on purpose. **Three-fourths of the states (38 of 50)** must ratify an amendment after Congress proposes it.',
'u3-13':'The **first ten amendments** have a special name: the **Bill of Rights**.',
'u3-14':'Checks and balances means each branch can block the others. Who holds which check:',
'u3-15':'When a written constitution caps what government can do, that\'s a **limited government**. The opposite is unlimited rule, like an absolute monarchy.',
/* u4 Congress 101 */
'u4-0':'Congress is **bicameral**, which means **it has two chambers**: the House of Representatives and the Senate.',
'u4-1':'The four numbers every civics student knows:',
'u4-2':'Every state gets exactly **2 senators**, whether it\'s California or Wyoming.',
'u4-3':'House seats are divided **by population**. Bigger states get more representatives. Washington has 10.',
'u4-4':'House members serve short **2-year terms**, so they\'re always running for reelection.',
'u4-5':'Senators serve long **6-year terms**.',
'u4-6':'To serve in the House you must be at least **25** years old.',
'u4-7':'To be a senator you must be at least **30** years old.',
'u4-8':'The House is led by the **Speaker of the House**, elected by the members and usually from the majority party.',
'u4-9':'The official **President of the Senate** is **the Vice President of the United States**.',
'u4-10':'The Vice President rarely shows up, though: the **VP votes in the Senate only to break a tie**.',
'u4-11':'Because of 2-year terms, **the entire House is up for election every 2 years**.',
'u4-12':'Senate terms are staggered, so only about **one-third** of the Senate is up for election every 2 years.',
'u4-13':'Every 10 years the **census** counts everyone. Then House seats get redivided, so a state can gain or lose seats.',
'u4-14':'Bottom line: **every American living in a state has two senators and one House member**. You can look yours up and call them.',
'u4-15':'Why do senators get 6 years? **So they can focus on long-term issues with less election pressure.** Madison wanted the Senate steady and the House close to public opinion.',
/* u5 How a Bill Becomes a Law */
'u5-0':'Here\'s the journey of a bill, start to finish:',
'u5-1':'Anyone can suggest a law, even the President, but **only a member of Congress** can officially **introduce a bill**.',
'u5-2':'Thousands of bills are introduced each Congress, but only a few get a vote. **Committees and chamber leaders decide which bills move, and most are never taken up.** That gatekeeping is where much of Congress\'s real power sits.',
'u5-3':'Bills get labels. **"H.R."** means it started in **the House of Representatives**. Senate bills start with **"S."**',
'u5-4':'The Constitution (Article I, Section 7) says **bills that raise taxes (revenue bills) must start in the House**, the chamber closest to the voters.',
'u5-5':'After it\'s introduced, a bill usually goes **to a committee** first: a small group of members who specialize in that topic.',
'u5-6':'When a committee edits a bill line by line, that\'s called a **markup**.',
'u5-7':'Reality check: **most bills never become law**. The large majority die, usually in committee. Only a few percent are enacted.',
'u5-8':'In the House, the powerful **Rules Committee** decides **how long a bill is debated and whether it can be amended**.',
'u5-9':'If the House and Senate pass different versions, they can form a **conference committee** to work out one compromise version.',
'u5-10':'Before it goes to the President, a bill must pass both chambers in **identical** form, word for word.',
'u5-11':'**When the President signs a bill, it becomes law.**',
'u5-12':'An override needs **two-thirds of both chambers**. In a full Senate that\'s **67**. At **66**, the veto stands, even though the House cleared the bar.',
'u5-13':'Sneaky move: if **Congress adjourns** and the President doesn\'t sign within 10 days, the bill dies. That\'s a **pocket veto**.',
'u5-14':'But if **Congress is still in session** and the President ignores a bill for 10 days (not counting Sundays), **it becomes law without the President\'s signature**.',
'u5-15':'Four key terms from the lawmaking process:',
/* u6 The President */
'u6-0':'To be President you must be at least **35** years old.',
'u6-1':'The President must be a **"natural born Citizen."** So a **naturalized citizen** (born abroad, became a citizen later) **cannot** be President. You also need 14 years living in the U.S.',
'u6-2':'A presidential term is **4 years**.',
'u6-3':'After FDR won four elections, the country passed the **22nd Amendment** (1951), limiting Presidents to **two elected terms**.',
'u6-4':'As **Commander in Chief**, the President **leads the armed forces**. But only Congress can formally declare war.',
'u6-5':'The President negotiates treaties, but **two-thirds of the senators present** must approve them.',
'u6-6':'The **pardon power** lets the President **forgive someone for a federal crime**. It doesn\'t cover state crimes.',
'u6-7':'Every year the President reports to Congress in the **State of the Union** address.',
'u6-8':'The **Cabinet** is the President\'s top team: **the heads of the executive departments, plus the Vice President**.',
'u6-9':'There are **15 executive departments**, from State and Treasury to Veterans Affairs and Homeland Security.',
'u6-10':'The big four Cabinet jobs and what they handle:',
'u6-11':'If the President dies, resigns, or is removed, **the Vice President** becomes President.',
'u6-12':'After the VP, next in line is **the Speaker of the House**, then the Senate\'s president pro tempore.',
'u6-13':'An **executive order** is **a directive from the President on how to run the executive branch**. It has force, but only within the law.',
'u6-14':'Key limit: **an executive order can never override the Constitution** or a valid law. Courts can strike orders down.',
'u6-15':'Voters don\'t elect the President directly. **The Electoral College** formally does: you vote for electors, and they cast the official votes.',
/* u7 The Judicial Branch */
'u7-0':'The federal court ladder, bottom to top:',
'u7-1':'The Supreme Court has **9 justices**: one Chief Justice and eight associate justices.',
'u7-2':'That number isn\'t in the Constitution. **Congress decides by law** how many justices there are. It\'s been 9 since 1869.',
'u7-3':'Federal judges serve **for life, during good behavior**, so they can rule without worrying about reelection.',
'u7-4':'**The President nominates federal judges**, and the Senate confirms them.',
'u7-5':'The Supreme Court picks its cases. To take one, it grants a **writ of certiorari** ("cert" for short).',
'u7-6':'The **rule of four**: **four** of the nine justices must agree to hear a case.',
'u7-7':'Federal courts only decide **real cases** between real parties. **No advisory opinions**: the Supreme Court can\'t give advice on a law before someone brings a case.',
'u7-8':'Justices who disagree with the majority can write a **dissenting opinion**. Some old dissents later became the law.',
'u7-9':'A justice who **agrees with the outcome but for different reasons** writes a **concurring opinion**.',
'u7-10':'**Original jurisdiction** means a court **hears the case first**, like a trial.',
'u7-11':'**Appellate jurisdiction** means reviewing a lower court\'s decision. **Most** Supreme Court cases arrive this way.',
'u7-12':'Two kinds of cases: criminal (the government prosecutes a crime) and **civil**, like **one person suing another over a broken contract**.',
'u7-13':'Federal courts get the headlines, but **most court cases in the U.S. are heard in state courts**.',
'u7-14':'Outsiders can weigh in too. A brief from a group that isn\'t a party to the case is an **amicus curiae** ("friend of the court") **brief**.',
'u7-15':'The Supreme Court\'s leader is the **Chief Justice of the United States**.',
/* u8 The Bill of Rights */
'u8-0':'Why add a Bill of Rights? **To win over Anti-Federalists who feared a too-powerful national government.** Several states agreed to ratify only if rights were added.',
'u8-1':'**James Madison** again! He **drafted the amendments** that became the Bill of Rights.',
'u8-2':'The Bill of Rights was ratified in **1791**.',
'u8-3':'The First Amendment protects five freedoms. Remember **RAPPS**: **Religion, Assembly, Press, Petition, Speech**.',
'u8-4':'Four amendments you\'ll hear about constantly:',
'u8-5':'The **3rd Amendment** protects you from **being forced to house soldiers in your home**. The British used to do this.',
'u8-6':'"I plead the Fifth" means using your **5th Amendment** right to **not be a witness against yourself**.',
'u8-7':'The 5th Amendment also bans **double jeopardy**: once you\'re **acquitted**, you **can\'t be tried again** for the same crime.',
'u8-8':'Government can take private property for public use (like a highway), but the 5th Amendment says it must pay **just compensation**.',
'u8-9':'The **6th Amendment** guarantees criminal defendants **a lawyer and a speedy, public trial** by jury.',
'u8-10':'Police generally need a **warrant** to search your home because of the **4th Amendment**: no unreasonable searches and seizures.',
'u8-11':'The **7th Amendment** guarantees a jury trial in **many civil cases** (lawsuits over money).',
'u8-12':'The **8th Amendment** bans **excessive bail**, excessive fines, and cruel and unusual punishment.',
'u8-13':'The **9th Amendment** says **listing some rights doesn\'t deny people other rights**. The list isn\'t the whole story.',
'u8-14':'The **10th Amendment** says powers not given to the federal government are reserved **to the states or the people**.',
'u8-15':'Twist: **the Bill of Rights originally limited only the federal government, not the states**. After the 14th Amendment (1868), courts applied most of it to states, a process called **incorporation**.',
/* u25 Forms of Government */
'u25-0':'In a **democracy**, power comes from **the people, through elections**. The U.S. is a democratic republic: people elect representatives.',
'u25-1':'A **constitutional monarchy** has **a king or queen, but an elected parliament makes the laws**. The United Kingdom, Japan, and Sweden work this way.',
'u25-2':'When a **small group of wealthy or powerful people** holds control, that\'s an **oligarchy**. The word comes from Greek for "rule by the few."',
'u25-3':'In an **authoritarian** government, **one leader or party holds power and limits people\'s freedoms**: elections, if any, aren\'t free or fair.',
'u25-4':'**Capitalism** is an economic system where **people and businesses own property and trade in markets**. Prices come from supply and demand.',
'u25-5':'Classic **socialism** means **social ownership of the major industries**: workers or the public own and democratically run them, instead of private owners. That differs from **social democracy** (Nordic countries): private markets plus a big welfare state paid for by taxes. **Democratic socialists**, like DSA, want socialism reached through elections and organizing, not revolution.',
'u25-6':'**Karl Marx and Friedrich Engels** wrote **The Communist Manifesto** in **1848**. Communism aims for a classless society with shared ownership. In practice, as in the Soviet Union, China, and Cuba, it has meant one-party states.',
'u25-7':'The U.S. has a **mixed economy**: mostly **private markets**, plus government programs like **Social Security and Medicare**. Almost every country mixes the two.',
'u25-8':'**Fascism** combines **extreme nationalism** with **a dictator who crushes opposition**, bans other parties, and controls the press.',
'u25-9':'**Benito Mussolini** founded fascism in **Italy** in the 1920s. Adolf Hitler\'s Nazi Germany was a fascist state too.',
'u25-10':'A **totalitarian** government tries to **control nearly every part of public and private life**: work, school, media, even what people believe.',
'u25-11':'The U.S. guards against dictatorship with **limited powers, checks and balances, and the Bill of Rights**, plus regular free elections.',
/* u26 The Parties Today */
'u26-0':'Third parties lose mainly because of **winner-take-all, single-member districts**. **Proportional representation**, where several members are elected per district by vote share, would let a party with 15% win about 15% of seats. Fusion voting and ranked-choice voting help too, but less.',
'u26-1':'For a century after the Civil War, the **South** voted Democratic. After the **Civil Rights Act (1964)** and the Republicans\' "**Southern strategy**," white Southern voters shifted, and the South became the GOP\'s base.',
'u26-2':'The **Republican Party** was founded in **1854** to **stop slavery from spreading into new territories**. Abraham Lincoln was its first president.',
'u26-3':'A **platform** is **a statement of the party\'s positions, adopted at its national convention** every four years. Each position is called a "plank."',
'u26-4':'**Democrats** generally favor **a larger government role in health care**, such as expanding the Affordable Care Act, plus stronger climate action.',
'u26-5':'**Republicans** generally favor **lower taxes, fewer business regulations, and stricter immigration enforcement**.',
'u26-6':'On abortion, **Republicans generally support restrictions**, like a six-week ban, and **Democrats generally support abortion rights**. Since **Dobbs** (2022), states decide most abortion law.',
'u26-7':'Neither party is one bloc. Democrats include **progressives and moderates**. Republicans include **populists and traditional conservatives**. Factions fight over the platform and in primaries.',
'u26-8':'The **Libertarian Party** wants **minimal government in both the economy and personal life**: low taxes and few regulations, but also fewer limits on personal choices.',
'u26-9':'The **Green Party** focuses on **the environment, social justice, and grassroots democracy**.',
'u26-10':'The **Working Families Party** is progressive. In New York it uses **fusion voting**: **it endorses candidates who also run on another party\'s line**, so votes on its line count for them.',
'u26-11':'Polls by Gallup find **more Americans call themselves independents than identify with either party**, usually around 4 in 10. Many independents still lean toward one side.',
/* u27 More Landmark Cases */
'u27-0':'**Buckley v. Valeo** (1976) split the difference. **Limits on contributions** to candidates are allowed, because big gifts risk corruption. **Limits on spending** are not, because spending money to spread a message is protected speech. That split still shapes every campaign.',
'u27-1':'**Citizens United v. FEC** (2010), 5-4: **the government can\'t ban independent political spending by corporations and unions**. Supporters call it a free speech win. Critics say it lets big money flood elections.',
'u27-2':'After Citizens United, a lower court allowed **super PACs**: groups that **can raise and spend unlimited money on elections, as long as they don\'t coordinate with candidates**.',
'u27-3':'Common myth: Citizens United did **not** allow direct corporate donations to federal candidates. Those are still banned. It covers **independent** spending, like ads a group runs on its own.',
'u27-4':'**Loving v. Virginia** (1967): **states can\'t ban interracial marriage**. Mildred and Richard Loving had been sentenced to jail for marrying.',
'u27-5':'**New York Times v. Sullivan** (1964): to win a libel suit, a public official must prove **"actual malice"**: that **the publisher knew it was false or recklessly ignored the truth**. It protects reporting on officials.',
'u27-6':'**D.C. v. Heller** (2008), 5-4: **the Second Amendment protects an individual right to own a gun for self-defense**, not only for militia service.',
'u27-7':'**Students for Fair Admissions v. Harvard** (2023): **race-conscious college admissions violate the Constitution\'s equal protection guarantee**. It ended affirmative action in college admissions.',
'u27-8':'**Bush v. Gore** (2000), 5-4: the Court **stopped the Florida recount, which left George W. Bush the winner** of Florida and the presidency.',
'u27-9':'**Shelby County v. Holder** (2013) struck down **the formula deciding which places needed federal approval to change voting rules** under the Voting Rights Act. Those places no longer need approval.',
'u27-10':'**Rucho v. Common Cause** (2019): partisan gerrymandering claims **can\'t be decided by federal courts**, which **leaves them to states and Congress**. That\'s why fights like Utah\'s Prop 4 case happen in state courts.',
'u27-11':'**Trump v. United States** (2024) set three tiers. **Core constitutional powers** (like pardons): **absolute immunity**. **Other official acts**: **presumed immunity**, which prosecutors must overcome. **Unofficial acts**: **no immunity**.',
/* ut1 Salt Lake City & County */
'ut1-0':'Salt Lake City has a **strong mayor–council** government. The mayor runs city departments, and the council passes laws and the budget.',
'ut1-1':'The **Salt Lake City Council** has **7 members**, and **each is elected from a district**. There are no citywide seats.',
'ut1-2':'Salt Lake City races are **nonpartisan**: no party labels on the ballot, like Seattle and unlike New York.',
'ut1-3':'City elections happen in **odd-numbered years**, like 2025 and 2027, separate from state and federal races.',
'ut1-4':'Salt Lake City uses **ranked-choice voting** in city races. You rank candidates in order of preference.',
'ut1-5':'The council members choose a **chair** each year to lead meetings. The mayor is not part of the council.',
'ut1-6':'The mayor of Salt Lake City serves a **4-year term**. So do council members.',
'ut1-7':'**Salt Lake County** is led by an elected **county mayor** and a **9-member county council**.',
'ut1-8':'In Utah, counties run elections. For Salt Lake County voters, that\'s the **Salt Lake County Clerk**. Utah votes mostly by mail.',
'ut1-9':'Felony cases in the county are prosecuted by the **Salt Lake County District Attorney**, an elected office.',
'ut1-10':'Buses, **TRAX** light rail, and FrontRunner trains are run by **UTA, the Utah Transit Authority**, a regional agency, not the city.',
'ut1-11':'Remember: the **Salt Lake County Council** has **9 members**, more than the city\'s 7.',
/* ut2 Utah State Government */
'ut2-0':'The **Utah State Senate** has **29 members**.',
'ut2-1':'The **Utah House of Representatives** has **75 members**.',
'ut2-2':'Utah **senators serve 4-year terms** and **House members serve 2-year terms**.',
'ut2-3':'The Legislature\'s general session is short: **45 days, starting in January**. Lawmakers are part-time.',
'ut2-4':'The Legislature meets at the **State Capitol in Salt Lake City**, on the hill above downtown.',
'ut2-5':'Utah\'s **governor** serves **4-year terms**.',
'ut2-6':'Utah has **citizen initiatives**: voters can gather signatures to put **their own laws on the ballot**. They can also challenge new laws by **referendum**.',
'ut2-7':'To amend the Utah Constitution, a proposal must **pass both chambers by two-thirds, then win a statewide vote**.',
'ut2-8':'In 2018 voters passed **Prop 4**, which **created an independent redistricting commission and banned partisan gerrymandering**. Lawmakers replaced it in 2020, and courts later sided with the voters.',
'ut2-9':'In **November 2025**, a judge **picked a new congressional map that includes a district based in Salt Lake County**. It was used for the 2026 election.',
/* ut3 Running for Office in Utah */
'ut3-0':'To reach a party primary ballot in Utah, a candidate can **win enough support at the party convention, gather signatures, or both**.',
'ut3-1':'The signature path came from **SB54**, a **2014** law known as the **"Count My Vote" compromise**.',
'ut3-2':'Every election year, parties hold neighborhood **caucus meetings**. Members elect **delegates to the party convention** and **precinct leaders**.',
'ut3-3':'Myth: you don\'t have to win the convention. Candidates can **skip it by gathering signatures**.',
'ut3-4':'Utah\'s **Republican primary** is **closed**: **only registered Republicans** can vote in it.',
'ut3-5':'Utah\'s **Democratic primary** is **open to any registered voter**.',
'ut3-6':'Utah has **no limit** on how much one person can give to a state candidate. Donations **must be disclosed** publicly.',
'ut3-7':'Ranked-choice counting: if no one has a majority, **the last-place candidate is cut and their votes move to those voters\' next choices**. Repeat until someone wins.',
'ut3-8':'In 2025, **Chris Wharton** won Salt Lake City Council District 3 in **the third round** of ranked-choice counting.',
'ut3-9':'Salt Lake City\'s **community councils** are **volunteer neighborhood groups that give the city input**. Showing up is a great first step into local politics.',

'ut4-4':'Utah\'s lieutenant governor is **Deidre Henderson**.',
'ut4-5':'In Utah, the lieutenant governor\'s office **oversees elections**, including certifying results and ballot measures.',
'ut4-6':'Utah\'s attorney general is **Derek Brown**, elected in 2024.',
'ut4-7':'The **Utah State Senate** is led by President **Stuart Adams**.',
'ut4-8':'The **Utah House** is led by Speaker **Mike Schultz**.',
'ut4-9':'Utah\'s two U.S. senators are **Mike Lee** and **John Curtis**.',
'ut4-10':'Democrat **Ben McAdams** won the new **1st Congressional District**, based in Salt Lake County, in November 2026. He takes office in January 2027.',
'ut4-11':'Neither Senate seat was up in 2026: **Mike Lee\'s term runs to 2029** and **John Curtis\'s to 2031**.',
/* ut5 On Your Ballot: Utah */
'ut5-0':'Utah\'s 2026 **Amendment B** would have **required 60% of the vote to pass citizen initiatives that raise taxes**, instead of a simple majority.',
'ut5-1':'Amendment B **failed**, with about **62% voting no** in unofficial results.',
'ut5-2':'For comparison: Utah\'s 2018 **Medicaid expansion** initiative passed with about **53%**, which is **less than 60%**.',
'ut5-4':'**Amendment A** means **proposed constitutional amendments no longer have to be published in newspapers**. Lawmakers set how instead. It passed with about 60%.',
'ut5-5':'In 2025, **HB 267** **banned collective bargaining for public-sector unions**, like teachers, police, and firefighters.',
'ut5-6':'Opponents gathered **more than 320,000 signatures** for a referendum, so lawmakers **repealed HB 267 in December 2025** rather than face a vote.',
'ut5-8':'In November 2026, Salt Lake County voters approved a **$128 million bond for parks and recreation**.',
'ut5-9':'The recreation bond passed with **about 61%** yes. It replaces an older bond that is ending.',
'ut5-10':'Both amendments grew out of the Legislature\'s fight with **citizen initiatives**, especially after **courts enforced Prop 4**, the anti-gerrymandering initiative.',
/* n1 New York City Government */
'n1-0':'The **New York City Council** has **51 members**, one for each Council district. That\'s far bigger than Seattle\'s 9.',
'n1-1':'The Council is led by the **Speaker**, who is **elected by the council members** themselves. The Speaker controls committees and which bills come up for a vote.',
'n1-2':'NYC has a **strong mayor**. The mayor **runs city agencies, proposes the budget, and can veto Council bills**. The Council can override a veto with a two-thirds vote.',
'n1-3':'Surprise: the mayor does **not** run the subway. Subways and buses belong to the **MTA**, which is **controlled by New York State**.',
'n1-4':'The **Public Advocate** is a **citywide watchdog** who takes complaints about city services. If the mayor can\'t serve, the Public Advocate is **first in line**.',
'n1-5':'The **Comptroller** is the city\'s money watchdog. They **audit city agencies and manage the city\'s pension funds**.',
'n1-6':'The Public Advocate sits on the Council in a special way: they **can introduce bills but cannot vote** on them.',
'n1-7':'NYC has **5 boroughs**: Manhattan, Brooklyn, Queens, the Bronx, and Staten Island. Each elects a **Borough President**.',
'n1-8':'Community board members are **appointed by the Borough President**. Half of them are **nominated by the local Council members**.',
'n1-9':'Community board votes in land use review (**ULURP**) are **advisory**. The **City Planning Commission** and the **City Council** make the binding decisions. Boards still matter: they shape the debate early.',
'n1-10':'Community boards don\'t pass laws. They **advise on land use, zoning, and local budget needs**. Their votes on new buildings carry weight.',
'n1-11':'Each borough is also a county, and each elects its own **District Attorney**, who **prosecutes crimes**. Manhattan\'s DA is the New York County DA.',
/* n2 New York State Government */
'n2-0':'The **New York State Senate** has **63 members**.',
'n2-1':'The **New York State Assembly** has **150 members**. Together the Senate and Assembly make the **Legislature**.',
'n2-2':'All New York legislators serve **2-year terms**, in both the Senate and the Assembly. They\'re all on the ballot every even year.',
'n2-3':'The Legislature meets in **Albany**, the state capital, not in New York City.',
'n2-4':'New York\'s fiscal year starts **April 1**, so that\'s the deadline for the state budget. It\'s often late.',
'n2-5':'The **governor** serves **4-year terms**.',
'n2-6':'Confusing names: New York\'s highest court is the **Court of Appeals**. The "Supreme Court" in New York is actually a **trial court**.',
'n2-7':'Unlike Washington, New York has **no citizen initiatives**. Voters can\'t gather signatures to put their own laws on the ballot.',
'n2-8':'To change the state constitution, an amendment must **pass two separately elected Legislatures**, then **win a statewide vote**.',
'n2-9':'The **MTA**, which runs the subways, is controlled by **New York State**. The governor appoints its leader, so subway fights often happen in Albany.',
/* n3 Running for Office in NYC */
'n3-0':'NYC elections are **partisan**. Candidates run on **party lines**, like Democrat or Working Families. Seattle\'s city races are nonpartisan.',
'n3-1':'New York has **closed primaries**: **only voters enrolled in that party** can vote in its primary. In a Democratic city, the June primary often decides the winner.',
'n3-2':'In city primaries, voters can **rank up to 5 candidates** in order of preference.',
'n3-3':'Voters approved ranked-choice voting in 2019, and the city first used it in the **2021 primary**.',
'n3-4':'NYC\'s matching funds program matches small donations from city residents **$8 for every $1**. A $10 gift becomes $90.',
'n3-5':'For City Council races, **the first $175** of each city resident\'s donation is matched. That\'s up to $1,400 in public money per donor.',
'n3-6':'To qualify, a Council candidate must raise **$5,000 from at least 75 residents of their district**. It proves real local support.',
'n3-7':'To get on a party primary ballot, candidates **collect signatures on designating petitions** from party members in their district.',
'n3-8':'A common first step into local politics: **community boards**. Members are **appointed by the Borough President**, so you apply rather than run.',
'n3-9':'The most local elected party post is **county committee member**. Each one represents a small election district, often just a few blocks.',

/* u9 Federalism */
'u9-0':'**Federalism** means **power is divided between the national and state governments**. (Splitting power among the three branches is a different idea: separation of powers.)',
'u9-1':'Three ways to arrange national and local power:',
'u9-2':'Powers the Constitution gives the federal government are **enumerated (delegated) powers**. Example: **coining money**. States can\'t print their own dollars.',
'u9-3':'Powers kept by the states are **reserved powers**, like **running elections and creating local governments** (cities, counties, school districts).',
'u9-4':'Some powers belong to both levels, like taxing and building roads. Those are **concurrent powers**.',
'u9-5':'Sorting practice: who holds each power?',
'u9-6':'The **Supremacy Clause** (Article VI) says the **Constitution, federal laws made under it, and treaties** are the supreme law of the land. State judges must follow them over state law.',
'u9-7':'So **when a valid federal law conflicts with a state law, the federal law wins**. Key word: valid. It has to be within Congress\'s powers.',
'u9-8':'The **Necessary and Proper Clause** lets Congress make laws needed to carry out its listed powers. It stretches, so it\'s nicknamed the **Elastic Clause**.',
'u9-9':'Landmark: **McCulloch v. Maryland (1819)** decided that **Congress could create a national bank and states couldn\'t tax it**. "The power to tax involves the power to destroy."',
'u9-10':'In **cooperative federalism**, levels of government mix together on programs like highways and Medicaid. It\'s nicknamed **"marble cake"** federalism, versus the separate layers of "layer cake."',
'u9-11':'Federal money comes with strings. A grant with **strict rules on how the money must be spent** is a **categorical grant**. (A looser one is a block grant.)',
'u9-12':'When Washington D.C. orders states to do something but sends no money, that\'s an **unfunded mandate**.',
'u9-13':'**U.S. v. Lopez (1995)** **limited Congress\'s use of the Commerce Clause** for the first time in decades. Carrying a gun near a school wasn\'t economic activity, so Congress couldn\'t ban it that way.',
/* u10 The House Up Close */
'u10-0':'The **Speaker of the House** is **elected by the members of the House**, which in practice means the majority party picks.',
'u10-1':'Odd fact: **the Constitution doesn\'t require the Speaker to be a House member**. Every Speaker so far has been one, though.',
'u10-2':'Each party has a **whip** who **counts votes and makes sure members show up**. The name comes from the "whipper-in" in fox hunting who kept the hounds together.',
'u10-3':'The House **Ways and Means** Committee **writes tax laws**. It\'s one of the most powerful committees.',
'u10-4':'**Appropriations** Committees in each chamber decide **how federal money is spent**.',
'u10-5':'The Rules Committee can give a bill a **closed rule**, meaning **no amendments can be offered on the floor**. An open rule allows them.',
'u10-6':'Members can force a stuck bill out of committee with a **discharge petition**. It needs **218** signatures, a majority of the 435-member House.',
'u10-7':'In impeachment, **the House brings charges (impeaches) by majority vote**. Think of it as the indictment. The Senate holds the trial.',
'u10-8':'If no one gets 270 electoral votes, the House picks the President, but **each state delegation casts one vote**. Wyoming counts the same as California.',
'u10-9':'After each census, the 435 seats are redivided among states. That\'s **reapportionment**.',
'u10-10':'Drawing district lines to give one party an unfair advantage is **gerrymandering**, named after Gov. Elbridge Gerry and a salamander-shaped district.',
'u10-11':'Two gerrymandering tricks:',
'u10-12':'**One person, one vote** requires districts to have **roughly equal populations**, so every vote weighs about the same. It comes from 1960s cases like Baker v. Carr and Reynolds v. Sims.',
'u10-13':'The House has **435** voting members (plus non-voting delegates from D.C. and the territories).',
/* u11 The Senate Up Close */
'u11-0':'The **President pro tempore** runs the Senate when the VP is away. By tradition, it\'s **the longest-serving senator of the majority party**.',
'u11-1':'The real power in the Senate is the **Senate Majority Leader**, who controls **which bills reach the floor**.',
'u11-2':'**"Advice and consent"** is the Senate\'s power to **confirm appointments and approve treaties**.',
'u11-3':'A treaty needs **two-thirds of senators present**, which is hard. So presidents make most international deals as **executive agreements**, which skip the Senate. The catch: a later president can undo them more easily, as with the Paris climate agreement.',
'u11-4':'After the House impeaches, the Senate needs **a two-thirds vote** to **convict and remove** the official. That\'s why removal is so rare.',
'u11-5':'When a President is impeached, **the Chief Justice of the United States** presides over the Senate trial.',
'u11-6':'A **filibuster** is **using extended debate to delay or block a vote**. Today a senator rarely has to keep talking; just threatening one works.',
'u11-7':'To end a filibuster, the Senate votes for **cloture**, which takes **60** votes on most bills.',
'u11-8':'In 2013 and 2017, the Senate used the **"nuclear option"** to change its rules so that **nominations need only a simple majority to end debate**.',
'u11-9':'Before the **17th Amendment (1913)**, **state legislatures** chose U.S. senators. Now voters elect them directly.',
'u11-10':'Any **single senator** can place a **"hold"** to signal they object to taking up a bill or nomination. It\'s a powerful delay tool.',
'u11-11':'Much Senate business moves by **unanimous consent**: **it goes forward unless any senator objects**.',
'u11-12':'House powers vs. Senate powers:',
'u11-13':'Confirming a Cabinet secretary takes only a **simple majority**. Two-thirds is for treaties and impeachment convictions.',
/* u12 Checks & Balances in Action */
'u12-0':'Checks and balances aren\'t just theory. Four real clashes, four different checks:',
'u12-1':'Judicial review was established in **Marbury v. Madison (1803)**, the most famous case in U.S. history.',
'u12-2':'Chief Justice **John Marshall** ruled that **Marbury** deserved his job but the Court couldn\'t order it, because the law giving it that power was unconstitutional. Jefferson\'s side won the case, so there was nothing to defy, but the Court **claimed judicial review** for good.',
'u12-3':'Plot twist: **the words "judicial review" don\'t appear in the Constitution**. The Court claimed the power in Marbury.',
'u12-4':'When Congress holds hearings to see how agencies carry out laws, that\'s **oversight**.',
'u12-5':'The President checks the courts **by nominating judges**, shaping the bench for decades.',
'u12-6':'Congress checks the courts by **confirming or rejecting judges, impeaching judges, and proposing amendments** to override rulings. (It can\'t cut judges\' pay.)',
'u12-7':'After Vietnam, Congress passed the **War Powers Resolution (1973)**: the President must **notify Congress within 48 hours of sending troops into combat**.',
'u12-8':'In **United States v. Nixon (1974)**, the Court ruled **executive privilege isn\'t absolute**. Nixon had to hand over the Watergate tapes, and he resigned soon after.',
'u12-9':'Overriding a veto is **hard and rare**, because it takes two-thirds of both chambers.',
'u12-10':'Courts check the President by **ruling that an executive action is unconstitutional**.',
'u12-11':'Impeachment and removal, step by step:',
'u12-12':'The whole point of checks and balances: **to keep any branch from abusing power**.',
'u12-13':'If Congress wants to stop a program the President likes, it can defund it with **the power of the purse**.',
/* u13 Amendments 11–27 */
'u13-0':'The amendments that remade America after the Civil War and beyond:',
'u13-1':'The 14th Amendment\'s **Citizenship Clause**: all persons **born or naturalized in the U.S.**, and subject to its jurisdiction, are **citizens of the U.S. and of their state**. It overturned **Dred Scott** (1857), which said Black Americans could not be citizens. Birthright citizenship is being fought over in court again today.',
'u13-2':'The **14th Amendment\'s Equal Protection Clause** says states can\'t **deny any person equal protection of the laws**. It\'s behind many civil rights rulings.',
'u13-3':'The **16th Amendment** (1913) allowed a **federal income tax**.',
'u13-4':'The **21st Amendment** is the **only one that repealed another**: it ended Prohibition in 1933.',
'u13-5':'Prohibition came from the **18th Amendment** (1919), which banned **making and selling alcohol**.',
'u13-6':'Before the **20th Amendment** (1933), a president elected in November waited until **March**, while the loser kept power for four months. During the Depression that **lame duck** gap was painful. Now terms start **January 20** (president) and **January 3** (Congress).',
'u13-7':'The **25th Amendment** deals with **presidential succession and disability**, including what happens if a President can\'t do the job.',
'u13-8':'During Vietnam, people said "old enough to fight, old enough to vote." The **26th Amendment** (1971) lowered the voting age to **18**.',
'u13-9':'The **27th Amendment** (congressional pay raises) was first proposed in **1789** by Madison and finally ratified in 1992. A college student\'s paper revived it.',
'u13-10':'The **Equal Rights Amendment** passed Congress in **1972** but **wasn\'t ratified by enough states before its deadline**.',
'u13-11':'Congress has sent **33** amendments to the states. Only **27** were ratified.',
'u13-12':'Four amendments that quietly reshaped government. Match each one:',
'u13-13':'In 1793 the Supreme Court let a South Carolina man sue Georgia. States panicked, and the **11th Amendment** (1795) barred federal suits against a state by **citizens of another state or a foreign country**. It\'s the root of **state sovereign immunity**.',
/* u14 Elections & Parties */
'u14-0':'To win the presidency you need **270** electoral votes, a majority of 538.',
'u14-1':'There are **538** electors: 435 (House) + 100 (Senate) + 3 (D.C.).',
'u14-2':'A state\'s electors = **its House seats plus 2 for its senators**. Washington has 10 + 2 = 12.',
'u14-3':'Almost every state is winner-take-all. **Maine and Nebraska** are the two that can split their electoral votes by district.',
'u14-4':'The **23rd Amendment** (1961) gave **Washington, D.C.** three electoral votes.',
'u14-5':'Yes, **a candidate can win the national popular vote and still lose the Electoral College**. It happened in 1876, 1888, 2000, and 2016.',
'u14-6':'A **closed primary** lets **only registered party members** vote. Open primaries let anyone vote. (Washington uses a "top two" primary.)',
'u14-7':'A **caucus** is **a meeting where party members discuss and pick candidates**, instead of a simple ballot.',
'u14-8':'Why do third parties rarely win? **Winner-take-all, single-member districts favor two big parties**. Political scientists call this Duverger\'s law.',
'u14-9':'Four amendments that expanded the vote:',
'u14-10':'The **Voting Rights Act of 1965** **banned literacy tests and protected minority voters**, especially in the South.',
'u14-11':'By 1919 women could vote in many Western states (Washington since **1910**), but much of the country refused. Only a **constitutional amendment** could cover **every state at once**. The **19th Amendment** was ratified in **1920**.',
'u14-12':'The **Constitution never mentions political parties**. It certainly didn\'t create the Democrats and Republicans. Washington even warned against parties.',
'u14-13':'Party nominees for President are officially chosen at **national conventions**, after the primaries and caucuses.',
/* u15 Landmark Supreme Court Cases */
'u15-0':'Four cases every American should know:',
'u15-1':'**Plessy v. Ferguson (1896)** allowed **"separate but equal"** segregation. It was a disaster for civil rights for 58 years.',
'u15-2':'**Brown v. Board of Education** (1954) overturned Plessy: separate schools are inherently unequal.',

/* u16 Political Theory */
'u16-0':'**Thomas Hobbes** (Leviathan, 1651) argued that without government, life would be **"solitary, poor, nasty, brutish, and short."** So people accept a strong ruler for safety.',
'u16-1':'**John Locke** was more hopeful. His natural rights were **life, liberty, and property**. Jefferson remixed them into "life, liberty, and the pursuit of happiness."',
'u16-2':'**Jean-Jacques Rousseau** said legitimate government follows the **general will**: what the community as a whole wants for the common good.',
'u16-3':'**Montesquieu**\'s book **"The Spirit of the Laws"** (1748) shaped the idea of **separation of powers**. The Framers quoted him constantly.',
'u16-4':'The four Federalist Papers professors love most:',
'u16-5':'The **Federalist Papers** (85 essays, 1787–88) were written by **Alexander Hamilton, James Madison, and John Jay** under the pen name "Publius" to sell the Constitution.',
'u16-6':'Madison\'s most famous line, from Federalist No. 51: **"If men were angels, no government would be necessary."**',
'u16-7':'In **Federalist No. 10**, Madison defines a **faction** as **a group united by an interest against others\' rights or the common good**. His cure: a large republic with many competing factions.',
'u16-8':'The **Anti-Federalists** feared a strong central government. Their **biggest demand: a bill of rights**. They got it in 1791.',
'u16-9':'In Federalist No. 78, **Hamilton** called the judiciary the **"least dangerous" branch** because it has **neither the sword nor the purse**, only judgment.',
/* u17 Congressional Procedure */
'u17-0':'**Suspension of the rules** is the House fast lane: a bill needs **a two-thirds vote, with limited debate and no amendments**. It\'s used for popular, low-conflict bills.',
'u17-1':'Two steps for spending: **authorization creates a program; appropriation funds it**. A program can exist on paper with no money.',
'u17-2':'If spending bills aren\'t passed on time, Congress can avoid a shutdown with a **continuing resolution** (CR), which keeps funding at current levels.',
'u17-3':'**Budget reconciliation** is powerful in the Senate because **it can\'t be filibustered, so it can pass with a simple majority**. Big tax and spending laws often use it.',
'u17-4':'Reconciliation has a limit: the **Byrd rule** blocks provisions that are **"extraneous,"** meaning not mainly about spending or revenue.',
'u17-5':'The nonpartisan **Congressional Budget Office (CBO)** estimates what bills will cost. (OMB is the President\'s budget office; GAO audits spending.)',
'u17-6':'An unrelated amendment attached to a bill is a **rider**. Riders often hitch onto must-pass spending bills.',
'u17-7':'The Senate Majority Leader can **"fill the amendment tree"**, using up every open amendment slot to **block other senators from offering amendments**.',
'u17-8':'To move faster, the House turns itself into the **Committee of the Whole**, which can do business with a **quorum of just 100 members** instead of 218.',
'u17-9':'Congress normally aims to pass **12** regular appropriations bills each year, one per appropriations subcommittee.',
/* u18 Presidency & Bureaucracy */
'u18-0':'Richard **Neustadt** (Presidential Power, 1960) argued that **presidential power is the power to persuade**. Orders alone rarely work.',
'u18-1':'**Theodore Roosevelt** called the presidency a **"bully pulpit"**, a great platform for shaping public opinion. ("Bully" meant "excellent.")',
'u18-2':'When signing a bill, a President may issue a **signing statement** explaining how they\'ll interpret or enforce it.',
'u18-3':'The **unitary executive theory** holds that **the President controls the entire executive branch**, including the power to fire officials.',
'u18-4':'Some agencies are built to be insulated from the President: **independent regulatory agencies**, like the **Securities and Exchange Commission (SEC)**.',
'u18-5':'An **iron triangle** is a cozy, stable relationship between **agencies, congressional committees, and interest groups** in one policy area.',
'u18-6':'Agencies make rules through **notice and comment** under the **Administrative Procedure Act (1946)**: propose a rule, take public comments, then finalize.',
'u18-7':'Proposed and final federal regulations are published in the **Federal Register**, the government\'s daily journal. Anyone can comment.',
'u18-8':'In **Loper Bright v. Raimondo (2024)**, the Supreme Court **overruled Chevron deference**. Courts no longer defer to agencies\' readings of unclear statutes.',
'u18-9':'After a frustrated job seeker assassinated President Garfield, the **Pendleton Act (1883)** began replacing the **spoils system** with a **merit-based civil service**.',
/* u19 Opinion, Voting & Parties */
'u19-0':'How do people get their political views? Through family, school, friends, and media. Scholars call it **political socialization**.',
'u19-1':'The **strongest single predictor** of how Americans vote is **party identification**. It often starts in childhood and rarely changes.',
'u19-2':'The **median voter theorem**: in two-party races on one issue dimension, candidates **move toward the center** to win the middle voter.',
'u19-3':'**Anthony Downs** (1957) said studying policy costs time and one vote rarely matters, so it\'s **rational to stay ignorant** and lean on **shortcuts** like party labels. That\'s why party ID predicts so much.',
'u19-4':'The **paradox of voting** asks **why people vote when one vote almost never decides an election**. Answers involve civic duty and social pressure.',
'u19-5':'Judging an incumbent by how well they\'ve done ("Are you better off?") is **retrospective voting**. Judging by promises is prospective voting.',
'u19-6':'**Duverger\'s Law**: plurality, single-member district elections tend to produce **a two-party system**.',
'u19-7':'Some elections reshape party loyalties for decades. The **1932** election that built FDR\'s New Deal coalition is a classic **critical (realigning) election**.',
'u19-8':'Disliking and distrusting the other party, beyond disagreeing on issues, is **affective polarization**. It has risen sharply in the U.S.',
'u19-9':'**Proportional representation** systems give seats by vote share, so they **tend to support more than two parties**.',
/* u20 Comparative Politics */
'u20-0':'In a **parliamentary system** (like the UK or Canada), the head of government is usually **a prime minister drawn from the legislature**.',
'u20-1':'Parliaments hold a big weapon: a **vote of no confidence** can **bring down a government**, forcing a new cabinet or an election.',
'u20-2':'**France** has both a powerful elected president and a prime minister. That\'s a **semi-presidential system**.',
'u20-3':'In **proportional representation**, parties win seats **roughly in proportion to their share of the vote**. Win 20% of votes, get about 20% of seats.',
'u20-4':'**Germany and New Zealand** use **mixed-member proportional** (MMP): some seats from districts, the rest topped up to match vote share.',
'u20-5':'**Ranked-choice voting** lets voters **rank candidates in order of preference**. Alaska, Maine, and New York City use it, and Seattle voters approved it in 2022 for city primaries starting in 2027.',
'u20-6':'Arend **Lijphart** contrasted **majoritarian democracies** (winner takes power) with **consensus democracies** (power shared broadly).',
'u20-7':'Juan **Linz** warned about the **"perils of presidentialism"**: **fixed terms and dual legitimacy** (president and legislature both elected) **can cause deadlock and crises**.',
'u20-8':'When the central government holds most power and regions only get delegated authority, the country is **unitary**, like France or Japan.',
'u20-9':'The **United Kingdom has no single written constitution**. Its constitution is **uncodified**: statutes, conventions, and court rulings.',
/* u21 Rational Choice & Game Theory */
'u21-0':'Mancur **Olson** explained why big groups struggle to organize: **members can free-ride on others\' efforts** and still get the benefits. Organizers, take note.',
'u21-1':'Olson\'s fix: **selective incentives**, benefits given **only to members who join**, like insurance or a magazine.',
'u21-2':'In the **prisoner\'s dilemma**, each player\'s rational choice leads to **an outcome worse for both players than cooperating**.',
'u21-3':'Majorities can go in circles: A beats B, B beats C, C beats A. That\'s the **Condorcet paradox**.',
'u21-4':'**Arrow\'s impossibility theorem** shows **no ranked voting rule can meet every fairness condition with 3+ options**.',
'u21-5':'Keith **Krehbiel**\'s pivotal politics: the **filibuster pivot** is **the senator who casts the 60th vote for cloture**. Bills must win them over.',
'u21-6':'Because supermajority pivots can block change, a range of status quo policies stays stuck. That range is the **gridlock interval**.',
'u21-7':'George **Tsebelis**: policy stability increases when **there are more veto players with more distant preferences**. More vetoes, less change.',
'u21-8':'When Congress delegates to an agency but can\'t fully monitor it, that\'s a **principal–agent problem**. The agent may drift from what the principal wants.',
'u21-9':'**Agenda control matters most when majority preferences cycle**, because whoever sets the order of votes can pick the winner.',
/* u22 Congress Scholarship */
'u22-0':'David **Mayhew** (1974) described members of Congress as **"single-minded seekers of reelection."**',
'u22-1':'Mayhew\'s three reelection activities:',
'u22-2':'Richard **Fenno**\'s **"Home Style"** studied **how members present themselves to voters in their districts**. He followed them home.',
'u22-3':'Gary **Cox and Mathew McCubbins** say the majority party acts like a cartel mainly by **controlling the agenda to block bills that would split the party**.',
'u22-4':'The informal **Hastert rule**: the Speaker brings up bills only if **a majority of the majority party supports them**.',
'u22-5':'**Conditional party government** predicts strong party leaders when **members within each party agree and the parties are far apart**.',
'u22-6':'**Path dependence**: **early choices lock in later outcomes**, even when better options appear later.',
'u22-7':'Stephen **Skowronek**\'s "political time": FDR and Reagan swept away a failing old order, so they\'re presidents of **reconstruction**.',
'u22-8':'**DW-NOMINATE** is a method for **measuring legislators\' ideology from roll-call votes**. It\'s how scholars chart polarization.',
'u22-9':'**Historical institutionalism** emphasizes **critical junctures and long-run sequences**: how history shapes institutions.',
/* u23 Constitutional Interpretation */
'u23-0':'Reading the Constitution by **its meaning when it was ratified** is **originalism**. Its rival is "living constitutionalism."',
'u23-1':'The doctrine of following precedent is **stare decisis**, Latin for "to stand by things decided."',
'u23-2':'Courts use three levels of scrutiny when a law treats groups differently:',
'u23-3':'Laws that classify people **by race** get the toughest test: **strict scrutiny**.',
'u23-4':'Laws that classify **by sex** usually get **intermediate scrutiny**.',
'u23-5':'**Footnote four** of Carolene Products (1938) suggested **closer review for laws affecting "discrete and insular minorities" and the political process**. It\'s the seed of tiered scrutiny.',

/* u24 Research Methods */
'u24-0':'A **confounder** is a variable that influences **both** the supposed cause and the effect. Ice cream sales and drownings both rise with summer heat.',
'u24-1':'**Randomized experiments** are the gold standard because **random assignment balances confounders between groups on average**.',
'u24-2':'Comparing candidates who **barely won** with those who **barely lost** is a **regression discontinuity design**. Near the cutoff, winners and losers are nearly identical.',
'u24-3':'**Difference-in-differences** compares changes over time between groups. Its key assumption: **parallel trends** without the treatment.',
'u24-4':'Whether findings apply to other places and times is **external validity**.',
'u24-5':'People overreport voting in surveys because it\'s seen as good. That\'s **social desirability bias**.',
'u24-6':'Tracing the step-by-step causal mechanism within one case is **process tracing**.',
'u24-7':'If wealth causes democracy, a study claiming democracy causes wealth may suffer from **reverse causality**.',
'u24-8':'Classic rule: **correlation, even statistically significant, does not prove causation**.',
'u24-9':'Alan **Gerber and Donald Green** ran randomized experiments on turnout. **Door-to-door canvassing** works best, raising turnout by several points among people reached. Robocalls barely move anyone. Useful to know for your own campaign.',

'w1-0':'Seattle has a **strong mayor–council** government. The **mayor runs the city departments**; the **council makes laws** and passes the budget. (Some cities hire a city manager instead.)',

'w1-2':'Of those 9, **7 are elected by district** and **2 citywide** (Positions 8 and 9). You have three council members: your district rep plus the two citywide ones.',
'w1-3':'Seattle\'s mayor serves a **4-year** term.',
'w1-4':'Seattle city races are **nonpartisan**: no "Democrat" or "Republican" label on the ballot. Candidates still get party and group endorsements.',
'w1-5':'The city doesn\'t run its own elections. **King County Elections** does, for Seattle and every other city in the county.',
'w1-6':'Buses are a county job: **King County Metro** is run by **King County**. Light rail is Sound Transit, a regional agency.',
'w1-7':'The **Port of Seattle** (seaport plus Sea-Tac Airport) is its own government, run by **5 commissioners elected countywide**. It\'s an often overlooked elected office.',
'w1-8':'Washington uses a **top-two primary**: everyone runs on one ballot and **the two highest vote-getters advance, regardless of party**. Two Democrats can face off in November.',
'w1-9':'Seattle\'s **Democracy Voucher** program gives each eligible resident **four $25 vouchers** to give to **qualifying city candidates**. It lets people run without big donors.',
'w1-10':'Seattle voters approved **ranked-choice voting** for city primaries, starting in **2027**.',
'w1-11':'**Washington votes almost entirely by mail.** Ballots arrive about 18 days before Election Day, and you can return them in a drop box.',
/* w2 Washington State Government */
'w2-0':'Like the U.S. Senate, Washington\'s **state Senate** confirms many of the **governor\'s appointments**, from agency directors to university regents. Washington has **49 legislative districts**, each electing one senator.',
'w2-1':'Each district elects **1 state senator and 2 state representatives**. So you have three state legislators.',
'w2-2':'Washington **state senators serve 4-year terms**. State representatives serve 2 years.',
'w2-3':'The Washington Legislature meets in **Olympia**, the state capital.',
'w2-4':'In **odd-numbered years**, when the two-year budget is written, the regular session lasts **105 days**. In even years it\'s a short 60-day session.',
'w2-5':'Washington voters separately elect the Attorney General, Secretary of State, Treasurer, and more. That\'s a **plural executive**: power isn\'t all in the governor\'s hands.',
'w2-6':'Washington\'s governor has a **section veto**: they **can veto individual sections of bills**, not just the whole bill.',
'w2-7':'To qualify an initiative for the ballot, sponsors need signatures equal to **8% of the votes cast for governor in the last election**.',
'w2-8':'An **initiative to the Legislature** **goes to lawmakers first**. If they don\'t pass it, it goes to the ballot.',
'w2-9':'Washington\'s constitution says property taxes must be **uniform**, and in 1933 the state Supreme Court ruled that **income is property**. So a graduated income tax has been blocked, and voters rejected several, most recently in 2010. That left the state leaning on **sales and property taxes**, one of the most regressive systems in the country. Two cracks: a **capital gains tax** (upheld in 2023 as an excise tax, not an income tax) and the **2026 millionaires tax**, which is sure to be tested in court.',
/* w3 Running for Local Office */
'w3-0':'Washington candidates officially file to run during **filing week in May**. Then comes the August primary and November general.',
'w3-1':'The filing fee for a paid office is generally **1% of the office\'s annual salary**.',
'w3-2':'Can\'t afford the fee? You can **submit signatures instead**. Money shouldn\'t block you from the ballot.',
'w3-3':'Washington state and local candidates report money raised and spent to the **Public Disclosure Commission (PDC)**. (Federal races report to the FEC.)',
'w3-4':'Every campaign starts with its **win number**: **the number of votes needed to win**.',
'w3-5':'Math time: in a two-candidate race with about **40,000** voters, you need a majority. Half is 20,000, so the rough win number is **20,001**. (Real campaigns add a safety cushion.)',
'w3-6':'Going door to door to talk with voters is **canvassing**. It\'s still the most effective way to win votes.',
'w3-7':'Campaigns use the **voter file** to **see who\'s registered and how often they vote, so they can target outreach**. Ballots stay secret; the file never shows who you voted for.',
'w3-8':'A common first step toward local office: **serving on a city board, commission, or neighborhood group**. You build experience and a network.',
'w3-9':'In Washington, **Precinct Committee Officers (PCOs)** are **elected neighborhood-level party representatives**. It\'s the most grassroots elected position there is.',
/* w4 Organizing & Running Meetings */
'w4-0':'Under **Robert\'s Rules**, someone makes a motion ("I move that..."), then **another member seconds it** before debate begins. No second, no debate.',
'w4-1':'A **quorum** is **the minimum number of members needed to do official business**. Without one, no binding votes.',
'w4-2':'The official record of what a meeting decided is the **minutes**. Good minutes list motions and results, not every word said.',
'w4-3':'The rules that govern how an organization runs itself are its **bylaws**. Read your chapter\'s bylaws before you run for anything.',
'w4-4':'In organizing, a **one-on-one** is **a conversation to build a relationship and learn what someone cares about**. Listen far more than you talk.',
'w4-5':'**Power mapping** helps a campaign figure out **who has the power to decide an issue and who influences them**.',
'w4-6':'A campaign\'s **target** is **a specific person with the power to grant the demand**: a named councilmember, not "the city."',
'w4-7':'Changed your mind? Robert\'s Rules lets members move to **rescind or amend something previously adopted** at an earlier meeting.',
'w4-8':'Moving the **"previous question"** **ends debate** and goes straight to a vote. It usually **needs a two-thirds vote**, since it cuts off discussion.',
'w4-9':'**DSA\'s National Political Committee** is elected at **the national convention, held every two years** by delegates from the chapters.',
/* l1 Laws in the News */

'l1-3':'The same law raised the bar for objecting to a state\'s electoral votes: it now needs **one-fifth of each chamber**, up from one member of each.',
'l1-4':'The **Respect for Marriage Act (2022)** requires **recognition of valid same-sex and interracial marriages performed in other states**.',
'l1-5':'The **Infrastructure Investment and Jobs Act (2021)** paid for **roads, bridges, broadband, water systems, and transit**.',
'l1-6':'The **Laken Riley Act** (January 2025), about detaining certain immigrants, was **the first bill Trump signed in his second term**.',
'l1-7':'The **TAKE IT DOWN Act (2025)** targets **nonconsensual intimate images, including AI deepfakes**, and requires platforms to remove them quickly.',
'l1-8':'The **GENIUS Act (2025)** created the first federal rules for **stablecoins**, a kind of cryptocurrency pegged to the dollar.',
'l1-9':'The **One Big Beautiful Bill Act**, signed July 4, 2025, passed the Senate with a simple majority because it used **budget reconciliation**. Notice a pattern?',
'l1-10':'The **CARES Act (2020)** was a roughly **$2 trillion pandemic relief law**, including stimulus checks.',
'l1-11':'Four big recent laws and what each one mainly did:',
/* l2 Bills & Amendments to Watch */
'l2-0':'**One Congress lasts 2 years**, matching the House election cycle.',
'l2-1':'Congresses are numbered, and **a new one starts every two years** because **every House seat is up for election every two years**. Each Congress begins on January 3 of an odd year. The 119th ran from 2025 to 2027.',
'l2-2':'When a Congress ends, unpassed bills die. **They have to be reintroduced in the next Congress** and start over.',
'l2-3':'Each Congress lasts two years. When it ends, any bill not yet passed by both chambers **dies when the Congress ends and must be reintroduced and passed again by both chambers**. Track bills on Congress.gov.',
'l2-4':'**Virginia** ratified the **Equal Rights Amendment** in 2020 as the 38th state. It\'s still not in the Constitution because **the deadline Congress set had passed and the Archivist hasn\'t certified it**.',
'l2-5':'The **National Popular Vote Interstate Compact** would give a state\'s electors to the national vote winner. It **takes effect when states with at least 270 electoral votes join**.',
'l2-6':'Want to cap how long members of Congress serve? That would take **a congressional term limits amendment**. The 22nd Amendment only limits Presidents.',
'l2-7':'The filibuster isn\'t in the Constitution, so **ending it would only require changing Senate rules**, not amending the Constitution.',
'l2-8':'A **Balanced Budget Amendment** would require **the federal government not to spend more than it takes in**, with some exceptions like war.',
'l2-9':'Article V gives two ways to **propose** an amendment: **two-thirds of both houses of Congress**, or **a convention called by two-thirds of state legislatures**. Every amendment so far used the first. Ratification then takes **three-fourths of the states**.',

/* w5 Know Your Reps (officeholders checked Nov. 2026) */
'w5-0':'Seattle\'s mayor is **Katie Wilson**. She beat incumbent Bruce Harrell in November 2025 by less than one point and took office in **January 2026**.',

'w5-3':'Four officials are elected by the whole city:',

/* l3 On Your Ballot */
'l3-0':'A **levy** is **a voter-approved property tax for a set number of years and a specific purpose**. When it expires, voters must renew it.',

'l3-4':'In March 2026 the Legislature passed, and Gov. Ferguson signed, a **9.9% tax on household income over $1 million**. Washington had no income tax before.',

'l3-6':'In November 2026, **Initiative 645** asked voters to repeal the tax. **Voters rejected it** (over 57% No), **so the tax stays**.',

'l3-10':'Statewide, **Initiative 638** bars transgender girls from girls\' school sports regulated by the WIAA. It was **approved by about 56% of voters**.',
'tt1-0':'Big states wanted seats by population. Small states wanted equal seats. Two chambers were the fix: **to settle the fight between big states (who wanted seats by population) and small states (who wanted equal seats)**. The House follows population, and the Senate gives each state two.',
'tt1-1':'Senators serve 6 years, and only a third face voters at once. The goal: **to make the Senate a steadier, slower check on quick swings in public mood**. Madison called it a guard against "temporary errors."',
'tt1-2':'Federal judges serve "during good behavior," which in practice means for life. That\'s deliberate: **so they can rule without fear of losing their jobs over unpopular decisions**. Hamilton defends this in Federalist No. 78.',
'tt1-3':'The Origination Clause says revenue bills start in the House. Why? **The House is closest to the voters, so the power to tax starts with the people\'s chamber**. The Senate can still amend them.',
'tt1-4':'The framers argued over who should pick the president. The Electoral College was the middle ground: **as a compromise between having Congress pick the president and a direct popular vote**.',
'tt1-5':'An amendment needs two-thirds of Congress and three-fourths of the states. The point: **so changes need broad, lasting agreement, not a passing majority**. Only 27 amendments have made it.',
'tt1-6':'Before **1913**, **state legislatures chose senators**, so state governments had a direct voice in Washington. Critics of the **17th Amendment** say direct election cut that tie. Supporters answer that legislatures were often deadlocked or bribed, and that voters should choose.',
'tt1-7':'Judicial review comes from Marbury v. Madison (1803), not the text. Without it, **no court could strike down a law that breaks the Constitution**. The Constitution\'s limits would depend on Congress policing itself.',
'tt1-8':'In **Federalist No. 84**, Hamilton warned that listing rights might imply the government could violate **any right not listed**. The **9th Amendment** answers him: listing some rights **doesn\'t deny** others.',
'tt1-9':'Article VI says "no religious Test shall ever be required" for federal office. That means **no one can be required to hold a certain faith to serve**. Several states had such tests at the time.',
'tt1-10':'Here\'s a surprise: the Constitution **never mentions political parties**. That makes this statement **False**. Parties grew up anyway in the 1790s, despite Washington\'s warning.',
'tt1-11':'The veto is the President\'s main check on Congress. Without it, **Congress could pass any law with no check from the president**. Overriding a veto takes two-thirds of both chambers.',
'tt2-0':'The Vice President is President of the Senate but votes only to break a tie. So in a 50-50 split, **the vice president can cast the tie-breaking vote**.',
'tt2-1':'A bill needs a majority, and 50-50 isn\'t one. With no Vice President voting, **the bill fails, because a tie is not a majority**.',
'tt2-2':'Overriding a veto takes two-thirds of **both** chambers. The House cleared it, but 60-40 is short of 67 in the Senate. So **the veto stands, since the Senate fell short of two-thirds**.',
'tt2-3':'Presidents can fill posts without confirmation during a **Senate recess**. In **NLRB v. Noel Canning** (2014), the Court said a break of **under 10 days** is usually too short. So the Senate holds **pro forma sessions** every few days to **block recess appointments**.',
'tt2-4':'When Congress has adjourned, an unsigned bill dies by **pocket veto**. Since there\'s no veto to vote on, Congress **can\'t override** it. It has to **start over and pass the bill again**.',
'tt2-5':'Under the 12th Amendment, if no one wins 270 electoral votes, **the House, with each state delegation casting one vote**, picks the president. Wyoming and California count the same.',
'tt2-6':'In the same deadlock, **the Senate** picks the Vice President, with each senator voting. That means the two could come from different parties.',
'tt2-7':'Under the **Presidential Succession Act of 1947**, the **Speaker** is next after the vice president. To take the job, the Speaker must **resign from the House and the speakership**, because no one can serve in Congress and the executive branch at once.',
'tt2-8':'The 25th Amendment also fills a VP vacancy: **the president nominates someone, and both the House and Senate confirm by majority vote**. Gerald Ford became VP this way in 1973.',
'tt2-9':'Under the **Supremacy Clause**, the federal ban still applies everywhere, so federal agents **can** enforce it. But under the **anti-commandeering** rule (Printz, 1997; Murphy, 2018), Congress **can\'t force states to enforce** federal law. So states can stop enforcing their own bans, and mostly the feds have looked away.',
'tt2-10':'If the Court splits 4-4, **the lower court\'s ruling stands, but sets no national precedent**. It\'s as if the Supreme Court never took the case.',
'tt2-11':'Passing a bill takes a simple majority, but **ending debate (cloture) takes 60 votes**. With only **53** supporters, the minority can **filibuster** and the bill stalls, unless it goes through **budget reconciliation**.',
'tt3-0':'Cloture takes **60 votes**. With 58 supporters, the bill needs **2** more. That\'s why a handful of moderate senators often hold the real power.',
'tt3-1':'Ending debate on a **change to the Senate rules** takes **two-thirds** of senators voting. So in **2013** and **2017**, majorities set a new **precedent** by simple majority instead, ending filibusters on nominations. That\'s the "nuclear option."',
'tt3-2':'Reconciliation dodges the filibuster, but the **Byrd rule** limits it to **taxes and spending**. Anything "extraneous" can be struck on a point of order, and **waiving** that takes **60 votes**. The Senate parliamentarian advises on what qualifies, which is why it\'s called the "Byrd bath."',
'tt3-4':'Today a vote in a safe state barely matters to campaigns, since the state\'s electors are already decided. Under a **national popular vote**, every vote counts the same, so **turnout in big one-sided states** like California and Texas would suddenly matter.',
'tt3-5':'In 48 states, **winner-take-all** gives every elector to whoever wins the state. In safe states the result is a given, so campaigns pour time and money into the handful of **swing states** where the outcome is close.',
'tt3-6':'The popular-vote loser has won five times. The two most recent were **2000 and 2016**.',
'tt3-8':'Federal contribution limits are **set by law and indexed to inflation**, so the FEC adjusts them **every two years**. For 2025–26, one person could give a candidate **$3,500 per election**, with primary and general counted separately. Citizens United did not touch these limits.',
'tt3-9':'Super PACs must report their donors. But some nonprofits that spend on politics don\'t. That\'s "dark money": **political spending by groups, often nonprofits, that don\'t have to disclose their donors**.',
'tt3-10':'Citizens United was a constitutional ruling, so Congress can\'t undo it by statute. It would take **a new Supreme Court ruling or a constitutional amendment**.',

'w6-9':'**HB 1110** (2023) requires larger cities to **allow several homes per residential lot**, with **more near major transit** or when some are affordable. That\'s called **middle housing**.',

'w9-0':'In **February 1919**, about **65,000** workers joined the **Seattle General Strike**, the **first citywide general strike in the United States**, backing striking shipyard workers.',
'w9-1':'The **"Wobblies"** were members of the **Industrial Workers of the World (IWW)**, a radical union that organized loggers, miners, and dockworkers.',
