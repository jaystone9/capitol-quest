name: Play reminders
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock web-push@3.6.7
      - run: node scripts/remind.mjs
        env:
          FIREBASE_PROJECT: capitol-quest-f793e
          FIREBASE_API_KEY: AIzaSyAsQBMCIDIzfIZ7JxFvfOQaKqYv2RQjPWo
          VAPID_PUBLIC_KEY: ''
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
